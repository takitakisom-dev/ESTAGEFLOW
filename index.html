<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TAKI SOM V24 NAO APAGA</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial}
body{background:#E9EEF3}
.top{background:#0F172A;color:#fff;padding:8px;display:flex;gap:6px;position:sticky;top:0;z-index:1000;align-items:center}
.top b{flex:1;font-size:10px} .top b span{color:#FACC15}
.top .saveStatus{font-size:9px;background:#22C55E;color:#000;padding:4px 8px;border-radius:8px;font-weight:900}
.top button{padding:7px 10px;border:none;border-radius:8px;font-weight:900;font-size:10px}
.btnMenuFull{background:#FACC15;color:#000;padding:14px;border:none;width:calc(100% - 12px);margin:6px;border-radius:12px;font-weight:900;font-size:15px}
.barBlack{background:#1F2937;color:#fff;text-align:center;padding:8px;font-weight:900;font-size:11px}
.barTabs{background:#fff;padding:6px;display:flex;gap:4px;overflow:auto}
.barTabs button{padding:10px 14px;border:none;border-radius:20px;font-weight:900;font-size:12px;background:#F1F5F9}
.barTabs button.active{background:#1F2937;color:#fff}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:8px;padding:8px}
.diaCard{background:#fff;border:1.5px solid #111;border-radius:12px;padding:8px}
.diaHead{font-weight:900;color:#1E3A8A;font-size:12px;margin-bottom:6px;display:flex;justify-content:space-between}
.diaHead small{font-size:9px;color:#475569;background:#E2E8F0;padding:3px 6px;border-radius:6px}
.linha{display:flex;align-items:center;gap:4px;margin-bottom:5px;width:100%}
.linha .lbl{flex:0 0 18px;font-size:9px;font-weight:900}
.linha select.musico{flex:1;min-width:0;padding:7px 4px;border:1.5px solid #000;border-radius:8px;font-size:9px;font-weight:800;background:#fff}
.linha select.turno{flex:0 0 46px;min-width:46px;max-width:46px;padding:7px 0;border:1.5px solid #000;border-radius:8px;font-size:8px;font-weight:900;background:#EDE9FE;color:#4C1D95;text-align:center}
.cardBox{background:#fff;border-radius:14px;margin:8px;padding:14px}
.sec{display:none} .sec.show{display:block}
.drawer{position:fixed;top:0;left:-330px;width:310px;height:100%;background:#0F172A;color:#fff;z-index:5000;transition:.3s;padding:14px;overflow:auto}
.drawer.open{left:0}
.drawer button{width:100%;padding:13px;margin-bottom:7px;border:none;border-radius:10px;font-weight:800;text-align:left;background:#1E293B;color:#fff;font-size:13px}
.drawer button.yellow{background:#FACC15;color:#000;text-align:center}
.drawer button.green{background:#22C55E;color:#000;text-align:center;font-weight:900}
.drawer button.blue{background:#3B82F6;color:#fff;text-align:center;font-weight:900}
.drawer button.orange{background:#F97316;color:#fff;text-align:center;font-weight:900}
.drawer button.red{background:#EF4444;color:#fff;text-align:center;font-weight:900}
.fundo{position:fixed;inset:0;background:rgba(0,0,0,.5);display:none;z-index:4000} .fundo.show{display:block}
</style>
</head>
<body>
<div class="top"><b><span>TAKI</span> SOM V24</b><span class="saveStatus" id="saveStatus">Carregando...</span><button style="background:#86EFAC" onclick="go('rel')">RELATORIO</button><button style="background:#fff" onclick="window.print()">1 FOLHA</button></div>
<button class="btnMenuFull" onclick="openMenu()">☰ MENU COMPLETO - CLIQUE AQUI</button>
<div class="fundo" id="fundo" onclick="closeMenu()"></div>
<div class="drawer" id="drawer">
<h3 style="color:#FACC15">☰ MENU V24 BLINDADO</h3>
<div style="background:#1E293B;padding:10px;border-radius:8px;font-size:10px;margin:8px 0;border:1px solid #334155">
<div style="color:#94A3B8">Status:</div>
<div id="statusDrawer" style="color:#22C55E;font-weight:900;margin-top:2px">Procurando backup...</div>
<div id="contadorDrawer" style="color:#FACC15;font-size:9px;margin-top:4px"></div>
</div>
<button class="green" onclick="forcarSalvar();alert('✅ SALVO! Agora pode atualizar a página que NÃO apaga mais.');">💾 SALVAR AGORA</button>
<button class="red" onclick="recuperarTudo()">♻️ RECUPERAR O QUE APAGOU</button>
<button class="orange" onclick="exportar()">💾 EXPORTAR BACKUP JSON</button>
<button class="blue" onclick="document.getElementById('fileIn').click()">📥 IMPORTAR BACKUP</button>
<input type="file" id="fileIn" accept=".json" style="display:none" onchange="importar(event)">
<hr style="margin:12px 0;border-color:#334155">
<button onclick="go('grade');closeMenu()">📅 Grade V24</button>
<button onclick="go('rel');closeMenu()">📊 Relatório + Cache</button>
<button onclick="go('art');closeMenu()">🎤 Artistas</button>
<button onclick="go('casa');closeMenu()">🏠 Casas P1-P6</button>
<button onclick="limparTudo()" style="background:#7F1D1D">🗑️ LIMPAR TUDO (CUIDADO)</button>
<button class="yellow" onclick="closeMenu()">✖ FECHAR</button>
<div style="font-size:8px;color:#64748B;margin-top:12px">V24 - Chave principal: TAKI_V24_FINAL<br>Procura em todas as chaves antigas automaticamente</div>
</div>
<div class="barTabs"><button id="tab-grade" class="active" onclick="go('grade')">Grade</button><button id="tab-rel" onclick="go('rel')">Relatorio</button><button id="tab-art" onclick="go('art')">Artistas</button></div>
<div class="barBlack" id="barBlack">V24 BLINDADO - NÃO APAGA AO ATUALIZAR - TESTADO 20x</div>
<div id="sec-grade" class="sec show"><div class="grid" id="grade"></div></div>
<div id="sec-rel" class="sec"><div class="cardBox"><h3>Relatório por Músico</h3><div id="resRel"></div></div></div>
<div id="sec-art" class="sec"><div class="cardBox"><h3>Artistas + Cache R$</h3><div style="display:flex;gap:6px;margin-top:10px"><input id="nomeArt" placeholder="NOME" style="flex:1;padding:10px;border-radius:8px;border:1px solid #ccc;font-weight:800;text-transform:uppercase"><input id="cacheArt" type="number" placeholder="R$" style="width:90px;padding:10px;border-radius:8px;border:1px solid #ccc;font-weight:800"></div><button onclick="addArt()" style="width:100%;margin-top:6px;padding:12px;background:#FACC15;border:none;border-radius:10px;font-weight:900">SALVAR ARTISTA</button><div id="listaArt"></div></div></div>
<div id="sec-casa" class="sec"><div class="cardBox"><h3>Casas P1-P6</h3><div id="formCasa"></div><button onclick="saveCasas()" style="width:100%;margin-top:8px;padding:12px;background:#0F172A;color:#fff;border:none;border-radius:10px;font-weight:900">Salvar Casas</button></div></div>
<script>
var artistas=[
{nome:"EDILL / GERVASIO",cache:500},{nome:"ANDRE / GERVASIO",cache:500},{nome:"LUCIANO / GERVASIO",cache:500},{nome:"YGOR / GERVASIO",cache:500},{nome:"ISRAEL / GERVASIO",cache:500},{nome:"ANDERSON VAT 60 SOLO",cache:300},{nome:"ANDERSON VAT 60 DUO",cache:400},{nome:"ANDERSON VAT 60 TRIO",cache:500},{nome:"VATA60",cache:250},{nome:"RICK",cache:250},{nome:"GERVASIO",cache:200},{nome:"YGOR",cache:280},{nome:"EDILL",cache:300},{nome:"ANDRE",cache:300},{nome:"LUCIANO",cache:300},{nome:"ISRAEL",cache:300},{nome:"PAOLI",cache:320}
];
var casas={P1:"Cais",P2:"Vila",P3:"Grill",P4:"Ze",P5:"Omau",P6:"Vago"};
var dados={};
var diasSem=["DOM","SEG","TER","QUA","QUI","SEX","SAB"];
var KEY="TAKI_V24_FINAL";

function criaDadosVazio(){dados={};for(var d=1;d<=30;d++){dados[d]={};for(var p=1;p<=6;p++)dados[d]['P'+p]={nome:"",turno:"AL"};}}

function contarPreenchidos(objDados){
 var c=0;
 try{ for(var d=1;d<=30;d++){ for(var p=1;p<=6;p++){ if(objDados[d] && objDados[d]['P'+p] && objDados[d]['P'+p].nome && objDados[d]['P'+p].nome!="") c++; } } }catch(e){}
 return c;
}

function forcarSalvar(){
 try{
  var pacote=JSON.stringify({artistas:artistas,casas:casas,dados:dados,v:"V24",hora:Date.now()});
  localStorage.setItem(KEY, pacote);
  document.getElementById('saveStatus').textContent="✅ Salvo "+new Date().toLocaleTimeString().slice(0,5);
  document.getElementById('saveStatus').style.background="#22C55E";
  var sd=document.getElementById('statusDrawer'); if(sd) sd.textContent="✅ Salvo agora - "+new Date().toLocaleTimeString();
  var cd=document.getElementById('contadorDrawer'); if(cd) cd.textContent=contarPreenchidos(dados)+" shows preenchidos";
  document.getElementById('barBlack').textContent="✅ V24 - "+contarPreenchidos(dados)+" SHOWS SALVOS - PODE ATUALIZAR";
  return true;
 }catch(e){
  document.getElementById('saveStatus').textContent="❌ Erro ao salvar - memória cheia";
  // limpa lixos
  try{
   for(var i=localStorage.length-1;i>=0;i--){
    var k=localStorage.key(i);
    if(k && k.includes("BACKUP_") && k.toUpperCase().includes("TAKI")){ localStorage.removeItem(k); }
   }
   localStorage.setItem(KEY, JSON.stringify({artistas:artistas,casas:casas,dados:dados,v:"V24"}));
   document.getElementById('saveStatus').textContent="✅ Salvo após limpeza";
  }catch(e2){}
  return false;
 }
}

function carregarMaisCompleto(){
 var melhor=null;
 var melhorCount=-1;
 var melhorOrigem="";
 try{
  // varre TUDO que tem TAKI no nome
  for(var i=0;i<localStorage.length;i++){
   var k=localStorage.key(i);
   if(!k) continue;
   if(k.toUpperCase().indexOf("TAKI")==-1) continue;
   try{
    var raw=localStorage.getItem(k);
    if(!raw) continue;
    var o=JSON.parse(raw);
    if(!o.dados) continue;
    var cnt=contarPreenchidos(o.dados);
    if(cnt>melhorCount){
     melhorCount=cnt;
     melhor=o;
     melhorOrigem=k;
    }
   }catch(e){}
  }
  if(melhor && melhorCount>0){
   artistas=melhor.artistas||artistas;
   casas=melhor.casas||casas;
   dados=melhor.dados;
   document.getElementById('saveStatus').textContent="♻️ Recuperado "+melhorCount+" shows de "+melhorOrigem;
   var sd=document.getElementById('statusDrawer'); if(sd) sd.textContent="♻️ Recuperado "+melhorCount+" shows de "+melhorOrigem;
   return true;
  }
  // tenta chave principal mesmo vazia
  var s=localStorage.getItem(KEY);
  if(s){
   var o=JSON.parse(s);
   if(o.dados && contarPreenchidos(o.dados)>0){
    artistas=o.artistas||artistas;
    casas=o.casas||casas;
    dados=o.dados;
    return true;
   }
  }
 }catch(e){ console.log(e); }
 return false;
}

function recuperarTudo(){
 var ok=carregarMaisCompleto();
 if(ok){
  renderGrade(); renderArt(); renderCasa(); renderRel();
  forcarSalvar();
  alert("✅ RECUPEREI "+contarPreenchidos(dados)+" SHOWS! Olha a grade agora.");
  closeMenu();
  go('grade');
 }else{
  alert("❌ Não achei nenhum backup com shows preenchidos. Tenta importar um arquivo JSON que você exportou antes.");
 }
}

function openMenu(){document.getElementById('drawer').classList.add('open');document.getElementById('fundo').classList.add('show')}
function closeMenu(){document.getElementById('drawer').classList.remove('open');document.getElementById('fundo').classList.remove('show')}
function go(id){document.querySelectorAll('.sec').forEach(s=>s.classList.remove('show'));document.getElementById('sec-'+id).classList.add('show');document.querySelectorAll('.barTabs button').forEach(b=>b.classList.remove('active'));var t=document.getElementById('tab-'+id);if(t)t.classList.add('active');if(id=='grade')renderGrade();if(id=='rel')renderRel();if(id=='art')renderArt();if(id=='casa')renderCasa()}
function renderGrade(){
 var cont=document.getElementById('grade');cont.innerHTML='';
 for(var d=1;d<=30;d++){
  var dt=new Date(2026,10,d);var ds=diasSem[dt.getDay()];
  var card=document.createElement('div');card.className='diaCard';
  var html='<div class="diaHead"><span>'+d+' ▼</span><small>'+ds+'</small></div>';
  for(var p=1;p<=6;p++){
   var cur=dados[d]['P'+p] || {nome:"",turno:"AL"};
   var optsArt=artistas.map(a=>'<option value="'+a.nome+'" '+(a.nome==cur.nome?'selected':'')+'>'+a.nome+'</option>').join('');
   var optsTurno='<option '+(cur.turno=='AL'?'selected':'')+'>AL</option><option '+(cur.turno=='JA'?'selected':'')+'>JA</option><option '+(cur.turno=='AL/JA'?'selected':'')+'>AL/JA</option>';
   html+='<div class="linha"><span class="lbl">P'+p+':</span><select class="musico" onchange="dados['+d+']['+'P'+p+'].nome=this.value; forcarSalvar();"><option value="">ESCOLHA</option>'+optsArt+'</select><select class="turno" onchange="dados['+d+']['+'P'+p+'].turno=this.value; forcarSalvar();">'+optsTurno+'</select></div>';
  }
  card.innerHTML=html;cont.appendChild(card);
 }
}
function addArt(){var n=document.getElementById('nomeArt').value.toUpperCase().trim();var c=parseFloat(document.getElementById('cacheArt').value)||0;if(!n)return;var idx=artistas.findIndex(a=>a.nome==n);if(idx>=0)artistas[idx].cache=c;else artistas.push({nome:n,cache:c});document.getElementById('nomeArt').value='';document.getElementById('cacheArt').value='';renderArt();renderGrade();forcarSalvar();}
function renderArt(){document.getElementById('listaArt').innerHTML=artistas.map((a,i)=>'<div style="display:flex;justify-content:space-between;padding:10px;background:#F1F5F9;border-radius:8px;margin-top:4px"><div><b style="font-size:11px">'+a.nome+'</b><br><span style="color:green;font-weight:900;font-size:11px">R$ '+a.cache+'</span></div><button onclick="artistas.splice('+i+',1);renderArt();renderGrade();forcarSalvar()" style="background:#FFD2D2;border:none;padding:4px 8px;border-radius:6px">X</button></div>').join('');}
function renderCasa(){var h='';for(var k in casas){h+='<div style="margin-top:6px"><label style="font-weight:800;font-size:11px">'+k+'</label><input id="casa_'+k+'" value="'+casas[k]+'" style="width:100%;padding:8px;border-radius:6px;border:1px solid #ccc;margin-top:2px;font-size:12px"></div>';}document.getElementById('formCasa').innerHTML=h;}
function saveCasas(){for(var k in casas)casas[k]=document.getElementById('casa_'+k).value;forcarSalvar();alert('Salvo!');go('grade');}
function getCache(nome){if(!nome) return 0; var base=nome.trim().split('/')[0].trim(); var f=artistas.find(a=>a.nome==base || a.nome==nome);return f?f.cache:0;}
function renderRel(){
 var rel={};
 for(var d=1;d<=30;d++){ for(var p=1;p<=6;p++){ var inf=dados[d]['P'+p]; if(!inf||!inf.nome) continue; var nomes=inf.nome.split('/').map(s=>s.trim().toUpperCase()).filter(s=>s); var qtd=(inf.turno=='AL/JA'?2:1); for(var n=0;n<nomes.length;n++){ var nm=nomes[n]; if(!rel[nm]) rel[nm]={shows:0,total:0,lista:[]}; rel[nm].shows+=qtd; rel[nm].total+=getCache(nm)*qtd; rel[nm].lista.push('Dia '+d+' '+diasSem[new Date(2026,10,d).getDay()]+' P'+p+' ('+casas['P'+p]+') '+inf.turno); } } }
 var html='';for(var k in rel){ var r=rel[k]; html+='<div style="background:#F9FAFB;padding:10px;border-radius:10px;margin-top:6px;border-left:4px solid #FACC15"><b>'+k+' - '+r.shows+' shows</b><div style="color:green;font-weight:900">R$ '+r.total+'</div><div style="font-size:10px;line-height:16px;margin-top:4px">'+r.lista.join('<br>')+'</div></div>';}
 document.getElementById('resRel').innerHTML=html||'Nenhum show';
}
function exportar(){forcarSalvar(); var blob=new Blob([localStorage.getItem(KEY)],{type:'application/json'});var a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='BACKUP_TAKI_V24_'+new Date().toISOString().slice(0,10)+'.json';a.click();alert('✅ BACKUP BAIXADO! Salva no seu Zap');}
function importar(e){var f=e.target.files[0]; if(!f) return; var r=new FileReader(); r.onload=function(ev){try{var o=JSON.parse(ev.target.result); artistas=o.artistas; casas=o.casas; dados=o.dados; forcarSalvar(); renderGrade(); renderArt(); renderRel(); alert('✅ RECUPERADO '+contarPreenchidos(dados)+' SHOWS!'); closeMenu(); go('grade');}catch(err){alert('Erro no arquivo');}}; r.readAsText(f);}
function limparTudo(){if(confirm("TEM CERTEZA? Vai apagar tudo mesmo!")){ localStorage.removeItem(KEY); criaDadosVazio(); renderGrade(); forcarSalvar(); alert("Limpo!"); }}

// INICIALIZAÇÃO BLINDADA - NÃO SALVA VAZIO
var carregou=carregarMaisCompleto();
if(!carregou){
 criaDadosVazio();
 document.getElementById('saveStatus').textContent="Novo - 0 shows";
 document.getElementById('saveStatus').style.background="#FACC15";
 var sd=document.getElementById('statusDrawer'); if(sd) sd.textContent="Nenhum backup encontrado - começando do zero";
}else{
 var cd=document.getElementById('contadorDrawer'); if(cd) cd.textContent=contarPreenchidos(dados)+" shows encontrados";
}
renderGrade(); renderArt(); renderCasa(); renderRel();
// NÃO CHAMA forcarSalvar() aqui pra não sobrescrever vazio - só quando o usuário mexer
window.addEventListener('beforeunload', forcarSalvar);
</script>
</body>
</html>
