<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ESTAGEFLOW</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:Arial,sans-serif}
body{background:#e9e9e9}
.top{background:#111;color:#fff;padding:12px 12px;display:flex;align-items:center;gap:8px;position:sticky;top:0;z-index:20}
.top b{font-size:24px;white-space:nowrap}
.badge-f{background:#f1c40f;color:#111;border-radius:10px;padding:4px 10px;text-align:center;line-height:1}
.badge-f b{font-size:18px;display:block}
.badge-f span{font-size:11px;font-weight:800}
.badge-v{background:#00c853;color:#fff;border-radius:10px;padding:8px 10px;font-size:16px;font-weight:800;white-space:nowrap}
.btn-menu{margin-left:auto;background:#222;color:#fff;border:1px solid #444;width:44px;height:44px;border-radius:10px;font-size:24px;cursor:pointer;flex-shrink:0}
/* MENU */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);display:none;z-index:30}
.overlay.show{display:block}
.drawer{position:fixed;top:0;right:0;width:280px;max-width:85vw;height:100%;background:#fff;z-index:31;transform:translateX(100%);transition:.25s;box-shadow:-4px 0 20px rgba(0,0,0,.3);display:flex;flex-direction:column}
.drawer.open{transform:translateX(0)}
.drawer-head{background:#111;color:#fff;padding:18px;display:flex;justify-content:space-between;align-items:center}
.drawer-head b{font-size:20px}
.close{background:#333;color:#fff;border:0;width:36px;height:36px;border-radius:50%;font-size:18px;cursor:pointer}
.drawer button.item{background:none;border:0;border-bottom:1px solid #eee;padding:16px 18px;text-align:left;font-size:16px;font-weight:700;cursor:pointer;display:flex;justify-content:space-between;align-items:center}
.drawer button.item:active{background:#f2f2f2}
.drawer .rodape{margin-top:auto;padding:16px;color:#888;font-size:12px;text-align:center}
.grid{padding:12px;display:grid;grid-template-columns:1fr;gap:14px}
.card{background:#fff;border-radius:18px;padding:16px 14px 18px;box-shadow:0 2px 8px rgba(0,0,0,.12)}
.head{font-size:20px;font-weight:800;color:#111;padding:0 4px 14px;line-height:1.2}
.linha{display:flex;gap:8px;align-items:center;padding:4px 0}
.p{font-size:16px;color:#666;width:38px;flex-shrink:0}
select{height:42px;border:0;border-radius:22px;font-weight:800;cursor:pointer;color:#111;text-align:center}
select.nome{flex:1;min-width:0;background:#00e676;font-size:16px;padding:0 6px}
select.nome.amarelo{background:#d4c72a}
select.nome.branco{background:#fff;border:1px solid #ddd}
select.turno{width:58px;flex-shrink:0;font-size:16px}
select.turno.ja{background:#00e676}
select.turno.al{background:#f1c40f}
select.turno.alja{background:#00e676}
.plus{background:#111;color:#fff;border:0;width:42px;height:42px;border-radius:50%;font-size:24px;cursor:pointer;flex-shrink:0}
.del{background:#ff2d2d;color:#fff;border:0;width:42px;height:42px;border-radius:50%;font-size:20px;cursor:pointer;flex-shrink:0}
.resumo{background:#111;color:#fff;border-radius:12px;padding:14px;margin:0 12px 4px;font-size:14px;line-height:1.6;display:none}
</style>
</head>
<body>
<div class="top"><b>ESTAGEFLOW</b><div class="badge-f"><b>197</b><span>FIXOS</span></div><div class="badge-v">R$ 75350</div><button class="btn-menu" onclick="abrirMenu()">☰</button></div>

<div class="overlay" id="overlay" onclick="fecharMenu()"></div>
<div class="drawer" id="drawer">
  <div class="drawer-head"><b>MENU</b><button class="close" onclick="fecharMenu()">×</button></div>
  <button class="item" onclick="verResumo()">📊 Ver Resumo <span>›</span></button>
  <button class="item" onclick="adicionarMusico()">🎤 Adicionar Músico <span>›</span></button>
  <button class="item" onclick="exportarWhats()">💬 Exportar p/ WhatsApp <span>›</span></button>
  <button class="item" onclick="copiarEscala()">📋 Copiar Escala <span>›</span></button>
  <button class="item" onclick="limparTudo()">🧹 Limpar Tudo <span>›</span></button>
  <div class="rodape">ESTAGEFLOW • Taki Artesanal</div>
</div>

<div class="resumo" id="resumo"></div>
<div class="grid" id="grid"></div>
<script>
const MUSICOS=["ESCOLHA","ISRAEL","YGOR","LUCIANO","ANDRE","ANDERSON VAT 60 SOLO","ROBSON SOLO","RICK SOLO","PAOLI","DOUGLAS","EDILL","VAT 60","MARTIN","FELIPE DUO","DUO CLASSIC ROCK","VAT 60 EVENTO"];
const DIAS=[
{head:"23 SEG — NOV/2026 SEGUNDA",rows:[["P1:","ISRAEL","JA"],["P2:","YGOR","AL"],["P3:","LUCIANO","JA"],["P4:","ANDRE","AL"],["P5:","ANDERSON VAT 60 SOLO","JA"],["P6:","ROBSON SOLO","AL"]]},
{head:"24 TER — NOV/2026 TERÇA",rows:[["P1:","RICK SOLO","JA"],["P2:","PAOLI","AL"],["P3:","DOUGLAS","JA"],["P4:","EDILL","AL"],["P5:","ISRAEL","JA"],["P6:","YGOR","AL"]]},
{head:"25 QUA — NOV/2026 QUARTA",rows:[["P1:","DOUGLAS","JA"],["P2:","ANDRE","JA"],["P3:","RICK SOLO","JA"],["P4:","ROBSON SOLO","JA"],["P5:","EDILL","JA"],["P6:","ESCOLHA","AL"]]},
{head:"26 QUI — NOV/2026 QUI",rows:[["P1:","DOUGLAS","JA"],["P2:","EDILL","AL"],["P3:","ISRAEL","JA"],["P4:","YGOR","AL"],["P5:","LUCIANO","JA"],["P6:","ANDRE","AL"]]},
{head:"27 SEX — NOV/2026 SEXTA",rows:[["P1:","YGOR","JA"],["P2:","EDILL","JA"],["P3:","ANDRE","JA"],["P4:","LUCIANO","JA"],["P5:","VAT 60","JA"],["P6:","ESCOLHA","AL"]]},
{head:"28 SÁB — NOV/2026 SÁBADO",rows:[["P1:","EDILL","AL/JA"],["P2:","YGOR","AL/JA"],["P3:","LUCIANO","AL"],["P4:","PAOLI","JA"],["P5:","VAT 60","AL/JA"],["P6:","RICK SOLO","AL/JA"]]},
{head:"29 DOM — NOV/2026 DOMINGO",rows:[["P1:","LUCIANO","AL/JA"],["P2:","YGOR","AL/JA"],["P3:","ANDRE","AL/JA"],["P4:","VAT 60","AL/JA"],["P5:","EDILL","AL/JA"],["P6:","ISRAEL","AL"]]},
{head:"30 SEG — NOV/2026 SEGUNDA",rows:[["P1:","PAOLI","JA"],["P2:","DOUGLAS","JA"],["P3:","ANDERSON VAT 60 SOLO","JA"],["P4:","ANDRE","JA"],["P5:","MARTIN","JA"],["P6:","ESCOLHA","AL"]]}
];
function abrirMenu(){document.getElementById('drawer').classList.add('open');document.getElementById('overlay').classList.add('show')}
function fecharMenu(){document.getElementById('drawer').classList.remove('open');document.getElementById('overlay').classList.remove('show')}
function verResumo(){fecharMenu();let total=0;DIAS.forEach(d=>d.rows.forEach(r=>{if(r[1]!=="ESCOLHA")total++}));let el=document.getElementById('resumo');el.style.display='block';el.innerHTML=`<b>RESUMO</b><br>Shows marcados: ${total}<br>Fixos: 197<br>Total: R$ 75350`;window.scrollTo({top:0,behavior:'smooth'})}
function adicionarMusico(){fecharMenu();let n=prompt("Nome do músico:");if(n){MUSICOS.push(n.toUpperCase());render();alert(n+" adicionado!")}}
function exportarWhats(){fecharMenu();let txt="ESTAGEFLOW\n";DIAS.forEach(d=>{txt+=`\n${d.head}\n`;d.rows.forEach(r=>txt+=`${r[0]} ${r[1]} - ${r[2]}\n`)});navigator.clipboard.writeText(txt).then(()=>alert("Copiado! Cola no WhatsApp."))}
function copiarEscala(){exportarWhats()}
function limparTudo(){fecharMenu();if(confirm("Limpar tudo mesmo?")){DIAS.forEach(d=>d.rows.forEach(r=>r[1]="ESCOLHA"));render()}}
function clsT(t){return t==="AL"?"al":t==="AL/JA"?"alja":"ja"}
function render(){
document.getElementById('grid').innerHTML=DIAS.map((d,di)=>{
let rows=d.rows.map((r,ri)=>{
let isP6Amarelo=(ri===5 && r[2]==="AL" && r[1]!=="ESCOLHA");
let nc=r[1]==="ESCOLHA"?"nome branco":isP6Amarelo?"nome amarelo":"nome";
let opts=MUSICOS.map(m=>`<option ${m===r[1]?"selected":""}>${m}</option>`).join("");
let topts=["JA","AL","AL/JA"].map(t=>`<option ${t===r[2]?"selected":""}>${t}</option>`).join("");
return `<div class="linha"><span class="p">${r[0]}</span><select class="${nc}" onchange="DIAS[${di}].rows[${ri}][1]=this.value;render()">${opts}</select><select class="turno ${clsT(r[2])}" onchange="DIAS[${di}].rows[${ri}][2]=this.value;render()">${topts}</select><button class="plus" onclick="DIAS[${di}].rows.splice(${ri}+1,0,['P6:','ESCOLHA','AL']);render()">+</button><button class="del" onclick="DIAS[${di}].rows.splice(${ri},1);render()">×</button></div>`;
}).join("");
return `<div class="card"><div class="head">${d.head}</div>${rows}</div>`;
}).join("");
}
render();
</script>
</body>
</html>
