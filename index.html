<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>V53 FINAL COMPLETO - CORES VERDE AMARELO - 172</title><style>*{margin:0;padding:0;box-sizing:border-box;font-family:Arial}body{background:#F2F2F2}.top{background:#111;color:#fff;padding:10px 12px;display:flex;align-items:center;gap:8px;position:sticky;top:0;z-index:99}.name{font-size:15px;font-weight:900}.pills{margin-left:8px;display:flex;gap:5px}.pill{font-size:8px;font-weight:900;padding:4px 8px;border-radius:10px}.z{background:#FBBF24;color:#000}.r{background:#22C55E;color:#000}.menuBtn{margin-left:auto;background:0;border:0;color:#fff;font-size:22px}.tabsMes{display:flex;background:#fff;padding:6px 12px;border-bottom:1px solid #E5E7EB;overflow:auto;gap:6px;white-space:nowrap}.tabsMes button{border:1px solid #E5E7EB;background:#fff;padding:8px 14px;font-size:11px;font-weight:800;border-radius:20px}.tabsMes button.active{background:#111;color:#fff;border-color:#111}.infoBar{background:#22C55E;color:#000;padding:8px 12px;font-size:11px;font-weight:900;text-align:center}.grid{display:grid;grid-template-columns:1fr 1fr;gap:6px;padding:6px 6px 90px}.card{background:#fff;border-radius:10px;padding:8px;border:1px solid #E5E7EB}.dia{font-size:10px;font-weight:900;display:flex;justify-content:space-between;margin-bottom:5px;border-bottom:1px solid #F3F4F6;padding-bottom:3px}.linha{display:flex;align-items:center;gap:3px;margin-bottom:3px}.linha b{flex:0 0 24px;font-size:7px;font-weight:900}.linha select{border:1px solid #D1D5DB;border-radius:5px;padding:2px 3px;font-size:7px;font-weight:800;height:22px}.esc{flex:1}.al{flex:0 0 42px;text-align:center;font-weight:900}.esc.verde{background:#22C55E;color:#000;border-color:#16A34A}.esc.vazio{background:#fff;color:#000}.al.amarelo{background:#FBBF24;color:#000;border-color:#F59E0B}.al.verde{background:#22C55E;color:#000;border-color:#16A34A}.drawer{position:fixed;top:0;right:-360px;width:340px;height:100%;background:#111;color:#fff;z-index:9999;transition:.25s;padding:14px;overflow:auto}.drawer.open{right:0}.drawer button{width:100%;padding:10px;margin-bottom:6px;border:0;border-radius:8px;text-align:left;background:#1F1F1F;color:#fff;font-size:10px}.fundo{position:fixed;inset:0;background:rgba(0,0,0,.5);display:none;z-index:9998}.fundo.show{display:block}.sec{display:none}.sec.show{display:block}.box{background:#fff;border-radius:10px;margin:8px;padding:12px;border:1px solid #E5E7EB}.finInput{width:100%;padding:10px;border:1px solid #D1D5DB;border-radius:8px;font-size:12px;font-weight:700;margin-top:6px;background:#fff}</style></head><body><div class="top"><span class="name">ESTAGEFLOW</span><div class="pills"><span class="pill z" id="topZ">0 FIXOS</span><span class="pill r" id="topTot">R$ 0</span></div><button class="menuBtn" onclick="openMenu()">☰</button></div><div class="fundo" id="fundo" onclick="closeMenu()"></div><div class="drawer" id="drawer"><h3>V53 FINAL COMPLETO CORES</h3><div style="background:#22C55E;color:#000;padding:8px;border-radius:6px;font-weight:900;text-align:center;margin-bottom:10px" id="stMenu">✅ V53 - CORES</div><button onclick="go('grade');closeMenu()">📅 Grade P1-P12 - NOME VERDE</button><button onclick="go('fin');closeMenu()">💰 Relatório Financeiro</button><button onclick="go('filtro');closeMenu()" style="background:#FBBF24;color:#000;font-weight:900">🎤 Filtro ANDRE 01/10 A 04/10 - VER VALOR</button><button onclick="go('plan');closeMenu()">📋 Planejamento</button><button onclick="go('art');closeMenu()">🎤 Músicos</button><button onclick="go('casa');closeMenu()">🏠 Casas</button><button onclick="window.print()" style="background:#FBBF24;color:#000;text-align:center;font-weight:900">🖨️ 1 FOLHA</button><button onclick="forcarSalvar(true)" style="background:#22C55E;color:#000;text-align:center;font-weight:900">💾 Salvar Fixo - NAO APAGA</button><button onclick="exportar()" style="background:#3B82F6;text-align:center">📤 Exportar Backup 172</button><button onclick="closeMenu()" style="background:#fff;color:#000;text-align:center;font-weight:900">✖ FECHAR</button></div><div id="sec-grade" class="sec show"><div class="tabsMes" id="tabsMes"></div><div class="infoBar" id="infoBar">✅ V53 - NOME VERDE + AL AMARELO + AL/JA VERDE - 172 SHOWS</div><div class="grid" id="grade"></div></div><div id="sec-fin" class="sec"><div class="box"><h3>💰 Relatório - <span id="titMesFin">Novembro 2026</span></h3><div id="fin"></div></div></div><div id="sec-filtro" class="sec"><div class="box"><h3>🎤 Filtro ANDRE 01/10 A 04/10 - VER VALOR</h3><div style="background:#FEF3C7;border:2px solid #FBBF24;border-radius:10px;padding:10px;margin-top:10px"><div style="display:grid;grid-template-columns:1fr 1fr;gap:6px"><div><label style="font-size:9px;font-weight:800">MÚSICO</label><select id="filtroMusico" class="finInput"></select></div><div><label style="font-size:9px;font-weight:800">FIM</label><input id="dataFim" type="date" class="finInput" value="2026-10-04"></div></div><div style="display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:8px"><div><label style="font-size:9px;font-weight:800">INÍCIO</label><input id="dataIni" type="date" class="finInput" value="2026-10-01"></div></div><button onclick="filtrarPorData()" style="width:100%;margin-top:8px;padding:12px;background:#111;color:#fff;border:0;border-radius:10px;font-weight:900">🔍 FILTRAR ANDRE 01/10 A 04/10</button><div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:12px 0"><div style="background:#111;color:#fff;padding:12px;border-radius:12px;text-align:center"><div style="font-size:10px">SHOWS</div><b style="font-size:22px" id="finShows">0</b><div style="font-size:9px" id="finPeriodo">OUT/2026</div></div><div style="background:#22C55E;color:#000;padding:12px;border-radius:12px;text-align:center"><div style="font-size:10px">TOTAL</div><b style="font-size:18px" id="finTotal">R$ 0</b><div style="font-size:9px" id="finDetalhe">Filtrado</div></div></div><div id="finListaData"></div></div></div></div><div id="sec-plan" class="sec"><div class="box"><h3>📋 Planejamento</h3><div id="plan"></div></div></div><div id="sec-art" class="sec"><div class="box"><h3>🎤 Músicos</h3><div id="lArt"></div></div></div><div id="sec-casa" class="sec"><div class="box"><h3>🏠 Casas</h3><div id="fCasa"></div></div></div><script>
var MESES={"OUT/2026":31,"NOV/2026":30,"DEZ/2026":31,"JAN/2027":31,"FEV/2027":28,"MAR/2027":31};
var NOMES={"OUT/2026":"Outubro 2026","NOV/2026":"Novembro 2026","DEZ/2026":"Dezembro 2026","JAN/2027":"Janeiro 2027","FEV/2027":"Fevereiro 2027","MAR/2027":"Março 2027"};
var mesAtual="NOV/2026";
var KEY="ESTAGEFLOW_V53_FINAL_COMPLETO_CORES";
var artistas=[{nome:"ANDRE",cache:300},{nome:"EDILL / GERVASIO",cache:500},{nome:"GERVASIO",cache:200},{nome:"PAOLI",cache:320},{nome:"LUCIANO",cache:300},{nome:"YGOR",cache:280},{nome:"ISRAEL",cache:300},{nome:"RICK",cache:250},{nome:"VATA60",cache:250},{nome:"EDILL",cache:250},{nome:"GERVAZIO",cache:200},{nome:"ANDERSON VAT 60 SOLO",cache:300},{nome:"VAT 60",cache:250},{nome:"ANDERSON VAT60 DUO",cache:300},{nome:"ANDERSON VAT 60 DUO",cache:300},{nome:"ANDERSON VAT 60 TRIO",cache:400},{nome:"DUO CLASSIC ROCK",cache:350}];
var casas={P1:"Cais",P2:"Vila",P3:"Grill",P4:"Ze",P5:"Omau",P6:"Vago",P7:"P7",P8:"P8",P9:"P9",P10:"P10",P11:"P11",P12:"P12"};
var dados={};for(var m in MESES){dados[m]={};for(var d=1; d<=MESES[m]; d++){dados[m][d]={};for(var p=1;p<=12;p++)dados[m][d]['P'+p]={nome:"",turno:"AL"}}}
function contarMes(m){var c=0;for(var d=1; d<=MESES[m]; d++)for(var p=1;p<=12;p++)if(dados[m][d]&&dados[m][d]['P'+p]&&dados[m][d]['P'+p].nome)c++;return c;}
function contarTotal(){var t=0;for(var m in MESES)t+=contarMes(m);return t;}
function getCache(n){var f=artistas.find(function(a){return a.nome==n});return f?f.cache:300;}
function calcularTotalMes(m){var rel={},tot=0,sh=0;for(var d=1; d<=MESES[m]; d++)for(var p=1;p<=12;p++){var inf=dados[m][d]&&dados[m][d]['P'+p]?dados[m][d]['P'+p]:null;if(!inf||!inf.nome)continue;var q=(inf.turno=='AL/JA'||inf.turno=='AL+JA')?2:1;if(!rel[inf.nome])rel[inf.nome]={s:0,t:0};rel[inf.nome].s+=q;var c=getCache(inf.nome)*q;rel[inf.nome].t+=c;tot+=c;sh+=q;}return{rel:rel,total:tot,shows:sh};}
function forcarSalvar(){var q=contarTotal();var s=JSON.stringify({dados:dados,artistas:artistas,casas:casas,mesAtual:mesAtual});try{localStorage.setItem(KEY,s);localStorage.setItem(KEY+"_BKP",s);localStorage.setItem("ESTAGEFLOW_V53_FINAL_COMPLETO",s);localStorage.setItem("ESTAGEFLOW_V52_FINAL_172",s);localStorage.setItem("ESTAGEFLOW_V51_172_FINAL",s);localStorage.setItem("ESTAGEFLOW_V28_FIXO_FINAL_NUNCA_MUDA_ESTE_FINAL",s);}catch(e){}document.getElementById('topZ').textContent=q+" FIXOS";var tot=calcularTotalMes(mesAtual);document.getElementById('topTot').textContent="R$ "+tot.total;document.getElementById('stMenu').textContent=q+" SHOWS - V53 CORES VERDE AMARELO";document.getElementById('infoBar').textContent="✅ "+q+" SHOWS - "+NOMES[mesAtual]+" - NOME VERDE + AL AMARELO + AL/JA VERDE - SEM TELA BRANCA";}
function carregar(){try{var keys=["ESTAGEFLOW_V53_FINAL_COMPLETO_CORES","ESTAGEFLOW_V53_FINAL_COMPLETO","ESTAGEFLOW_V52_FINAL_172","ESTAGEFLOW_V51_172_FINAL","ESTAGEFLOW_V28_FIXO_FINAL_NUNCA_MUDA_ESTE_FINAL","ESTAGEFLOW_V28_FIXO_FINAL_NUNCA_MUDA_ESTE_FINAL_BKP"];for(var i=0;i<keys.length;i++){var r=localStorage.getItem(keys[i]);if(r){var o=JSON.parse(r);if(o.dados){var qLocal=0;for(var mm in o.dados)for(var dd in o.dados[mm])for(var pp in o.dados[mm][dd])if(o.dados[mm][dd][pp]&&o.dados[mm][dd][pp].nome)qLocal++;if(qLocal>contarTotal()){dados=o.dados;if(o.artistas)artistas=o.artistas;if(o.casas)casas=o.casas;}}}}}catch(e){}}
function openMenu(){document.getElementById('drawer').classList.add('open');document.getElementById('fundo').classList.add('show')}
function closeMenu(){document.getElementById('drawer').classList.remove('open');document.getElementById('fundo').classList.remove('show')}
function go(id){document.querySelectorAll('.sec').forEach(function(s){s.classList.remove('show')});document.getElementById('sec-'+id).classList.add('show');if(id=='grade')renderGrade();if(id=='fin')renderFin();if(id=='filtro')renderFiltro();if(id=='plan')renderPlan();if(id=='art')renderArt();if(id=='casa')renderCasa();}
function salvar(m,d,p,campo,val){if(!dados[m])dados[m]={};if(!dados[m][d])dados[m][d]={};if(!dados[m][d]['P'+p])dados[m][d]['P'+p]={nome:"",turno:"AL"};dados[m][d]['P'+p][campo]=val;forcarSalvar();renderGrade();}
function renderTabs(){var c=document.getElementById('tabsMes');c.innerHTML='';for(var m in MESES){var b=document.createElement('button');b.textContent=m+(contarMes(m)>0?' ('+contarMes(m)+')':'');b.className=m==mesAtual?'active':'';b.onclick=(function(mm){return function(){mesAtual=mm;document.getElementById('titMesFin').textContent=NOMES[mm];renderTabs();renderGrade();renderFin();forcarSalvar()}})(m);c.appendChild(b);}}
function renderGrade(){renderTabs();var cont=document.getElementById('grade');cont.innerHTML='';for(var d=1;d<=MESES[mesAtual];d++){var cur=dados[mesAtual][d]||{};var card=document.createElement('div');card.className='card';var html='<div class="dia"><span>'+d+' '+mesAtual+'</span><span style="font-size:7px;background:#F3F4F6;padding:2px 6px;border-radius:8px">'+contarMes(mesAtual)+' FIXOS</span></div>';for(var p=1;p<=12;p++){var inf=cur['P'+p]||{nome:"",turno:"AL"};if(p>6 && !inf.nome) continue;var nomeClasse=inf.nome?'verde':'vazio';var turnoClasse=(inf.turno=='AL/JA'||inf.turno=='AL+JA'||inf.turno=='JA')?'verde':'amarelo';var opts=artistas.map(function(a){return '<option value="'+a.nome+'" '+(a.nome==inf.nome?'selected':'')+'>'+a.nome+'</option>';}).join('');html+='<div class="linha"><b>P'+p+':</b><select class="esc '+nomeClasse+'" onchange="salvar(\''+mesAtual+'\','+d+','+p+',\'nome\',this.value)"><option value="">ESCOLHA</option>'+opts+'</select><select class="al '+turnoClasse+'" onchange="salvar(\''+mesAtual+'\','+d+','+p+',\'turno\',this.value)"><option value="AL" '+(inf.turno=='AL'?'selected':'')+'>AL</option><option value="JA" '+(inf.turno=='JA'?'selected':'')+'>JA</option><option value="AL/JA" '+(inf.turno=='AL/JA'||inf.turno=='AL+JA'?'selected':'')+'>AL/JA</option></select></div>';}card.innerHTML=html;cont.appendChild(card);}}
function renderFin(){var res=calcularTotalMes(mesAtual);var h='<div style="display:grid;grid-template-columns:1fr 1fr;gap:5px;margin:6px 0"><div style="background:#111;color:#fff;padding:8px;border-radius:8px;text-align:center;font-size:9px">SHOWS<br><b>'+res.shows+'</b></div><div style="background:#FBBF24;padding:8px;border-radius:8px;text-align:center;font-size:9px">TOTAL<br><b>R$ '+res.total+'</b></div></div><table style="width:100%;font-size:8px;border-collapse:collapse"><tr><th style="background:#111;color:#fff;padding:5px">Músico</th><th style="background:#111;color:#fff;padding:5px">Shows</th><th style="background:#111;color:#fff;padding:5px">R$</th></tr>';for(var k in res.rel)h+='<tr><td style="padding:5px;border-bottom:1px solid #eee"><b>'+k+'</b></td><td style="text-align:center;padding:5px;border-bottom:1px solid #eee">'+res.rel[k].s+'</td><td style="text-align:right;padding:5px;border-bottom:1px solid #eee;color:green;font-weight:900">R$ '+res.rel[k].t+'</td></tr>';h+='</table>';document.getElementById('fin').innerHTML=h;}
function renderFiltro(){var sel=document.getElementById('filtroMusico');if(!sel)return;var opts=artistas.map(function(a){return '<option value="'+a.nome+'">'+a.nome+' - R$ '+a.cache+'</option>';}).join('');sel.innerHTML='<option value="TODOS">TODOS</option>'+opts;}
function mesParaData(mesStr,dia){var parts=mesStr.split('/');var map={"OUT":9,"NOV":10,"DEZ":11,"JAN":0,"FEV":1,"MAR":2};var ano=parseInt(parts[1]);var mm=map[parts[0]];return new Date(ano,mm,dia);}
function filtrarPorData(){var musico=document.getElementById('filtroMusico').value;var iniVal=document.getElementById('dataIni').value;var fimVal=document.getElementById('dataFim').value;if(!iniVal||!fimVal){alert('Coloca data');return;}var ini=new Date(iniVal+'T00:00:00');var fim=new Date(fimVal+'T23:59:59');var total=0,shows=0,list=[];for(var m in MESES){for(var d=1; d<=MESES[m]; d++){var dataReal=mesParaData(m,d);if(dataReal>=ini&&dataReal<=fim){for(var p=1;p<=12;p++){var inf=dados[m]&&dados[m][d]&&dados[m][d]['P'+p]?dados[m][d]['P'+p]:null;if(!inf||!inf.nome)continue;if(musico!="TODOS"&&inf.nome!=musico)continue;var q=(inf.turno=='AL/JA'||inf.turno=='AL+JA')?2:1;var cache=getCache(inf.nome);total+=cache*q;shows+=q;list.push({data:dataReal,mes:m,dia:d,p:'P'+p,casa:casas['P'+p]||'P'+p,nome:inf.nome,turno:inf.turno,valor:cache*q});}}}}document.getElementById('finShows').textContent=shows;document.getElementById('finTotal').textContent="R$ "+total;document.getElementById('finPeriodo').textContent=iniVal.split('-').reverse().join('/')+' a '+fimVal.split('-').reverse().join('/');document.getElementById('finDetalhe').textContent=musico;list.sort(function(a,b){return a.data-b.data});var h='<div style="margin-top:8px"><b>📋 '+musico+' ('+list.length+' registros) Total R$ '+total+'</b>';for(var i=0;i<list.length;i++){var it=list[i];h+='<div style="display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid #eee;font-size:11px"><span>'+it.data.toLocaleDateString('pt-BR')+' '+it.p+' '+it.casa+' '+it.nome+' '+it.turno+'</span><b>R$ '+it.valor+'</b></div>';}h+='</div>';document.getElementById('finListaData').innerHTML=h;}
function renderPlan(){var por={},html='';for(var m in MESES)for(var d=1;d<=MESES[m];d++)for(var p=1;p<=12;p++){var inf=dados[m]&&dados[m][d]&&dados[m][d]['P'+p]?dados[m][d]['P'+p]:null;if(!inf||!inf.nome)continue;if(!por[inf.nome])por[inf.nome]=[];por[inf.nome].push({mes:m,dia:d,casa:casas['P'+p]||'P'+p,turno:inf.turno});}for(var k in por){html+='<div style="background:#F3F4F6;padding:6px;border-radius:6px;margin-top:4px;font-size:9px"><b>'+k+' - '+por[k].length+' shows</b><div style="font-size:8px;margin-top:2px">'+por[k].map(function(x){return x.mes+' '+x.dia+' '+x.casa+' '+x.turno}).join(' | ')+'</div></div>';}document.getElementById('plan').innerHTML=html||'<div style="padding:20px;text-align:center;color:#999">Zerado</div>';}
function renderArt(){document.getElementById('lArt').innerHTML=artistas.map(function(a){return '<div style="display:flex;justify-content:space-between;padding:5px;background:#F3F4F6;border-radius:5px;margin-top:3px;font-size:8px"><div><b>'+a.nome+'</b> R$ '+a.cache+'</div></div>';}).join('');}
function renderCasa(){var h='';for(var k in casas){h+='<div style="display:flex;gap:4px;margin-top:4px;font-size:9px"><b>'+k+'</b><span style="flex:1">'+casas[k]+'</span></div>';}document.getElementById('fCasa').innerHTML=h;}
function exportar(){forcarSalvar();var blob=new Blob([localStorage.getItem(KEY)],{type:'application/json'});var a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='ESTAGEFLOW_V53_172_RECUPERADOS.json';a.click();}
carregar();renderTabs();renderGrade();renderArt();renderCasa();renderFin();renderFiltro();forcarSalvar();
</script></body></html>
