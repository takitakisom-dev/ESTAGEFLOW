<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>STAGEFLOW</title>
<style>
  *{box-sizing:border-box;font-family:Arial,Helvetica,sans-serif}
  body{margin:0;background:#f4f4f4;color:#111}
  header{background:#000;color:#fff;padding:14px 16px;display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:10}
  header b{font-size:15px;letter-spacing:1px}
  header span{font-size:11px;opacity:.7}
  .card{background:#fff;margin:10px;border-radius:14px;padding:14px;box-shadow:0 1px 4px #0001}
  .card.yellow{background:#fff8d6}
  label{font-size:12px;font-weight:bold}
  input,select{width:100%;padding:12px;margin:6px 0 12px;border:1px solid #ddd;border-radius:10px;font-size:16px;background:#fff}
  .btn{background:#000;color:#fff;border:0;width:100%;padding:13px;border-radius:10px;font-weight:bold;font-size:15px;margin-top:6px}
  .btn.green{background:#1a7a1a}
  .tabs{display:flex;gap:8px;padding:10px;overflow-x:auto;background:#fff}
  .tabs button{border:1px solid #ddd;background:#eee;padding:8px 12px;border-radius:20px;white-space:nowrap}
  .tabs button.on{background:#000;color:#fff}
  /* GRADE ORIGINAL - POR DIA */
  .dia{border:2px solid #111;border-radius:10px;margin:12px 0;overflow:hidden;background:#fff}
  .dia-top{background:#000;color:#fff;padding:8px 10px;display:flex;justify-content:space-between;font-weight:bold;font-size:13px}
  .dia-top span:last-child{background:#fff;color:#000;padding:2px 8px;border-radius:20px;font-size:11px}
  .linha{display:flex;align-items:center;gap:8px;padding:8px 10px;border-bottom:1px solid #eee}
  .linha.verde{background:#b7e5b7}
  .linha.amarela{background:#fff3b0}
  .linha.vazia{background:#fff}
  .p{font-weight:900;width:36px}
  .mus{flex:1;font-weight:bold;text-transform:uppercase}
  .bol{width:22px;height:22px;border-radius:50%;text-align:center;line-height:22px;font-size:12px;font-weight:bold}
  .bol.v{background:#1a7a1a;color:#fff}.bol.a{background:#e6c200}.bol.r{background:#c00;color:#fff}.bol.p{background:#111;color:#fff}
  .menu{position:fixed;inset:0;background:#0008;display:none;z-index:20}
  .menu.open{display:block}.menuBox{background:#fff;width:88%;max-width:360px;height:100%;padding:16px;overflow:auto}
  .menuBox button{display:block;width:100%;text-align:left;padding:12px;border:0;border-bottom:1px solid #eee;background:#fff;font-size:15px}
  .rel-linha{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid #ddd;font-weight:bold}
</style>
</head>
<body>

<header>
  <button onclick="document.getElementById('menu').classList.add('open')" style="background:none;border:0;color:#fff;font-size:20px">☰</button>
  <b>STAGEFLOW</b><span id="topInfo">• V66 AGRUPA</span>
</header>

<div id="menu" class="menu" onclick="this.classList.remove('open')">
  <div class="menuBox" onclick="event.stopPropagation()">
    <h3>STAGEFLOW</h3>
    <button onclick="show('grade')">Grade P1-P12</button>
    <button onclick="show('rel')">Relatório Financeiro Por Mês</button>
    <button onclick="show('rel')">Relatório TOTAL Todos Meses</button>
    <button onclick="show('rel')">RELATÓRIO SIMPLES TODOS POR MÚSICO</button>
    <button onclick="filtroAndre()">Filtro ANDRÉ</button>
    <button onclick="show('plan')">Planejamento Por Músico</button>
    <button onclick="show('plan')">Planejamento GERAL</button>
    <button onclick="show('musicos')">Músicos • Editar Cachê ✏️</button>
    <button onclick="show('casas')">Casas P1-P12</button>
    <button onclick="show('grade')">1 FOLHA 30 Dias</button>
    <button onclick="show('grade')">1 FOLHA 7 Dias</button>
    <button onclick="salvarFixo()">Salvar Fixo • NÃO ZERA</button>
    <button onclick="exportar()">Exportar Backup</button>
    <button onclick="document.getElementById('imp').click()">Importar Backup</button>
    <input type="file" id="imp" hidden accept=".json,.txt" onchange="importar(event)">
    <button onclick="document.getElementById('menu').classList.remove('open')">FECHAR</button>
    <div id="statusMenu" style="font-size:12px;margin-top:10px"></div>
  </div>
</div>

<div class="tabs" id="tabsMes">
  <button data-mes="2026-10">OUT/2026</button>
  <button data-mes="2026-11" class="on">NOV/2026</button>
  <button data-mes="2026-12">DEZ/2026</button>
  <button data-mes="2027-01">JAN/2027</button>
</div>

<div id="grade" class="card">
  <div id="aviso"></div>
  <h3 id="tituloMes">NOV/2026 - GRADE P1-P12</h3>
  <div id="gradeList"></div>
</div>

<div id="rel" class="card yellow" style="display:none">
  <h3>Relatório - Por Músico</h3>
  <label>INÍCIO</label><input type="date" id="inicio">
  <label>FIM</label><input type="date" id="fim">
  <label>MÚSICO</label><select id="filtroMusico"><option value="TODOS">TODOS</option></select>
  <button class="btn" onclick="renderRel()">FILTRAR • AGRUPA AUTOMÁTICO</button>
  <div style="display:flex;gap:10px;margin-top:12px"><div class="card" style="flex:1;text-align:center"><b>SHOWS</b><div id="qtd" style="font-size:26px;font-weight:900">0</div></div><div class="card" style="flex:1;text-align:center"><b>TOTAL</b><div id="total" style="font-size:26px;font-weight:900">R$ 0</div></div></div>
  <h4>Agrupado por Músico</h4><div id="relList"></div>
</div>

<div id="plan" class="card" style="display:none"><h3>Planejamento Por Músico / GERAL</h3><div id="planList"></div></div>
<div id="musicos" class="card" style="display:none"><h3>Músicos • Editar Cachê</h3><div id="musicosList"></div><button class="btn" onclick="addMusico()">+ ADICIONAR MÚSICO</button></div>
<div id="casas" class="card" style="display:none"><h3>Casas P1-P12</h3><div id="casasList"></div></div>

<script>
/* ===== FORMATO ORIGINAL: GRADE = ARRAY DE DIAS, CADA DIA TEM P1..P12 ===== */
/* Exemplo real: {data:"2026-11-23", P1:"ISRAEL", P2:"DOUGLAS", P3:"", ...} */
const K_GRADE='stageflow_grade_v66';
const K_SHOWS='stageflow_shows_v66';
const K_MUS='stageflow_musicos_v66';
const K_CASAS='stageflow_casas_v66';
let mesAtual='2026-11';
let grade = [];
let musicos = [];
let casas = [];

function ler(chave){ try{ let v=localStorage.getItem(chave); if(!v) return null; return JSON.parse(v); }catch(e){ return null; } }

function carregarInicial(){
  grade = ler(K_GRADE) || ler(K_SHOWS) || [];
  // Se veio no formato antigo {nome, turno, P1...} ou {shows:[...]} normaliza
  if(!Array.isArray(grade)){
    if(grade && Array.isArray(grade.grade)) grade=grade.grade;
    else if(grade && Array.isArray(grade.shows)) grade=grade.shows;
    else grade=[];
  }
  musicos = ler(K_MUS) || [];
  if(musicos.length===0) musicos=[{nome:'DOUGLAS',cache:300},{nome:'DUO CLASSIC ROCK',cache:450},{nome:'EDIL',cache:300},{nome:'FELIPE DUO',cache:400},{nome:'GERVÁSIO',cache:300},{nome:'ISRAEL',cache:300},{nome:'LUCIANO',cache:300},{nome:'MARTIN',cache:300},{nome:'PAOLI',cache:300},{nome:'RICK',cache:300},{nome:'ANDRÉ',cache:300}];
  casas = ler(K_CASAS) || ['P1','P2','P3','P4','P5','P6','P7','P8','P9','P10','P11','P12'].map(n=>({nome:n}));
  // Garante que cada dia tem data e P1..P12
  grade = grade.filter(d=>d && typeof d==='object').map(d=>{
    let o={data:d.data||d.dia||'', P1:d.P1||'',P2:d.P2||'',P3:d.P3||'',P4:d.P4||'',P5:d.P5||'',P6:d.P6||'',P7:d.P7||'',P8:d.P8||'',P9:d.P9||'',P10:d.P10||'',P11:d.P11||'',P12:d.P12||''};
    return o;
  }).sort((a,b)=>a.data.localeCompare(b.data));
}
carregarInicial();

function salvarFixo(){
  if(grade.length===0 && !confirm('ATENÇÃO: grade está com 0 dias. Tem certeza que quer salvar 0? Clica CANCELAR para importar o backup primeiro.')) return;
  localStorage.setItem(K_GRADE, JSON.stringify(grade));
  localStorage.setItem(K_SHOWS, JSON.stringify(grade));
  localStorage.setItem(K_MUS, JSON.stringify(musicos));
  localStorage.setItem(K_CASAS, JSON.stringify(casas));
  alert('Salvo fixo! Dias: '+grade.length);
  render();
}
function exportar(){
  const blob=new Blob([JSON.stringify({grade,musicos,casas,versao:'V66-ORIGINAL'})],{type:'application/json'});
  const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download='STAGEFLOW-backup.json'; a.click();
}
function importar(e){
  const f=e.target.files[0]; if(!f) return;
  const r=new FileReader();
  r.onload=()=>{
    try{
      let j=JSON.parse(r.result);
      let novaGrade=null, novosMus=[], novasCas=[];
      if(Array.isArray(j)) novaGrade=j;
      else if(Array.isArray(j.grade)) novaGrade=j.grade;
      else if(Array.isArray(j.shows)) novaGrade=j.shows;
      else if(Array.isArray(j.dados)) novaGrade=j.dados;
      else if(Array.isArray(j.data)) novaGrade=j.data;
      else {
        // Backup por mês: {"2026-11":[{P1...}]}
        let acc=[]; Object.keys(j).forEach(k=>{ if(Array.isArray(j[k])) acc=acc.concat(j[k]); });
        if(acc.length) novaGrade=acc;
      }
      if(j.musicos) novosMus=j.musicos;
      if(j.casas) novasCas=j.casas;
      if(!novaGrade || novaGrade.length===0){ alert('Esse arquivo não tem grade. Tenta o arquivo ESTAGEFLOW de 71KB.'); return; }
      // Conta quantos P preenchidos tem
      let preenchidos=0; novaGrade.forEach(d=>{ for(let i=1;i<=12;i++){ if(d['P'+i] && String(d['P'+i]).trim()!=='') preenchidos++; } });
      if(!confirm('Achei no backup: '+novaGrade.length+' dias, '+preenchidos+' shows preenchidos. Substituir a grade atual?')) return;
      grade=novaGrade.filter(d=>d && typeof d==='object');
      if(novosMus.length) musicos=novosMus;
      if(novasCas.length) casas=novasCas;
      localStorage.setItem(K_GRADE, JSON.stringify(grade));
      localStorage.setItem(K_SHOWS, JSON.stringify(grade));
      localStorage.setItem(K_MUS, JSON.stringify(musicos));
      localStorage.setItem(K_CASAS, JSON.stringify(casas));
      alert('RESTAURADO! Dias: '+grade.length+' • Shows: '+preenchidos);
      show('grade');
    }catch(err){ alert('Não consegui ler esse arquivo. Escolhe o .json de 71KB. Erro: '+err.message); }
  };
  r.readAsText(f); e.target.value='';
}
function diaSemana(dataStr){
  try{ let d=new Date(dataStr+'T12:00:00'); return ['DOMINGO','SEGUNDA','TERÇA','QUARTA','QUINTA','SEXTA','SÁBADO'][d.getDay()]; }catch(e){ return ''; }
}
function fmtData(dataStr){
  if(!dataStr) return ''; let p=dataStr.split('-'); if(p.length===3) return p[2]+' - '+p[1]+'/'+p[0].slice(2); return dataStr;
}
function render(){
  document.getElementById('topInfo').textContent='• V66 AGRUPA • '+grade.length+' DIAS';
  document.getElementById('statusMenu').textContent='Dias: '+grade.length+' • Músicos: '+musicos.length;
  let aviso=document.getElementById('aviso');
  if(grade.length===0){ aviso.innerHTML='<div style="background:#fff3b0;padding:10px;border-radius:10px"><b>⚠️ Grade vazia.</b><br>Não clica em Salvar Fixo. Vai no menu > Importar Backup > escolhe o ESTAGEFLOW 71KB.</div>'; }
  else { aviso.innerHTML='<div style="background:#b7e5b7;padding:10px;border-radius:10px">✅ <b>'+grade.length+' dias carregados.</b></div>'; }
  let lista=grade.filter(d=>d.data.startsWith(mesAtual));
  document.getElementById('tituloMes').textContent=(mesAtual==='2026-10'?'OUT/2026':mesAtual==='2026-11'?'NOV/2026':mesAtual==='2026-12'?'DEZ/2026':'JAN/2027')+' - GRADE P1-P12';
  document.getElementById('gradeList').innerHTML=lista.map((d,idx)=>{
    let linhas='';
    for(let i=1;i<=12;i++){
      let v=(d['P'+i]||'').toString().trim();
      let cls=v?'linha verde':'linha';
      let bola=v?'✔':'';
      let bolCls=v?'bol v':'bol';
      linhas+=`<div class="${cls}"><span class="p">P${i}</span><span class="mus">${v||'—'}</span><span class="${bolCls}">${bola}</span><button onclick="editarCelula('${d.data}',${i})" style="border:1px solid #ddd;background:#fff;border-radius:12px;padding:4px 8px">✏️</button></div>`;
    }
    return `<div class="dia"><div class="dia-top"><span>${fmtData(d.data)} • ${diaSemana(d.data)}</span><span>${d.data}</span></div>${linhas}</div>`;
  }).join('')||'Nenhum dia nesse mês.';
  document.getElementById('musicosList').innerHTML=musicos.map((m,i)=>`<div style="display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid #eee"><b>${m.nome}</b><span>R$ ${m.cache} <button onclick="editarCache(${i})">✏️</button></span></div>`).join('');
  document.getElementById('casasList').innerHTML=casas.map(c=>`<div style="padding:10px 0;border-bottom:1px solid #eee"><b>${c.nome||c}</b> • ATIVO</div>`).join('');
  document.getElementById('filtroMusico').innerHTML='<option value="TODOS">TODOS</option>'+musicos.map(m=>`<option>${m.nome}</option>`).join('');
  renderRel();
  // Planejamento
  let planHtml='';
  musicos.forEach(m=>{
    let dias=[];
    grade.forEach(d=>{ for(let i=1;i<=12;i++){ if((d['P'+i]||'').toUpperCase()===m.nome.toUpperCase()) dias.push(d.data+' - P'+i); } });
    if(dias.length) planHtml+=`<b>${m.nome} • ${dias.length} shows</b><br>${dias.map(x=>`<div style="padding:6px 0;border-bottom:1px solid #eee">${x}</div>`).join('')}<hr>`;
  });
  document.getElementById('planList').innerHTML=planHtml||'Sem planejamento.';
}
function editarCelula(data, p){
  let d=grade.find(x=>x.data===data); if(!d) return;
  let atual=d['P'+p]||'';
  let lista=musicos.map(m=>m.nome).join(', ');
  let novo=prompt('P'+p+' em '+data+'\nMúsicos: '+lista+'\n\nDeixa vazio para limpar:', atual);
  if(novo===null) return;
  d['P'+p]=novo.toUpperCase().trim();
  localStorage.setItem(K_GRADE, JSON.stringify(grade));
  localStorage.setItem(K_SHOWS, JSON.stringify(grade));
  render();
}
function editarCache(i){ let v=prompt('Novo cachê para '+musicos[i].nome, musicos[i].cache); if(v!==null){ musicos[i].cache=Number(v); localStorage.setItem(K_MUS, JSON.stringify(musicos)); render(); } }
function addMusico(){ let n=prompt('Nome do músico:'); if(!n) return; let v=prompt('Cachê:','300'); musicos.push({nome:n.toUpperCase(),cache:Number(v||300)}); localStorage.setItem(K_MUS, JSON.stringify(musicos)); render(); }
function renderRel(){
  let ini=document.getElementById('inicio').value, fim=document.getElementById('fim').value, filtro=document.getElementById('filtroMusico').value;
  let cont={};
  grade.forEach(d=>{
    if(ini && d.data<ini) return; if(fim && d.data>fim) return;
    for(let i=1;i<=12;i++){
      let nome=(d['P'+i]||'').toString().trim().toUpperCase();
      if(!nome) continue;
      if(filtro!=='TODOS' && nome!==filtro.toUpperCase()) continue;
      cont[nome]=cont[nome]||{q:0,v:0};
      cont[nome].q++;
      let m=musicos.find(x=>x.nome.toUpperCase()===nome);
      cont[nome].v+=m?m.cache:0;
    }
  });
  let totalQ=Object.values(cont).reduce((a,c)=>a+c.q,0);
  let totalV=Object.values(cont).reduce((a,c)=>a+c.v,0);
  document.getElementById('qtd').textContent=totalQ;
  document.getElementById('total').textContent='R$ '+totalV.toLocaleString('pt-BR');
  document.getElementById('relList').innerHTML=Object.entries(cont).sort((a,b)=>b[1].q-a[1].q).map(([k,v])=>`<div class="rel-linha"><span>${k}</span><span>${v.q} • R$ ${v.v.toLocaleString('pt-BR')}</span></div>`).join('')||'Sem shows no período.';
}
function filtroAndre(){ show('rel'); document.getElementById('filtroMusico').value='ANDRÉ'; renderRel(); }
function show(id){
  ['grade','rel','plan','musicos','casas'].forEach(x=>{ let el=document.getElementById(x); if(el) el.style.display=x===id?'block':'none'; });
  document.getElementById('menu').classList.remove('open'); render();
}
document.querySelectorAll('#tabsMes button').forEach(b=>{ b.onclick=()=>{ document.querySelectorAll('#tabsMes button').forEach(x=>x.classList.remove('on')); b.classList.add('on'); mesAtual=b.dataset.mes; show('grade'); }; });
render();
</script>
</body>
</html>
