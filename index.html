<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RECUPERACAO ESTAGEFLOW - V45</title>
<style>
*{box-sizing:border-box;font-family:Arial}
body{background:#111;color:#fff;padding:16px}
.box{background:#1F1F1F;border:1px solid #333;border-radius:12px;padding:14px;margin:10px 0}
.btn{width:100%;padding:14px;border:none;border-radius:10px;font-weight:900;margin:6px 0;cursor:pointer}
.btn-green{background:#22C55E;color:#000}
.btn-yellow{background:#FBBF24;color:#000}
.btn-blue{background:#3B82F6;color:#fff}
.btn-white{background:#fff;color:#000}
input[type=file]{background:#000;color:#fff;padding:10px;border-radius:8px;width:100%}
.small{font-size:10px;color:#9CA3AF;margin:4px 0}
.log{background:#000;padding:10px;border-radius:8px;font-size:11px;white-space:pre-wrap;max-height:300px;overflow:auto;border:1px solid #333}
</style>
</head>
<body>
<h2 style="color:#FBBF24">♻️ RECUPERAÇÃO ESTAGEFLOW V45</h2>
<p class="small">Essa página lê seu BKP e devolve os 172 shows. Não apaga nada.</p>
<div class="box">
<b>1️⃣ VER O QUE TEM SALVO NO SEU CELULAR AGORA</b>
<button class="btn btn-yellow" onclick="verLocal()">🔍 VER LOCALSTORAGE AGORA</button>
<div id="localInfo" class="log">Clique em VER LOCALSTORAGE...</div>
</div>
<div class="box">
<b>2️⃣ CARREGAR SEU ARQUIVO DE BACKUP .JSON</b>
<input type="file" id="fileBKP" accept=".json" onchange="lerBKP(event)">
<div id="bkpInfo" class="log" style="margin-top:10px">Nenhum arquivo carregado ainda</div>
<button class="btn btn-blue" id="btnRestaurar" onclick="restaurar()" style="display:none">✅ RESTAURAR ESSE BKP - TRAZER 172 DE VOLTA</button>
</div>
<div class="box">
<b>3️⃣ DEPOIS DE RESTAURAR</b>
<button class="btn btn-green" onclick="voltar()">📅 VOLTAR PRO ESTAGEFLOW - VER SE VOLTOU OS 172</button>
</div>
<div class="box">
<b>LOG</b>
<div id="log" class="log"></div>
</div>
<script>
var KEY="ESTAGEFLOW_V28_FIXO_FINAL_NUNCA_MUDA_ESTE_FINAL";
var MESES={"OUT/2026":31,"NOV/2026":30,"DEZ/2026":31,"JAN/2027":31,"FEV/2027":28,"MAR/2027":31};
var dadosBKP=null;
function loga(t){var el=document.getElementById('log'); el.textContent+=t+"\n";}
function verLocal(){
  var txt="Chaves encontradas:\n"; var total=0;
  for(var i=0;i<localStorage.length;i++){
    var k=localStorage.key(i);
    if(k.includes("ESTAGEFLOW")){
      var v=localStorage.getItem(k);
      try{
        var o=JSON.parse(v); var shows=0;
        if(o.dados){
          if(o.dados[1]){ for(var d=1; d<=31; d++) for(var p=1;p<=6;p++) if(o.dados[d] && o.dados[d]['P'+p] && o.dados[d]['P'+p].nome) shows++; txt+="→ "+k+" = V28 ANTIGO PLANO = "+shows+" shows\n"; }
          else{ for(var m in o.dados){ for(var d in o.dados[m]) for(var p=1;p<=6;p++) if(o.dados[m][d] && o.dados[m][d]['P'+p] && o.dados[m][d]['P'+p].nome) shows++; } txt+="→ "+k+" = COM MESES = "+shows+" shows, meses: "+Object.keys(o.dados).join(',')+"\n"; }
        }
        total+=shows;
      }catch(e){ txt+="→ "+k+" = erro\n"; }
    }
  }
  txt+="\nTOTAL GERAL: "+total+" shows";
  document.getElementById('localInfo').textContent=txt; loga(txt);
}
function lerBKP(e){
  var f=e.target.files[0]; if(!f) return;
  var r=new FileReader();
  r.onload=function(ev){
    try{
      var o=JSON.parse(ev.target.result); dadosBKP=o; var shows=0; var formato="";
      if(o.dados){
        if(o.dados[1]){ formato="V28 ANTIGO PLANO (1..31)"; for(var d=1; d<=31; d++) for(var p=1;p<=6;p++) if(o.dados[d] && o.dados[d]['P'+p] && o.dados[d]['P'+p].nome) shows++; }
        else{ formato="V44 NOVO COM MESES"; for(var m in o.dados) for(var d in o.dados[m]) for(var p=1;p<=6;p++) if(o.dados[m][d] && o.dados[m][d]['P'+p] && o.dados[m][d]['P'+p].nome) shows++; }
      }
      var txt="ARQUIVO: "+f.name+"\nFORMATO: "+formato+"\nSHOWS: "+shows+"\n";
      if(shows>=100) txt+="\n✅ ESSE É SEU BKP BOM COM OS 172! Clica em RESTAURAR abaixo.";
      document.getElementById('bkpInfo').textContent=txt; loga(txt);
      if(shows>0) document.getElementById('btnRestaurar').style.display='block';
    }catch(err){ document.getElementById('bkpInfo').textContent="Erro: "+err; }
  }; r.readAsText(f);
}
function restaurar(){
  if(!dadosBKP){ alert("Carrega o arquivo primeiro"); return; }
  try{
    var o=dadosBKP; var dadosFinais={};
    if(o.dados && o.dados[1] && !o.dados["OUT/2026"] && !o.dados["NOV/2026"]){
      loga("Convertendo V28 plano -> NOV/2026...");
      for(var m in MESES){ dadosFinais[m]={}; for(var d=1; d<=MESES[m]; d++){ dadosFinais[m][d]={}; for(var p=1;p<=6;p++) dadosFinais[m][d]['P'+p]={nome:"",turno:"AL"}; } }
      dadosFinais["NOV/2026"]=o.dados;
      o.dados=dadosFinais;
    }else if(o.dados && o.dados["NOV/2026"] && !o.dados["OUT/2026"]){
      for(var m in MESES){ if(!o.dados[m]){ o.dados[m]={}; for(var d=1; d<=MESES[m]; d++){ o.dados[m][d]={}; for(var p=1;p<=6;p++) o.dados[m][d]['P'+p]={nome:"",turno:"AL"}; } } }
    }
    var s=JSON.stringify(o);
    localStorage.setItem(KEY,s); localStorage.setItem(KEY+"_BKP",s);
    var tot=0; for(var m in o.dados) for(var d in o.dados[m]) for(var p=1;p<=6;p++) if(o.dados[m][d] && o.dados[m][d]['P'+p] && o.dados[m][d]['P'+p].nome) tot++;
    loga("TOTAL RESTAURADO: "+tot+" SHOWS");
    alert("✅ RESTAURADO! "+tot+" shows de volta! Agora volta pro ESTAGEFLOW e abre NOV/2026");
  }catch(e){ alert("Erro: "+e); }
}
function voltar(){ window.location.href="index.html?v=44recuperado"; }
loga("Página de recuperação carregada. Chave alvo: "+KEY);
verLocal();
</script>
</body>
</html>
