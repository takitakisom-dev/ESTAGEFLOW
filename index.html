<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TAKI SOM - STAGEFLOW PRO</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial,sans-serif}
body{background:#A8D5E5;color:#111}
.top{background:#1E293B;color:#fff;padding:12px;display:flex;align-items:center;gap:8px;position:sticky;top:0;z-index:100}
.top b{flex:1} .top b span{color:#FACC15}
.top button{padding:8px 12px;border:none;border-radius:8px;font-weight:800}
.btnMenu{background:#FACC15;color:#000;padding:14px;border:none;width:calc(100% - 12px);margin:6px;border-radius:12px;font-weight:900;font-size:15px}
.mesBar{background:#fff;margin:6px 8px;padding:10px;border-radius:14px;display:flex;justify-content:space-between;align-items:center}
.mesBar button{background:#1E293B;color:#fff;border:none;width:40px;height:40px;border-radius:10px;font-size:18px;font-weight:900}
.header{display:grid;grid-template-columns:62px repeat(6,1fr);gap:6px;padding:0 8px;margin-bottom:4px}
.header span{background:#1E293B;color:#FACC15;padding:5px;border-radius:8px;text-align:center;font-weight:900;font-size:11px}
.linha{background:#fff;margin:6px 8px;border-radius:14px;display:grid;grid-template-columns:62px repeat(6,1fr);gap:6px;padding:8px;align-items:center}
.data small{font-size:10px;color:#666} .data b{font-size:20px;display:block}
.card{border:1.5px dashed #CBD5E1;background:#F1F5F9;border-radius:10px;min-height:56px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:800;font-size:10px;cursor:pointer}
.card.has{background:#fff;border:solid 1.5px #1E293B}
.card .c{color:#16A34A;font-size:9px} .card .t{font-size:8px;background:#EFE8FF;color:#4A2AC0;padding:1px 4px;border-radius:4px}
.sec{display:none;padding-bottom:90px} .sec.show{display:block}
.cardBox{background:#fff;border-radius:14px;margin:8px;padding:14px}
.bottom{position:fixed;bottom:0;left:0;right:0;background:#A8D5E5;padding:8px;display:flex;gap:8px}
.bottom button{flex:1;padding:14px;border:none;border-radius:12px;font-weight:900}
.b1{background:#1E293B;color:#fff} .b2{background:#FACC15;color:#000}
.modal{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.6);display:none;align-items:center;justify-content:center;z-index:5000;padding:16px}
.modal.show{display:flex}
.drawer{position:fixed;top:0;left:-300px;width:285px;height:100%;background:#1E293B;color:#fff;z-index:6000;transition:.3s;padding:16px;overflow:auto}
.drawer.open{left:0}
.drawer button{width:100%;padding:14px;margin-bottom:8px;border:none;border-radius:10px;font-weight:800;text-align:left;background:#334155;color:#fff}
.fundo{position:fixed;inset:0;background:rgba(0,0,0,.5);display:none;z-index:5500} .fundo.show{display:block}
@media print{.top,.btnMenu,.bottom,.mesBar,.header{display:none!important} body{background:#fff} .linha{border:1px solid #000;break-inside:avoid}}
</style>
</head>
<body>
<div class="top"><b><span>TAKI</span> SOM - STAGEFLOW PRO</b><button onclick="exportar()">💾</button><button style="background:#FACC15;color:#000" onclick="window.print()">🖨️</button></div>
<button class="btnMenu" onclick="openMenu()">☰ MENU COMPLETO</button>
<div class="fundo" id="fundo" onclick="closeMenu()"></div>
<div class="drawer" id="drawer">
<h3>☰ MENU TAKI SOM</h3><br>
<button onclick="go('grade');closeMenu()">📅 Grade P1-P6 (1 ao 30)</button>
<button onclick="go('art');closeMenu()">🎤 Artistas - Nome + Cachê R$</button>
<button onclick="go('rel');closeMenu()">📊 Relatório + Total R$</button>
<button onclick="go('texto');closeMenu()">📝 Gerar Texto Cliente</button>
<button onclick="window.print();closeMenu()">🖨️ Impressão 1 Folha</button>
<button onclick="exportar();closeMenu()">💾 Backup JSON</button>
<button style="background:#FACC15;color:#000;text-align:center" onclick="closeMenu()">✖ FECHAR</button>
</div>
<div id="sec-grade" class="sec show">
<div class="mesBar"><button onclick="mudaMes(-1)"><</button><b id="mesTxt"></b><button onclick="mudaMes(1)">></button></div>
<div class="header"><span>DATA</span><span>P1</span><span>P2</span><span>P3</span><span>P4</span><span>P5</span><span>P6</span></div>
<div id="lista"></div>
</div>
<div id="sec-art" class="sec"><div class="cardBox"><h3>🎤 Artistas - Nome + Cachê</h3><div style="display:flex;gap:6px;margin-top:10px"><input id="nomeArt" placeholder="NOME ex: ANDRE" style="flex:1;padding:12px;border-radius:10px;border:1px solid #ccc;font-weight:800"><input id="cacheArt" type="number" placeholder="R$ 350" style="width:110px;padding:12px;border-radius:10px;border:1px solid #ccc;font-weight:800"></div><button onclick="addArt()" style="width:100%;margin-top:8px;padding:14px;background:#FACC15;border:none;border-radius:10px;font-weight:900">SALVAR NOME + CACHÊ</button><div id="listaArt" style="margin-top:10px"></div></div></div>
<div id="sec-rel" class="sec"><div class="cardBox"><h3>📊 Relatório + Cachê Total</h3><div id="resRel" style="margin-top:10px"></div></div></div>
<div id="sec-texto" class="sec"><div class="cardBox"><h3>📝 Texto para Cliente</h3><textarea id="txtCli" style="width:100%;height:320px;margin-top:10px;padding:10px;border-radius:10px;border:1px solid #ccc"></textarea><button onclick="gerarTexto()" style="width:100%;margin-top:8px;padding:14px;background:#FACC15;border:none;border-radius:10px;font-weight:900">Gerar Texto</button><button onclick="copiar()" style="width:100%;margin-top:8px;padding:14px;background:#1E293B;color:#fff;border:none;border-radius:10px;font-weight:900">Copiar</button></div></div>
<div class="bottom"><button class="b1" onclick="if(confirm('Limpar mês?')){criaMes();render()}">Limpar Mês</button><button class="b2" onclick="go('texto');gerarTexto()">Gerar Texto p/ Cliente</button></div>
<div class="modal" id="modal"><div style="background:#fff;border-radius:16px;padding:16px;width:100%;max-width:360px"><h3 id="mTitle"></h3><select id="selArt" style="width:100%;padding:12px;margin-top:10px;border-radius:10px;font-weight:800"></select><div style="display:flex;gap:6px;margin-top:8px"><select id="selTurno" style="flex:1;padding:12px;border-radius:10px;font-weight:800"><option>AL</option><option>JA</option><option>AL/JA</option></select><input id="selCache" type="number" style="width:110px;padding:12px;border-radius:10px;font-weight:800"></div><div style="display:flex;gap:6px;margin-top:12px"><button onclick="salvarShow()" style="flex:1;padding:14px;background:#FACC15;border:none;border-radius:10px;font-weight:900">Salvar</button><button onclick="removerShow()" style="flex:1;padding:14px;background:#FFD2D2;border:none;border-radius:10px;font-weight:900;color:#900">Remover</button><button onclick="fecharModal()" style="flex:1;padding:14px;background:#E5E7EB;border:none;border-radius:10px;font-weight:800">Fechar</button></div></div></div>
<script>
var meses=["janeiro","fevereiro","marco","abril","maio","junho","julho","agosto","setembro","outubro","novembro","dezembro"];
var mes=10, ano=2026;
var artistas=[{nome:"ANDRE",cache:300},{nome:"EDILL",cache:350},{nome:"LUCIANO",cache:300},{nome:"PAOLI",cache:320},{nome:"ISRAEL",cache:300},{nome:"YGOR",cache:280}];
var casas={P1:"Cais",P2:"Vila",P3:"Grill",P4:"Ze",P5:"Omau",P6:"Vago"};
var dados={}; var eDia=null,eP=null;
function criaMes(){dados={}; var tot=new Date(ano,mes+1,0).getDate(); for(var d=1;d<=tot;d++){dados[d]={}; for(var p=1;p<=6;p++) dados[d]['P'+p]=null;}}
function openMenu(){document.getElementById('drawer').classList.add('open');document.getElementById('fundo').classList.add('show')}
function closeMenu(){document.getElementById('drawer').classList.remove('open');document.getElementById('fundo').classList.remove('show')}
function go(id){document.querySelectorAll('.sec').forEach(s=>s.classList.remove('show'));document.getElementById('sec-'+id).classList.add('show'); if(id=='grade') render(); if(id=='art') renderArt(); if(id=='rel') renderRel(); if(id=='texto') gerarTexto()}
function mudaMes(dir){mes+=dir; if(mes<0){mes=11;ano--} if(mes>11){mes=0;ano++} criaMes(); salvar(); render()}
function render(){document.getElementById('mesTxt').innerText=meses[mes]+" de "+ano; var cont=document.getElementById('lista'); cont.innerHTML=''; var tot=new Date(ano,mes+1,0).getDate(); for(var d=1;d<=tot;d++){var dt=new Date(ano,mes,d); var ds=dt.toLocaleDateString('pt-BR',{weekday:'short'}); var row=document.createElement('div'); row.className='linha'; var h='<div class="data"><small>'+ds+'</small><b>'+String(d).padStart(2,'0')+'</b></div>'; for(var p=1;p<=6;p++){var info=dados[d]['P'+p]; if(info) h+='<div class="card has" onclick="abrir('+d+','+p+')"><b style="font-size:9px">'+info.nome+'</b><span class="t">'+info.turno+'</span><span class="c">R$'+info.cache+'</span></div>'; else h+='<div class="card" onclick="abrir('+d+','+p+')"><span style="font-size:18px;color:#94A3B8">+</span></div>';} row.innerHTML=h; cont.appendChild(row);} salvar();}
function abrir(d,p){eDia=d; eP=p; var sel=document.getElementById('selArt'); sel.innerHTML=artistas.map(a=>'<option value="'+a.nome+'">'+a.nome+' - R$'+a.cache+'</option>').join(''); var cur=dados[d]['P'+p]; document.getElementById('mTitle').innerText='Dia '+d+' - P'+p+' ('+casas['P'+p]+')'; if(cur){sel.value=cur.nome; document.getElementById('selTurno').value=cur.turno; document.getElementById('selCache').value=cur.cache;} else{var a=artistas[0]; document.getElementById('selTurno').value='AL'; document.getElementById('selCache').value=a?a.cache:300;} document.getElementById('modal').classList.add('show'); sel.onchange=function(){var f=artistas.find(x=>x.nome==this.value); if(f) document.getElementById('selCache').value=f.cache}}
function fecharModal(){document.getElementById('modal').classList.remove('show')}
function salvarShow(){var n=document.getElementById('selArt').value; var t=document.getElementById('selTurno').value; var c=parseFloat(document.getElementById('selCache').value)||0; dados[eDia]['P'+eP]={nome:n,turno:t,cache:c}; fecharModal(); render();}
function removerShow(){dados[eDia]['P'+eP]=null; fecharModal(); render();}
function addArt(){var n=document.getElementById('nomeArt').value.toUpperCase().trim(); var c=parseFloat(document.getElementById('cacheArt').value)||0; if(!n) return; var i=artistas.findIndex(a=>a.nome==n); if(i>=0) artistas[i].cache=c; else artistas.push({nome:n,cache:c}); document.getElementById('nomeArt').value=''; document.getElementById('cacheArt').value=''; renderArt(); salvar();}
function renderArt(){document.getElementById('listaArt').innerHTML=artistas.map((a,i)=>'<div style="display:flex;justify-content:space-between;padding:12px;background:#F1F5F9;border-radius:10px;margin-top:6px"><div><b>'+a.nome+'</b><br><span style="color:green;font-weight:900">R$ '+a.cache+'</span></div><button onclick="artistas.splice('+i+',1);renderArt();salvar()" style="background:#FFD2D2;border:none;padding:6px 12px;border-radius:8px">X</button></div>').join('');}
function renderRel(){var html=''; for(var k=0;k<artistas.length;k++){var art=artistas[k]; var lista=[]; var tot=0; for(var d in dados){for(var p=1;p<=6;p++){var inf=dados[d]['P'+p]; if(inf && inf.nome==art.nome){lista.push('Dia '+d+' P'+p+' '+inf.turno); tot+=inf.cache;}}} if(lista.length==0) continue; html+='<div style="background:#fff;padding:12px;border-radius:12px;margin-top:8px;border-left:4px solid #FACC15"><b>'+art.nome+' - '+lista.length+' shows</b><div style="color:green;font-weight:900">TOTAL R$ '+tot+'</div><div style="font-size:11px;margin-top:4px">'+lista.join('<br>')+'</div></div>';} document.getElementById('resRel').innerHTML=html||'Nenhum show';}
function gerarTexto(){var t='*TAKI SOM - '+meses[mes].toUpperCase()+' '+ano+'*\\n\\n'; for(var d in dados){var tem=false; for(var p=1;p<=6;p++) if(dados[d]['P'+p]) tem=true; if(!tem) continue; t+='*Dia '+d+'* - '; for(var p=1;p<=6;p++){var inf=dados[d]['P'+p]; if(inf) t+='P'+p+'('+casas['P'+p]+'): '+inf.nome+' '+inf.turno+' | ';} t+='\\n';} document.getElementById('txtCli').value=t;}
function copiar(){var el=document.getElementById('txtCli'); el.select(); document.execCommand('copy'); alert('Copiado!')}
function salvar(){try{localStorage.setItem('TAKI_SOM_V10',JSON.stringify({artistas,casas,dados,mes,ano}))}catch(e){}}
function carregar(){try{var s=localStorage.getItem('TAKI_SOM_V10'); if(!s) return; var o=JSON.parse(s); if(o.artistas) artistas=o.artistas; if(o.casas) casas=o.casas; if(o.mes!==undefined){mes=o.mes; ano=o.ano} if(o.dados){var tot=new Date(ano,mes+1,0).getDate(); var ok=true; for(var d=1;d<=tot;d++) if(!o.dados[d]) ok=false; if(ok) dados=o.dados;}}catch(e){}}
function exportar(){var a=document.createElement('a'); a.href='data:text/json;charset=utf-8,'+encodeURIComponent(JSON.stringify({artistas,casas,dados,mes,ano})); a.download='TAKI_SOM_'+meses[mes]+'_'+ano+'.json'; a.click()}
try{criaMes(); carregar(); render(); renderArt();}catch(err){criaMes(); render();}
</script>
</body>
</html>
