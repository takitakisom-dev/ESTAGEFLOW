<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ESTAGEFLOW - NOV 2026 - 1 DOMINGO</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial}
html,body{width:100%;overflow-x:hidden;background:#F0F0F0}
.top{background:#111;color:#fff;padding:8px;display:flex;gap:4px;align-items:center;position:sticky;top:0;z-index:10;width:100%}
.top b{font-size:11px;white-space:nowrap}
.pill{font-size:7px;font-weight:900;padding:4px 6px;border-radius:10px;white-space:nowrap}
.z{background:#FBBF24;color:#000}.r{background:#22C55E;color:#000}
.btnPrint{background:#fff;color:#000;border:0;border-radius:8px;padding:5px 8px;font-size:8px;font-weight:900;cursor:pointer;white-space:nowrap}
.grid{display:grid;grid-template-columns:1fr;gap:4px;padding:4px;width:100%}
@media(min-width:380px){.grid{grid-template-columns:repeat(2,1fr)}}
@media(min-width:900px){.grid{grid-template-columns:repeat(4,1fr)}}
.card{background:#fff;border:1px solid #CCC;border-radius:8px;padding:6px;width:100%;min-width:0;overflow:hidden}
.dia{font-size:10px;font-weight:900;border-bottom:2px solid #111;padding-bottom:3px;margin-bottom:5px;display:flex;justify-content:space-between}
.linha{display:flex;gap:3px;margin-bottom:4px;align-items:center;width:100%;min-width:0}
.linha b{font-size:8px;width:18px;flex-shrink:0;color:#555}
.linha select{height:24px;border:1px solid #BBB;border-radius:4px;font-size:9px;min-width:0}
.linha select.nome{flex:1;width:100%;font-weight:700;background:#fff}
.linha select.turno{width:65px;flex-shrink:0;font-weight:900;text-align:center;background:#EDE9FE;color:#5B21B6;border-color:#A78BFA}
.linha select.turno.JA{background:#FFEDD5;color:#9A3412;border-color:#FB923C}
.linha select.turno.ALJA{background:#DCFCE7;color:#166534;border-color:#86EFAC}
.printTxt{display:none}
@media print{
 .top{display:none!important}
 .grid{grid-template-columns:repeat(6,1fr)!important;gap:2px!important;padding:0!important}
 .card{border:0.5px solid #000!important;border-radius:0!important;padding:2px!important;break-inside:avoid}
 .dia{font-size:5px!important;margin-bottom:1px!important;padding-bottom:1px!important}
 .linha{margin-bottom:1px!important}
 .linha b{font-size:4px!important;width:8px!important}
 .linha select{display:none!important}
 .printTxt{display:inline!important;font-size:4.5px!important;font-weight:700;line-height:1}
 .printTxt.nome{flex:1;border-bottom:0.3px dotted #000;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
 .printTxt.turno{width:14px;text-align:center;border:0.3px solid #000;flex-shrink:0;padding:0.5px}
 @page{size:A4 landscape;margin:2mm}
}
</style>
</head>
<body>
<div class="top">
<b>ESTAGEFLOW - NOV 2026 - 1 DOM</b>
<span class="pill z" id="cnt">0 FIXOS</span>
<span class="pill r">FIXO</span>
<button class="btnPrint" onclick="window.print()">IMPRIMIR 1 FOLHA</button>
</div>
<div class="grid" id="grade"></div>
<script>
var musicos=["","ANDRE","EDILL / GERVASIO","GERVASIO","PAOLI","LUCIANO","YGOR","ISRAEL","RICK","VATA60","ANDERSON","RENAN"];
var diasSemana={1:"DOM",2:"SEG",3:"TER",4:"QUA",5:"QUI",6:"SEX",7:"SAB",8:"DOM",9:"SEG",10:"TER",11:"QUA",12:"QUI",13:"SEX",14:"SAB",15:"DOM",16:"SEG",17:"TER",18:"QUA",19:"QUI",20:"SEX",21:"SAB",22:"DOM",23:"SEG",24:"TER",25:"QUA",26:"QUI",27:"SEX",28:"SAB",29:"DOM",30:"SEG"};
var KEY="ESTAGEFLOW_NOV2026_1DOM_P1P6_COMPLETO_FINAL";
var dados={};
function vazio(){for(var d=1;d<=30;d++){dados[d]={};for(var p=1;p<=6;p++)dados[d]['P'+p]={nome:"",turno:"AL"}}}
function salvar(){localStorage.setItem(KEY,JSON.stringify(dados));var c=0;for(var d=1;d<=30;d++)for(var p=1;p<=6;p++)if(dados[d]['P'+p].nome)c++;document.getElementById('cnt').textContent=c+" FIXOS"}
function carregar(){var s=localStorage.getItem(KEY);if(s){try{dados=JSON.parse(s)}catch(e){vazio()}}else vazio()}
function muda(d,p,tipo,val){
 dados[d]['P'+p][tipo]=val;
 salvar();
 document.getElementById('pn_'+d+'_'+p).textContent=dados[d]['P'+p].nome||'---';
 document.getElementById('pt_'+d+'_'+p).textContent=dados[d]['P'+p].turno;
 var el=document.getElementById('selT_'+d+'_'+p);
 if(el){el.className='turno '+val; if(val=='AL/JA')el.className='turno ALJA';}
}
carregar();
var grade=document.getElementById('grade');
for(var d=1;d<=30;d++){
 var card=document.createElement('div');card.className='card';
 var html='<div class="dia"><span>'+d+' '+diasSemana[d]+'</span><span>'+diasSemana[d]+'</span></div>';
 for(var p=1;p<=6;p++){
  var cur=dados[d]['P'+p]||{nome:"",turno:"AL"};
  var opts=musicos.map(function(m){return '<option '+(m==cur.nome?'selected':'')+'>'+m+'</option>'}).join('');
  var cls=cur.turno=='AL/JA'?'ALJA':cur.turno;
  html+='<div class="linha"><b>P'+p+'</b><select class="nome" onchange="muda('+d+','+p+',\'nome\',this.value)"><option value="">ESCOLHA MUSICO</option>'+opts+'</select><span id="pn_'+d+'_'+p+'" class="printTxt nome">'+(cur.nome||'---')+'</span><select id="selT_'+d+'_'+p+'" class="turno '+cls+'" onchange="muda('+d+','+p+',\'turno\',this.value)"><option value="AL" '+(cur.turno=='AL'?'selected':'')+'>AL</option><option value="JA" '+(cur.turno=='JA'?'selected':'')+'>JA</option><option value="AL/JA" '+(cur.turno=='AL/JA'?'selected':'')+'>AL/JA</option></select><span id="pt_'+d+'_'+p+'" class="printTxt turno">'+cur.turno+'</span></div>';
 }
 card.innerHTML=html;
 grade.appendChild(card);
}
salvar();
</script>
</body>
</html>
