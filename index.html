<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>RECUPERAR STAGEFLOW</title>
<style>body{font-family:Arial;padding:16px}button{background:#000;color:#fff;border:0;padding:14px;width:100%;border-radius:10px;font-weight:bold;margin:10px 0}pre{background:#eee;padding:10px;white-space:pre-wrap;word-break:break-word;border-radius:10px}</style>
</head><body>
<h2>RECUPERAR - STAGEFLOW</h2>
<p>Isso aqui NÃO apaga nada, só procura.</p>
<button onclick="procurar()">🔍 PROCURAR MEUS DADOS</button>
<div id="saida"></div>
<button onclick="restaurar()" id="btnRest" style="display:none;background:green">✅ RESTAURAR DADOS ENCONTRADOS</button>
<input type="file" id="fileBackup" onchange="lerArquivo(event)" style="margin-top:20px">
<p>Se não achar aqui, escolhe o arquivo de backup que está em Documento.</p>
<script>
let achado = null;
function procurar(){
  let html = '';
  for(let i=0;i<localStorage.length;i++){
    let k = localStorage.key(i);
    let v = localStorage.getItem(k);
    html += `<b>Gaveta:</b> ${k}<br><b>Tamanho:</b> ${v.length} letras<br><pre>${v.slice(0,1000)}</pre><hr>`;
    // tenta achar shows em qualquer chave
    try{
      let j = JSON.parse(v);
      let arr = Array.isArray(j) ? j : (j.shows || j.dados || j.grade || null);
      if(arr && arr.length > 0){ achado = {chave:k, dados:arr, completo:j}; }
      if(j && j.musicos) achado = achado || {chave:k, dados:j};
    }catch(e){}
  }
  if(!achado) html += `<h3 style="color:red">Não achei nas gavetas do navegador. Usa o arquivo de backup abaixo.</h3>`;
  else { html += `<h3 style="color:green">ACHEI! Gaveta ${achado.chave} com dados!</h3>`; document.getElementById('btnRest').style.display='block'; }
  document.getElementById('saida').innerHTML = html || 'Nenhuma gaveta encontrada.';
}
function restaurar(){
  if(!achado) return;
  // Salva nas 3 chaves possíveis, pra qualquer versão achar
  let shows = achado.completo?.shows || achado.dados;
  let musicos = achado.completo?.musicos || [];
  let casas = achado.completo?.casas || [];
  localStorage.setItem('stageflow_shows_v66', JSON.stringify(shows));
  localStorage.setItem('stageflow_musicos_v66', JSON.stringify(musicos));
  localStorage.setItem('stageflow_casas_v66', JSON.stringify(casas));
  // Salva também nas chaves antigas mais comuns
  localStorage.setItem('shows', JSON.stringify(shows));
  localStorage.setItem('stageflow_shows', JSON.stringify(shows));
  localStorage.setItem('grade', JSON.stringify(shows));
  alert('RESTAURADO! Agora abre o STAGEFLOW de novo. Shows: ' + shows.length);
}
function lerArquivo(e){
  const r = new FileReader();
  r.onload = () => {
    try{
      let j = JSON.parse(r.result);
      achado = {chave:'arquivo-backup', dados:j.shows||j, completo:j};
      document.getElementById('saida').innerHTML = `<h3 style="color:green">ACHEI NO ARQUIVO! Shows: ${(j.shows||[]).length}</h3><pre>${r.result.slice(0,1000)}</pre>`;
      document.getElementById('btnRest').style.display='block';
    }catch(err){ alert('Esse arquivo não é o backup JSON. Tenta outro arquivo.'); }
  };
  r.readAsText(e.target.files[0]);
}
</script></body></html>
