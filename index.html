<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ESTAGEFLOW - NOV/2026</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:Arial,sans-serif}
body{background:#f2f2f2;padding-bottom:70px}
.top{background:#111;color:#fff;padding:14px 12px 10px;position:sticky;top:0;z-index:10}
.top-row{display:flex;justify-content:space-between;align-items:center}
.top small{color:#aaa;font-size:11px;letter-spacing:1px}
.top h1{font-size:26px;margin:4px 0 2px}
.top p{font-size:12px;color:#ccc}
.menu-btn{background:#222;color:#fff;border:1px solid #333;padding:8px 10px;border-radius:8px;font-size:18px;cursor:pointer}
.btns{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.btns button{border:0;border-radius:20px;padding:8px 12px;font-size:12px;font-weight:700;cursor:pointer}
.novo{background:#2ecc71;color:#fff}
.outros{background:#e6e6e6}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:8px}
.card{background:#fff;border-radius:10px;overflow:hidden;box-shadow:0 1px 4px rgba(0,0,0,.1)}
.card-head{display:flex;align-items:center;gap:6px;padding:8px;border-bottom:1px solid #eee}
.num{background:#111;color:#fff;font-weight:800;font-size:22px;min-width:38px;height:38px;display:flex;align-items:center;justify-content:center;border-radius:6px}
.dia{color:#2b7fff;font-weight:800;font-size:12px}
.mes{font-size:9px;color:#888}
.semana{background:#eee;font-size:9px;font-weight:700;padding:4px 5px;border-radius:10px;white-space:nowrap}
.linha{display:flex;align-items:stretch;gap:4px;padding:4px 5px}
.p{background:#eee;font-size:10px;font-weight:700;width:28px;display:flex;align-items:center;justify-content:center;border-radius:6px;flex-shrink:0}
.nome{flex:1;background:#2ecc71;color:#fff;font-size:11px;font-weight:700;padding:6px 5px;border-radius:6px;line-height:1.2;word-break:break-word;min-height:30px;display:flex;align-items:center}
.nome.branco{background:#fff;color:#111;border:1px solid #ddd}
.turno{font-size:10px;font-weight:800;padding:6px 4px;border-radius:6px;flex-shrink:0;width:28px;display:flex;align-items:center;justify-content:center}
.turno.ja{background:#2ecc71;color:#fff}
.turno.al{background:#f1c40f;color:#111}
.mais{background:#111;color:#fff;border:0;width:22px;border-radius:4px;cursor:pointer;flex-shrink:0;font-size:16px}
.fechar{background:#e74c3c;color:#fff;border:0;width:22px;border-radius:4px;cursor:pointer;flex-shrink:0}
/* MENU DE BAIXO - RESTAURADO */
.bottom{position:fixed;bottom:0;left:0;right:0;background:#111;color:#fff;display:flex;justify-content:space-around;padding:10px 0;z-index:20}
.bottom button{background:none;border:0;color:#fff;font-size:11px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px}
.bottom button span{font-size:20px}
/* MODAL DO + */
.modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:50;align-items:flex-end;justify-content:center}
.modal.open{display:flex}
.modal-box{background:#fff;width:100%;max-width:500px;border-radius:16px 16px 0 0;padding:16px}
.modal-box h3{margin-bottom:10px}
.modal-box input,.modal-box select{width:100%;padding:12px;margin:6px 0;border:1px solid #ddd;border-radius:8px;font-size:15px}
.modal-box button{width:100%;padding:12px;border:0;border-radius:8px;font-weight:800;margin-top:6px;cursor:pointer}
.salvar{background:#2ecc71;color:#fff}
.fecharModal{background:#eee}
</style>
</head>
<body>

<div class="top">
<div class="top-row"><div><small>ESTAGEFLOW</small><h1>NOV/2026</h1><p>HOME / <b>ESTAGEFLOW</b> &nbsp; 197 FIXOS &nbsp; R$ 75350</p></div>
<button class="menu-btn" onclick="alert('MENU: Home, Calendário, Festivais, Produtor, Configurações')">☰</button></div>
<div class="btns">
<button class="novo" onclick="abrirModalNovoDia()">+ NOVO</button>
<button class="outros" onclick="alert('Mostrando todos os dias')">VER TODOS</button>
<button class="outros" onclick="alert('Ver com produtor')">VER COM PRODUTOR</button>
<button class="outros" onclick="alert('Festivais')">FESTIVAIS</button>
<button class="outros" onclick="alert('Calendário')">CALENDÁRIO</button>
</div>
</div>

<div class="grid" id="grid"></div>

<div class="bottom">
<button onclick="alert('Home')"><span>🏠</span>Home</button>
<button onclick="alert('Calendário')"><span>📅</span>Calendário</button>
<button onclick="alert('Festivais')"><span>🎪</span>Festivais</button>
<button onclick="alert('Produtor')"><span>👤</span>Produtor</button>
<button onclick="alert('Menu: Configurações, Sair')"><span>☰</span>Menu</button>
</div>

<div class="modal" id="modal"><div class="modal-box">
<h3 id="modalTitulo">Adicionar na mesma casa</h3>
<label>Nome completo</label>
<input id="inputNome" placeholder="Ex: ANDERSON VAT 60 DUO">
<label>Posição</label>
<select id="selectP"><option>P1:</option><option>P2:</option><option>P3:</option><option>P4:</option><option>P5:</option><option>P5.1:</option><option>P5.2:</option><option>P5.3:</option><option>P6:</option></select>
<label>Turno</label>
<select id="selectTurno"><option>JA</option><option>AL</option></select>
<button class="salvar" onclick="salvar()">SALVAR NA MESMA CASA</button>
<button class="fecharModal" onclick="fecharModal()">CANCELAR</button>
</div></div>

<script>
let diaAtual = 0;
let dados = [
{num:23,dia:"SEG",semana:"SEGUNDA",linhas:[["P1:","ISRAEL","JA"],["P2:","YGOR","JA"],["P3:","LUCIANO","JA"],["P4:","ANDRE","JA"],["P5:","ANDERSON VAT 60 DUO","JA"],["P6:","ESCOLHA","AL"]]},
{num:24,dia:"TER",semana:"TERÇA",linhas:[["P1:","GABI","JA"],["P2:","EDILL","JA"],["P3:","ROBSON SOLO","JA"],["P4:","ISRAEL","JA"],["P5:","ANDERSON VAT 60 DUO","JA"],["P6:","ESCOLHA","AL"]]},
{num:25,dia:"QUA",semana:"QUARTA",linhas:[["P1:","LUCIANO","JA"],["P2:","RICK SOLO","JA"],["P3:","YGOR","JA"],["P4:","DOUGLAS","JA"],["P5:","ANDERSON VAT 60 DUO","JA"],["P6:","ESCOLHA","AL"]]},
{num:26,dia:"QUI",semana:"QUINTA",linhas:[["P1:","GABI","JA"],["P2:","YGOR","JA"],["P3:","ISRAEL","JA"],["P4:","ANDRE","JA"],["P5:","ANDERSON VAT 60 DUO","JA"],["P6:","ESCOLHA","AL"]]}
];
function render(){
const grid=document.getElementById('grid'); grid.innerHTML='';
dados.forEach((d,di)=>{
let html=`<div class="card"><div class="card-head"><div class="num">${d.num}</div><div><div class="dia">${d.dia}</div><div class="mes">NOV/2026</div></div><span class="semana">${d.semana}</span></div>`;
d.linhas.forEach((l,li)=>{
let cls=l[2]==='AL'?'al':'ja';
let nomeCls=l[1]==='ESCOLHA'?'nome branco':'nome';
html+=`<div class="linha"><span class="p">${l[0]}</span><span class="${nomeCls}">${l[1]}</span><span class="turno ${cls}">${l[2]}</span><button class="mais" onclick="abrirModal(${di})">+</button><button class="fechar" onclick="remover(${di},${li})">X</button></div>`;
});
html+=`</div>`; grid.innerHTML+=html;
});
}
function abrirModal(di){ diaAtual=di; document.getElementById('modalTitulo').innerText='Adicionar no dia '+dados[di].num+' - mesma casa'; document.getElementById('modal').classList.add('open'); }
function abrirModalNovoDia(){ let n=prompt('Qual dia? Ex: 20'); if(n){ dados.push({num:n,dia:"SEX",semana:"SEXTA",linhas:[["P1:","ESCOLHA","AL"]]}); render(); } }
function fecharModal(){ document.getElementById('modal').classList.remove('open'); }
function salvar(){ let nome=document.getElementById('inputNome').value; if(!nome) return alert('Digite o nome'); dados[diaAtual].linhas.push([document.getElementById('selectP').value,nome.toUpperCase(),document.getElementById('selectTurno').value]); document.getElementById('inputNome').value=''; fecharModal(); render(); }
function remover(di,li){ if(confirm('Excluir '+dados[di].linhas[li][1]+'?')){ dados[di].linhas.splice(li,1); render(); } }
render();
</script>
</body>
</html>
