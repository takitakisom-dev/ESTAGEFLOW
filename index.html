<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ESTAGEFLOW - NOV/2026</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:Arial,sans-serif}
body{background:#f2f2f2}
.top{background:#111;color:#fff;padding:14px 12px 10px}
.top small{color:#aaa;font-size:11px;letter-spacing:1px}
.top h1{font-size:26px;margin:4px 0 2px}
.top p{font-size:12px;color:#ccc}
.top p b{color:#fff}
.btns{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.btns button{border:0;border-radius:20px;padding:7px 12px;font-size:12px;font-weight:700;cursor:pointer}
.novo{background:#2ecc71;color:#fff}
.outros{background:#e6e6e6}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:8px}
.card{background:#fff;border-radius:10px;overflow:hidden;box-shadow:0 1px 4px rgba(0,0,0,.1)}
.card-head{display:flex;align-items:center;gap:6px;padding:8px;border-bottom:1px solid #eee}
.num{background:#111;color:#fff;font-weight:800;font-size:22px;width:38px;height:38px;display:flex;align-items:center;justify-content:center;border-radius:6px}
.dia{color:#2b7fff;font-weight:800;font-size:12px}
.mes{font-size:10px;color:#888}
.semana{background:#eee;font-size:10px;font-weight:700;padding:4px 6px;border-radius:10px}
.icons{margin-left:auto;font-size:13px;white-space:nowrap}
.linha{display:flex;align-items:center;gap:4px;padding:5px 6px}
.p{background:#eee;font-size:10px;font-weight:700;width:32px;text-align:center;padding:6px 2px;border-radius:6px;flex-shrink:0}
.nome{flex:1;background:#2ecc71;color:#fff;font-size:11px;font-weight:700;padding:7px 6px;border-radius:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nome.branco{background:#fff;color:#111;border:1px solid #ddd}
.turno{font-size:10px;font-weight:800;padding:7px 6px;border-radius:6px;flex-shrink:0;min-width:30px;text-align:center}
.turno.ja{background:#2ecc71;color:#fff}
.turno.al{background:#f1c40f;color:#111}
.mais{background:#111;color:#fff;border:0;width:20px;height:20px;border-radius:4px;cursor:pointer;flex-shrink:0}
.fechar{background:#e74c3c;color:#fff;border:0;width:20px;height:20px;border-radius:4px;cursor:pointer;flex-shrink:0}
</style>
</head>
<body>

<div class="top">
<small>ESTAGEFLOW</small>
<h1>NOV/2026</h1>
<p>HOME / <b>ESTAGEFLOW</b> &nbsp; 197 FIXOS &nbsp; R$ 75350</p>
<div class="btns">
<button class="novo">+ NOVO</button>
<button class="outros">VER TODOS</button>
<button class="outros">VER COM PRODUTOR</button>
<button class="outros">FESTIVAIS</button>
<button class="outros">CALENDÁRIO</button>
</div>
</div>

<div class="grid" id="grid"></div>

<script>
const dias=[
{num:23,dia:"SEG",semana:"SEGUNDA",linhas:[["P1:","ISRAEL","JA"],["P2:","YGOR","JA"],["P3:","LUCIANO","JA"],["P4:","ANDRE","JA"],["P5:","ANDERSON VAT 60","JA"],["P6:","ESCOLHA","AL"]]},
{num:24,dia:"TER",semana:"TERÇA",linhas:[["P1:","GABI","JA"],["P2:","EDILL","JA"],["P3:","ROBSON","JA"],["P4:","ISRAEL","JA"],["P5:","ANDERSON VAT 60","JA"],["P6:","ESCOLHA","AL"]]},
{num:25,dia:"QUA",semana:"QUARTA",linhas:[["P1:","LUCIANO","JA"],["P2:","RICK","JA"],["P3:","YGOR","JA"],["P4:","DOUGLAS","JA"],["P5:","ANDERSON VAT 60","JA"],["P6:","ESCOLHA","AL"]]},
{num:26,dia:"QUI",semana:"QUINTA",linhas:[["P1:","GABI","JA"],["P2:","YGOR","JA"],["P3:","ISRAEL","JA"],["P4:","ANDRE","JA"],["P5:","ANDERSON VAT 60","JA"],["P6:","ESCOLHA","AL"]]},
{num:27,dia:"SEX",semana:"SEXTA",linhas:[["P1:","BRUNO","JA"],["P2:","ISRAEL","JA"],["P3:","GABI","JA"],["P4:","YGOR","JA"],["P5:","ANDERSON VAT 60","JA"],["P6:","ESCOLHA","AL"]]},
{num:28,dia:"SAB",semana:"SÁBADO",linhas:[["P1:","EDILL","JA"],["P2:","LUCIANO","JA"],["P3:","YGOR","JA"],["P4:","ANDRE","JA"],["P5:","ANDERSON VAT 60","JA"],["P6:","ESCOLHA","AL"]]},
{num:29,dia:"DOM",semana:"DOMINGO",linhas:[["P1:","ROBSON","JA"],["P2:","GABI","JA"],["P3:","YGOR","JA"],["P4:","ANDRE","JA"],["P5:","ANDERSON VAT 60","JA"],["P6:","ESCOLHA","AL"]]},
{num:30,dia:"SEG",semana:"SEGUNDA",linhas:[["P1:","LUCIANO","JA"],["P2:","PAOLI","JA"],["P3:","ROBSON","JA"],["P4:","ISRAEL","JA"],["P5:","ANDERSON VAT 60","JA"],["P6:","ESCOLHA","AL"]]}
];

const grid=document.getElementById('grid');
dias.forEach(d=>{
let html=`<div class="card"><div class="card-head"><div class="num">${d.num}</div><div><div class="dia">${d.dia}</div><div class="mes">NOV/2026</div></div><span class="semana">${d.semana}</span><span class="icons">📅 ✕ + ⧉ 🗑</span></div>`;
d.linhas.forEach(l=>{
let cls=l[2]==='AL'?'al':'ja';
let nomeCls=l[1]==='ESCOLHA'?'nome branco':'nome';
html+=`<div class="linha"><span class="p">${l[0]}</span><span class="${nomeCls}">${l[1]}</span><span class="turno ${cls}">${l[2]}</span><button class="mais">+</button><button class="fechar">X</button></div>`;
});
html+=`</div>`;
grid.innerHTML+=html;
});
</script>
</body>
</html>
