<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ESTAGEFLOW</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:Arial,sans-serif}
body{background:#f2f2f2;padding-bottom:10px}
.top{background:#111;color:#fff;padding:14px 12px;display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:10}
.top b{font-size:18px}
.pill{font-size:11px;font-weight:800;padding:5px 9px;border-radius:20px}
.pill.y{background:#f1c40f;color:#111}
.pill.g{background:#2ecc71;color:#fff}
.menu{margin-left:auto;font-size:22px;background:none;border:0;color:#fff;cursor:pointer}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:8px}
.card{background:#fff;border-radius:10px;overflow:hidden;box-shadow:0 1px 4px rgba(0,0,0,.1)}
.head{display:flex;align-items:center;gap:6px;padding:8px}
.num{font-weight:800;font-size:16px}
.day{font-size:10px;font-weight:800;padding:3px 6px;border-radius:4px;color:#fff}
.day.seg{background:#111}.day.ter{background:#111}.day.qua{background:#111}.day.qui{background:#111}.day.sex{background:#2196f3}.day.sab{background:#2196f3}.day.dom{background:#e74c3c}
.mes{font-size:12px;font-weight:800}
.semana{margin-left:auto;font-size:9px;font-weight:700;background:#f0f0f0;padding:4px 6px;border-radius:10px}
.linha{display:flex;gap:4px;padding:3px 6px;align-items:center}
.p{font-size:11px;font-weight:700;width:28px;flex-shrink:0}
select.nome{flex:1;min-width:0;border:0;border-radius:6px;padding:8px 4px;font-size:11px;font-weight:700;color:#fff;background:#2ecc71;appearance:none}
select.nome.branco{background:#fff;color:#111;border:1px solid #ddd}
select.turno{width:62px;flex-shrink:0;border:0;border-radius:6px;padding:8px 2px;font-size:11px;font-weight:800;appearance:none;text-align:center}
select.turno.ja{background:#2ecc71;color:#fff}
select.turno.al{background:#f1c40f;color:#111}
select.turno.alja{background:#2ecc71;color:#fff}
.plus{background:#111;color:#fff;border:0;width:26px;height:30px;border-radius:4px;font-size:16px;cursor:pointer;flex-shrink:0}
.del{background:#e74c3c;color:#fff;border:0;width:26px;height:30px;border-radius:4px;font-size:14px;cursor:pointer;flex-shrink:0}
</style>
</head>
<body>

<div class="top"><b>ESTAGEFLOW</b><span class="pill y">197 FIXOS</span><span class="pill g">R$ 75350</span><button class="menu">☰</button></div>

<div class="grid" id="grid"></div>

<script>
const MUSICOS=["ESCOLHA","ISRAEL","YGOR","LUCIANO","ANDRE","ANDERSON VAT 60 SOLO","ROBSON SOLO","RICK SOLO","PAOLI","DOUGLAS","EDILL","VAT 60","MARTIN","FELIPE DUO","DUO CLASSIC ROCK","VAT 60 EVENTO"];
const DIAS=[
{num:23,day:"SEG",cls:"seg",sem:"SEGUNDA",rows:[["P1:","ISRAEL","JA"],["P2:","YGOR","JA"],["P3:","LUCIANO","JA"],["P4:","ANDRE","JA"],["P5:","ANDERSON VAT 60 SOLO","JA"],["P6:","ESCOLHA","AL"]]},
{num:24,day:"TER",cls:"ter",sem:"TERÇA",rows:[["P1:","ROBSON SOLO","JA"],["P2:","RICK SOLO","JA"],["P3:","ANDRE","JA"],["P4:","PAOLI","JA"],["P5:","ISRAEL","JA"],["P6:","ESCOLHA","AL"]]},
{num:25,day:"QUA",cls:"qua",sem:"QUARTA",rows:[["P1:","DOUGLAS","JA"],["P2:","ANDRE","JA"],["P3:","RICK SOLO","JA"],["P4:","ROBSON SOLO","JA"],["P5:","EDILL","JA"],["P6:","ESCOLHA","AL"]]},
{num:26,day:"QUI",cls:"qui",sem:"QUINTA",rows:[["P1:","ISRAEL","JA"],["P2:","EDILL","JA"],["P3:","LUCIANO","JA"],["P4:","PAOLI","JA"],["P5:","ANDRE","JA"],["P6:","ESCOLHA","AL"]]},
{num:27,day:"SEX",cls:"sex",sem:"SEXTA",rows:[["P1:","YGOR","JA"],["P2:","EDILL","JA"],["P3:","ANDRE","JA"],["P4:","LUCIANO","JA"],["P5:","VAT 60","JA"],["P6:","ESCOLHA","AL"]]},
{num:28,day:"SAB",cls:"sab",sem:"SÁBADO",rows:[["P1:","EDILL","AL/JA"],["P2:","YGOR","AL/JA"],["P3:","LUCIANO","AL"],["P4:","PAOLI","JA"],["P5:","VAT 60","AL/JA"],["P6:","RICK SOLO","AL/JA"]]},
{num:29,day:"DOM",cls:"dom",sem:"DOMINGO",rows:[["P1:","LUCIANO","AL/JA"],["P2:","YGOR","AL/JA"],["P3:","ANDRE","AL/JA"],["P4:","VAT 60","AL/JA"],["P5:","EDILL","AL/JA"],["P6:","ISRAEL","AL"]]},
{num:30,day:"SEG",cls:"seg",sem:"SEGUNDA",rows:[["P1:","PAOLI","JA"],["P2:","DOUGLAS","JA"],["P3:","ANDERSON VAT 60 SOLO","JA"],["P4:","ANDRE","JA"],["P5:","MARTIN","JA"],["P6:","ESCOLHA","AL"]]}
];
function clsTurno(t){return t==="AL"?"al":t==="AL/JA"?"alja":"ja"}
function render(){
document.getElementById('grid').innerHTML=DIAS.map((d,di)=>{
let rows=d.rows.map((r,ri)=>{
let nc=r[1]==="ESCOLHA"?"nome branco":"nome";
let tc="turno "+clsTurno(r[2]);
let opts=MUSICOS.map(m=>`<option ${m===r[1]?"selected":""}>${m}</option>`).join("");
let topts=["JA","AL","AL/JA"].map(t=>`<option ${t===r[2]?"selected":""}>${t}</option>`).join("");
return `<div class="linha"><span class="p">${r[0]}</span><select class="${nc}" onchange="DIAS[${di}].rows[${ri}][1]=this.value;this.className='nome'">${opts}</select><select class="${tc}" onchange="DIAS[${di}].rows[${ri}][2]=this.value;render()">${topts}</select><button class="plus" onclick="DIAS[${di}].rows.splice(${ri}+1,0,['P6:','ESCOLHA','AL']);render()">+</button><button class="del" onclick="DIAS[${di}].rows.splice(${ri},1);render()">×</button></div>`;
}).join("");
return `<div class="card"><div class="head"><span class="num">${d.num}</span><span class="day ${d.cls}">${d.day}</span><span class="mes">- NOV/2026</span><span class="semana">${d.sem}</span></div>${rows}</div>`;
}).join("");
}
render();
</script>
</body>
</html>
