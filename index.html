<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TAKI SOM - QUADRADO PEQUENO + DIA SEMANA</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial}
body{background:#E9EEF3}
.top{background:#0F172A;color:#fff;padding:8px;display:flex;gap:6px;position:sticky;top:0;z-index:1000}
.top b{flex:1;font-size:11px} .top b span{color:#FACC15}
.top button{padding:7px 10px;border:none;border-radius:8px;font-weight:900;font-size:11px}
.btnMenuFull{background:#FACC15;color:#000;padding:12px;border:none;width:calc(100% - 12px);margin:6px;border-radius:10px;font-weight:900;font-size:14px}
.barBlack{background:#1F2937;color:#fff;text-align:center;padding:6px;font-weight:900;font-size:10px}
.barTabs{background:#fff;padding:6px;display:flex;gap:4px;overflow:auto}
.barTabs button{padding:8px 12px;border:none;border-radius:16px;font-weight:900;font-size:11px;background:#F1F5F9}
.barTabs button.active{background:#1F2937;color:#fff}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(125px,1fr));gap:5px;padding:5px}
.diaCard{background:#fff;border:1px solid #111;border-radius:10px;padding:5px}
.diaHead{font-weight:900;color:#1E3A8A;font-size:12px;margin-bottom:4px;display:flex;justify-content:space-between}
.diaHead small{font-size:9px;color:#475569;background:#E2E8F0;padding:2px 5px;border-radius:6px}
.linha{display:flex;align-items:center;gap:2px;margin-bottom:2px;font-size:8px;font-weight:700}
.linha select{padding:2px 2px;border:1px solid #999;border-radius:6px;font-size:8px;font-weight:700;flex:1}
.linha select.turno{background:#EDE9FE;color:#4C1D95;flex:0 0 36px}
.cardBox{background:#fff;border-radius:14px;margin:8px;padding:14px}
.sec{display:none} .sec.show{display:block}
.drawer{position:fixed;top:0;left:-310px;width:295px;height:100%;background:#0F172A;color:#fff;z-index:5000;transition:.3s;padding:16px;overflow:auto}
.drawer.open{left:0}
.drawer button{width:100%;padding:12px;margin-bottom:6px;border:none;border-radius:10px;font-weight:800;text-align:left;background:#1E293B;color:#fff;font-size:13px}
.drawer button.yellow{background:#FACC15;color:#000;text-align:center}
.fundo{position:fixed;inset:0;background:rgba(0,0,0,.5);display:none;z-index:4000} .fundo.show{display:block}
@media print{
@page{size:A4 landscape;margin:3mm}
html,body{background:#fff!important}
.top,.btnMenuFull,.barTabs,.drawer,.fundo{display:none!important}
.barBlack{background:#fff!important;color:#000!important;border:1px solid #000;font-size:9px;padding:3px}
.grid{grid-template-columns:repeat(6,1fr)!important;gap:2px!important;padding:2px!important}
.diaCard{border:0.6px solid #000!important;border-radius:5px!important;padding:2px!important;break-inside:avoid}
.diaHead{font-size:8px!important;margin-bottom:1px!important}
.diaHead small{font-size:6px!important;padding:1px 3px!important}
.linha{margin-bottom:0.5px!important;font-size:5.5px!important}
.linha select{border:none!important;appearance:none!important;padding:0!important;font-size:5.5px!important;background:transparent!important}
}
</style>
</head>
<body>
<div class="top"><b><span>TAKI</span> SOM - PEQUENO + DIA SEMANA - 1 FOLHA</b><button style="background:#86EFAC" onclick="go('rel')">RELATORIO</button><button style="background:#fff" onclick="window.print()">🖨️ 1 FOLHA</button></div>
<button class="btnMenuFull" onclick="openMenu()">☰ MENU COMPLETO - CLIQUE AQUI</button>
<div class="fundo" id="fundo" onclick="closeMenu()"></div>
<div class="drawer" id="drawer">
<h3 style="color:#FACC15">☰ MENU TAKI SOM</h3><br>
<button onclick="go('grade');closeMenu()">📅 Grade Quadrado Pequeno</button>
<button onclick="go('rel');closeMenu()">📊 Relatorio + Cache</button>
<button onclick="go('art');closeMenu()">🎤 Artistas Nome + Cache</button>
<button onclick="go('casa');closeMenu()">🏠 Casas P1-P6</button>
<button onclick="go('texto');closeMenu()">📝 Gerar Texto Cliente</button>
<button style="background:#22C55E;color:#000;font-weight:900" onclick="window.print();closeMenu()">🖨️ IMPRIMIR 1 FOLHA A4 DEITADO</button>
<button class="yellow" onclick="closeMenu()">✖ FECHAR</button>
</div>
<div class="barTabs"><button id="tab-grade" class="active" onclick="go('grade')">Grade Pequena</button><button id="tab-rel" onclick="go('rel')">Relatorio</button><button id="tab-art" onclick="go('art')">Artistas</button></div>
<div class="barBlack">NOVEMBRO 2026 • 1 AO 30 • P1-P6 = CASAS • AL/JA • COM DIA DA SEMANA • 1 FOLHA A4</div>
<div id="sec-grade" class="sec show"><div class="grid" id="grade"></div></div>
<div id="sec-rel" class="sec"><div class="cardBox"><h3>Relatorio + Cache</h3><div id="resRel"></div></div></div>
<div id="sec-art" class="sec"><div class="cardBox"><h3>Artistas Nome + Cache</h3><div style="display:flex;gap:6px;margin-top:10px"><input id="nomeArt" placeholder="NOME" style="flex:1;padding:10px;border-radius:8px;border:1px solid #ccc;font-weight:800"><input id="cacheArt" type="number" placeholder="350" style="width:90px;padding:10px;border-radius:8px;border:1px solid #ccc;font-weight:800"></div><button onclick="addArt()" style="width:100%;margin-top:6px;padding:12px;background:#FACC15;border:none;border-radius:10px;font-weight:900">SALVAR</button><div id="listaArt"></div></div></div>
<div id="sec-casa" class="sec"><div class="cardBox"><h3>Casas P1-P6</h3><div id="formCasa"></div><button onclick="saveCasas()" style="width:100%;margin-top:8px;padding:12px;background:#0F172A;color:#fff;border:none;border-radius:10px;font-weight:900">Salvar</button></div></div>
<div id="sec-texto" class="sec"><div class="cardBox"><h3>Texto Cliente</h3><textarea id="txtCli" style="width:100%;height:360px;padding:10px;border-radius:10px;border:1px solid #ccc"></textarea><button onclick="gerarTexto()" style="width:100%;margin-top:6px;padding:12px;background:#FACC15;border:none;border-radius:10px;font-weight:900">Gerar</button><button onclick="copiar()" style="width:100%;margin-top:6px;padding:12px;background:#0F172A;color:#fff;border:none;border-radius:10px;font-weight:900">Copiar</button></div></div>
<script>
var artistas=[{nome:"ANDRE",cache:300},{nome:"EDILL",cache:350},{nome:"LUCIANO",cache:300},{nome:"PAOLI",cache:320},{nome:"ISRAEL",cache:300},{nome:"YGOR",cache:280}];
var casas={P1:"Cais",P2:"Vila",P3:"Grill",P4:"Ze",P5:"Omau",P6:"Vago"};
var dados={};
var diasSem=["DOM","SEG","TER","QUA","QUI","SEX","SAB"];
function criaDados(){dados={};for(var d=1;d<=30;d++){dados[d]={};for(var p=1;p<=6;p++)dados[d]['P'+p]={nome:"ANDRE",turno:"AL"};}}criaDados();
function openMenu(){document.getElementById('drawer').classList.add('open');document.getElementById('fundo').classList.add('show')}
function closeMenu(){document.getElementById('drawer').classList.remove('open');document.getElementById('fundo').classList.remove('show')}
function go(id){document.querySelectorAll('.sec').forEach(s=>s.classList.remove('show'));document.getElementById('sec-'+id).classList.add('show');document.querySelectorAll('.barTabs button').forEach(b=>b.classList.remove('active'));var t=document.getElementById('tab-'+id);if(t)t.classList.add('active');if(id=='grade')renderGrade();if(id=='rel')renderRel();if(id=='art')renderArt();if(id=='casa')renderCasa();if(id=='texto')gerarTexto()}
function renderGrade(){
var cont=document.getElementById('grade');cont.innerHTML='';
for(var d=1;d<=30;d++){
var dt=new Date(2026,10,d);var ds=diasSem[dt.getDay()];
var card=document.createElement('div');card.className='diaCard';
var html='<div class="diaHead"><span>'+d+' ▼</span><small>'+ds+'</small></div>';
for(var p=1;p<=6;p++){
var cur=dados[d]['P'+p];
var optsArt=artistas.map(a=>'<option value="'+a.nome+'" '+(a.nome==cur.nome?'selected':'')+'>'+a.nome+'</option>').join('');
var optsTurno='<option '+(cur.turno=='AL'?'selected':'')+'>AL</option><option '+(cur.turno=='JA'?'selected':'')+'>JA</option><option '+(cur.turno=='AL/JA'?'selected':'')+'>AL/JA</option>';
html+='<div class="linha">P'+p+': <select onchange="dados['+d+']['+'P'+p+'].nome=this.value; salvar();">'+optsArt+'</select><select class="turno" onchange="dados['+d+']['+'P'+p+'].turno=this.value; salvar()">'+optsTurno+'</select></div>';
}
card.innerHTML=html;cont.appendChild(card);
}
salvar();
}
function addArt(){var n=document.getElementById('nomeArt').value.toUpperCase().trim();var c=parseFloat(document.getElementById('cacheArt').value)||0;if(!n)return;var idx=artistas.findIndex(a=>a.nome==n);if(idx>=0)artistas[idx].cache=c;else artistas.push({nome:n,cache:c});document.getElementById('nomeArt').value='';document.getElementById('cacheArt').value='';renderArt();renderGrade();salvar();}
function renderArt(){document.getElementById('listaArt').innerHTML=artistas.map((a,i)=>'<div style="display:flex;justify-content:space-between;padding:10px;background:#F1F5F9;border-radius:8px;margin-top:4px"><div><b style="font-size:12px">'+a.nome+'</b><br><span style="color:green;font-weight:900;font-size:11px">R$ '+a.cache+'</span></div><button onclick="artistas.splice('+i+',1);renderArt();renderGrade();salvar()" style="background:#FFD2D2;border:none;padding:4px 8px;border-radius:6px">X</button></div>').join('');}
function renderCasa(){var h='';for(var k in casas){h+='<div style="margin-top:6px"><label style="font-weight:800;font-size:11px">'+k+'</label><input id="casa_'+k+'" value="'+casas[k]+'" style="width:100%;padding:8px;border-radius:6px;border:1px solid #ccc;margin-top:2px;font-size:12px"></div>';}document.getElementById('formCasa').innerHTML=h;}
function saveCasas(){for(var k in casas)casas[k]=document.getElementById('casa_'+k).value;salvar();alert('Casas salvas!');go('grade');}
function renderRel(){var html='';for(var i=0;i<artistas.length;i++){var art=artistas[i];var lista=[];var tot=0;for(var d=1;d<=30;d++){for(var p=1;p<=6;p++){var inf=dados[d]['P'+p];if(inf&&inf.nome==art.nome){var dt=new Date(2026,10,d);var ds=diasSem[dt.getDay()];lista.push('Dia '+d+' '+ds+' P'+p);tot+=inf.cache;}}}if(lista.length==0)continue;html+='<div style="background:#F9FAFB;padding:10px;border-radius:10px;margin-top:6px;border-left:4px solid #FACC15"><b style="font-size:12px">'+art.nome+' - '+lista.length+'</b><div style="color:green;font-weight:900;font-size:12px">R$ '+tot+'</div><div style="font-size:10px">'+lista.join('<br>')+'</div></div>';}document.getElementById('resRel').innerHTML=html||'Nenhum show';}
function gerarTexto(){var t='*TAKI SOM - NOVEMBRO 2026 - COM DIA SEMANA*\\n\\n';for(var d=1;d<=30;d++){var dt=new Date(2026,10,d);var ds=diasSem[dt.getDay()];t+='*Dia '+d+' '+ds+'* - ';for(var p=1;p<=6;p++){var inf=dados[d]['P'+p];if(inf)t+='P'+p+'('+casas['P'+p]+'): '+inf.nome+' '+inf.turno+' | ';}t+='\\n';}document.getElementById('txtCli').value=t;}
function copiar(){var e=document.getElementById('txtCli');e.select();document.execCommand('copy');alert('Copiado!')}
function salvar(){try{localStorage.setItem('TAKI_PEQUENO_V13',JSON.stringify({artistas,casas,dados}))}catch(e){}}
function carregar(){try{var s=localStorage.getItem('TAKI_PEQUENO_V13');if(!s)return;var o=JSON.parse(s);if(o.artistas)artistas=o.artistas;if(o.casas)casas=o.casas;if(o.dados){var ok=true;for(var d=1;d<=30;d++)if(!o.dados[d])ok=false;if(ok)dados=o.dados;}}catch(e){}}
try{carregar();renderGrade();renderArt();renderCasa();renderRel();}catch(e){criaDados();renderGrade();}
</script>
</body>
</html>
