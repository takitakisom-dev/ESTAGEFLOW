<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ESTAGEFLOW</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:Arial,sans-serif}
body{background:#f2f2f2}
.top{background:#111;color:#fff;padding:14px 12px;display:flex;align-items:center;gap:10px}
.top b{font-size:19px}
.pill{font-size:11px;font-weight:800;padding:5px 10px;border-radius:20px;white-space:nowrap}
.pill.y{background:#f1c40f;color:#111}
.pill.g{background:#2ecc71;color:#fff}
.menu{margin-left:auto;background:none;border:0;color:#fff;font-size:24px;cursor:pointer}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:8px}
.card{background:#fff;border-radius:12px;overflow:hidden;box-shadow:0 1px 4px rgba(0,0,0,.12)}
.head{display:flex;align-items:center;gap:6px;padding:10px 8px 8px}
.num{font-size:17px;font-weight:800}
.dia{font-size:10px;font-weight:800;color:#fff;background:#111;padding:4px 6px;border-radius:4px}
.mes{font-size:13px;font-weight:800}
.semana{margin-left:auto;font-size:9px;font-weight:700;background:#f0f0f0;padding:5px 7px;border-radius:20px}
.linha{display:flex;gap:5px;padding:3px 7px 3px 7px;align-items:center}
.linha:last-child{padding-bottom:9px}
.p{font-size:11px;font-weight:700;width:26px;flex-shrink:0}
select{border:0;border-radius:6px;height:34px;font-size:12px;font-weight:700;padding:0 4px;appearance:none;cursor:pointer}
select.nome{flex:1;min-width:0;color:#fff;background:#2ecc71}
select.nome.branco{background:#fff;color:#111;border:1px solid #ddd}
select.turno{width:64px;flex-shrink:0;text-align:center;font-weight:800}
select.turno.ja{background:#2ecc71;color:#fff}
select.turno.al{background:#f1c40f;color:#111}
select.turno.alja{background:#2ecc71;color:#fff}
.plus{background:#111;color:#fff;border:0;width:28px;height:34px;border-radius:5px;font-size:18px;cursor:pointer;flex-shrink:0}
.del{background:#e74c3c;color:#fff;border:0;width:28px;height:34px;border-radius:5px;font-size:15px;cursor:pointer;flex-shrink:0}
</style>
</head>
<body>

<div class="top"><b>ESTAGEFLOW</b><span class="pill y">197 FIXOS</span><span class="pill g">R$ 75350</span><button class="menu">☰</button></div>

<div class="grid" id="grid"></div>

<script>
const MUSICOS=["ESCOLHA","ISRAEL","YGOR","LUCIANO","ANDRE","ANDERSON VAT 60 SOLO","ROBSON SOLO","RICK SOLO","PAOLI","DOUGLAS","EDILL","VAT 60","MARTIN","FELIPE DUO","DUO CLASSIC ROCK","VAT 60 EVENTO"];
const DIAS=[
{num:23,dia:"SEG",sem:"SEGUNDA",rows:[["P1:","ISRAEL","JA"],["P2:","YGOR","JA"],["P3:","LUCIANO","JA"],["P4:","ANDRE","JA"],["P5:","ANDERSON VAT 60 SOLO","JA"],["P6:","ESCOLHA","AL"]]},
{num:24,dia:"TER",sem:"TERÇA",rows:[["P1:","ROBSON SOLO","JA"],["P2:","RICK SOLO","JA"],["P3:","ANDRE","JA"],["P4:","PAOLI","JA"],["P5:","ISRAEL","JA"],["P6:","ESCOLHA","AL"]]},
{num:25,dia:"QUA",sem:"QUARTA",rows:[["P1:","DOUGLAS","JA"],["P2:","ANDRE","JA"],["P3:","RICK SOLO","JA"],["P4:","ROBSON SOLO","JA"],["P5:","EDILL","JA"],["P6:","ESCOLHA","AL"]]},
{num:26,dia:"QUI",sem:"QUINTA",rows:[["P1:","ISRAEL","JA"],["P2:","EDILL","JA"],["P3:","LUCIANO","JA"],["P4:","PAOLI","JA"],["P5:","ANDRE","JA"],["P6:","ESCOLHA","AL"]]},
{num:27,dia:"SEX",sem:"SEXTA",rows:[["P1:","YGOR","JA"],["P2:","EDILL","JA"],["P3:","ANDRE","JA"],["P4:","LUCIANO","JA"],["P5:","VAT 60","JA"],["P6:","ESCOLHA","AL"]]},
{num:28,dia:"SAB",sem:"SÁBADO",rows:[["P1:","EDILL","AL/JA"],["P2:","YGOR","AL/JA"],["P3:","LUCIANO","AL"],["P4:","PAOLI","JA"],["P5:","VAT 60","AL/JA"],["P6:","RICK SOLO","AL/JA"]]},
{num:29,dia:"DOM",sem:"DOMINGO",rows:[["P1:","LUCIANO","AL/JA"],["P2:","YGOR","AL/JA"],["P3:","ANDRE","AL/JA"],["P4:","VAT 60","AL/JA"],["P5:","EDILL","AL/JA"],["P6:","ISRAEL","AL"]]},
{num:30,dia:"SEG",sem:"SEGUNDA",rows:[["P1:","PAOLI","JA"],["P2:","DOUGLAS","JA"],["P3:","ANDERSON VAT 60 SOLO","JA"],["P4:","ANDRE","JA"],["P5:","MARTIN","JA"],["P6:","ESCOLHA","AL"]]}
];
function clsT(t){return t==="AL"?"al":t==="AL/JA"?"alja":"ja"}
function render(){
document.getElementById('grid').innerHTML=DIAS.map((d,di)=>{
let rows=d.rows.map((r,ri)=>{
let nc=r[1]==="ESCOLHA"?"nome branco":"nome";
let opts=MUSICOS.map(m=>`<option ${m===r[1]?"selected":""}>${m}</option>`).join("");
let topts=["JA","AL","AL/JA"].map(t=>`<option ${t===r[2]?"selected":""}>${t}</option>`).join("");
let isLast=ri===d.rows.length-1;
let delBtn=isLast?"":`<button class="del" onclick="DIAS[${di}].rows.splice(${ri},1);render()">×</button>`;
return `<div class="linha"><span class="p">${r[0]}</span><select class="${nc}" onchange="DIAS[${di}].rows[${ri}][1]=this.value;render()">${opts}</select><select class="turno ${clsT(r[2])}" onchange="DIAS[${di}].rows[${ri}][2]=this.value;render()">${topts}</select><button class="plus" onclick="DIAS[${di}].rows.splice(${ri}+1,0,['P6:','ESCOLHA','AL']);render()">+</button>${delBtn}</div>`;
}).join("");
return `<div class="card"><div class="head"><span class="num">${d.num}</span><span class="dia">${d.dia}</span><span class="mes">- NOV/2026</span><span class="semana">${d.sem}</span></div>${rows}</div>`;
}).join("");
}
render();
</script>
</body>
</html>
