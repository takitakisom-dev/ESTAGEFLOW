<!DOCTYPE html>

<head>
<meta charset="UTF-8">

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Inter,system-ui,Arial,sans-serif}
body{background:#F2F4F7}
.top{background:#0F1115;color:#fff;padding:8px 10px;display:flex;gap:6px;align-items:center;position:sticky;top:0;z-index:30;flex-wrap:wrap}
.pill{font-size:11px;font-weight:900;padding:6px 12px;border-radius:20px}.z{background:#FDE68A;color:#000}.g{background:#BBF7D0;color:#000}
.btnPrint{margin-left:auto;background:#fff;color:#000;border:0;border-radius:20px;padding:7px 12px;font-size:11px;font-weight:900;cursor:pointer}
.selMes{background:#1F2937;color:#fff;border:1px solid #374151;border-radius:10px;padding:7px 10px;font-size:12px;font-weight:900;cursor:pointer;min-width:170px}
.grid{display:grid;grid-template-columns:1fr;gap:8px;padding:8px}
@media(min-width:600px){.grid{grid-template-columns:repeat(2,1fr)}}
@media(min-width:1100px){.grid{grid-template-columns:repeat(3,1fr)}}
@media(min-width:1500px){.grid{grid-template-columns:repeat(4,1fr)}}
.card{background:#fff;border-radius:14px;padding:10px;box-shadow:0 1px 4px rgba(0,0,0,.08);border:1px solid #E5E7EB}
.diaTop{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;border-bottom:2px solid #111;padding-bottom:6px}
.diaLeft{font-weight:900;font-size:13px}
.linhaCasa{display:flex;align-items:center;gap:4px;margin-bottom:5px}
.linhaCasa b{width:28px;font-size:10px;flex-shrink:0;color:#555}
.linhaCasa select{height:32px;border:1.5px solid #E5E7EB;border-radius:10px;padding:0 6px;font-size:11px;font-weight:700;background:#fff;cursor:pointer}
.selMus{flex:1;min-width:0}
.selTurno{width:68px!important;font-size:9px!important;font-weight:900!important;text-align:center}
.selTurno.al{background:#FEF3C7!important;border-color:#F59E0B!important;color:#92400E!important}
.selTurno.ja{background:#DBEAFE!important;border-color:#3B82F6!important;color:#1E40AF!important}
.selTurno.both{background:#E0E7FF!important;border-color:#6366F1!important;color:#4338CA!important}
.linhaCasa.preenchida .selMus{background:#DCFCE7!important;border-color:#22C55E!important;color:#166534}
.linhaCasa.extra{margin-left:28px;border-left:3px solid #FB7185;padding-left:6px}
.btnMais{width:24px;height:24px;border-radius:8px;border:0;font-weight:900;font-size:13px;cursor:pointer;flex-shrink:0;display:flex;align-items:center;justify-content:center}
.btnMais.add{background:#111;color:#fff}.btnMais.del{background:#FEE2E2;color:#B91C1C;border:1px solid #FECACA}
.printTxt,.printTurno{display:none}
.side{position:fixed;left:-100%;top:0;bottom:0;width:90%;max-width:380px;background:#111;color:#fff;z-index:60;transition:.28s;padding:14px;overflow:auto}
.side.open{left:0}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);display:none;z-index:50}
.overlay.open{display:block}
.side h2{font-size:18px;font-weight:900;margin-bottom:2px}
.side .sub{font-size:8px;color:#9CA3AF;margin-bottom:10px}
.side button{width:100%;padding:12px 10px;margin-bottom:6px;border:none;border-radius:10px;text-align:left;background:#1F1F1F;color:#fff;font-size:12px;font-weight:700;cursor:pointer;display:flex;align-items:center;gap:8px}
.side button.yellow{background:#FBBF24;color:#000;justify-content:center;font-weight:900}
.side button.green{background:#22C55E;color:#000;justify-content:center;font-weight:900}
.side button.blue{background:#2563EB;justify-content:center}
.side button.purple{background:#7C3AED;justify-content:center}
.side button.orange{background:#EA580C;justify-content:center}
.side button.red{background:#7F1D1D;justify-content:center}
.side button.white{background:#fff;color:#000;justify-content:center;font-weight:900}
.side button.dark{background:#27272A}
.side button.mesBtn{background:#1E293B;border:1px solid #334155}
.side button.mesBtn.ativo{background:#FBBF24;color:#000;border-color:#FBBF24;font-weight:900}
.sec{display:none}.sec.show{display:block}
.box{background:#fff;border-radius:14px;margin:8px;padding:14px;color:#111}
.tabs{display:flex;background:#fff;padding:6px 12px;border-bottom:1px solid #E5E7EB;gap:8px;overflow:auto}
.tabs button{border:none;background:transparent;padding:8px 14px;font-size:12px;font-weight:700;border-bottom:2px solid transparent;cursor:pointer;white-space:nowrap}
.tabs button.active{border-bottom:2px solid #111;color:#111}.tabs button.inactive{color:#9CA3AF}
.mesBar{background:#fff;padding:8px 12px;display:flex;gap:8px;align-items:center;border-bottom:1px solid #E5E7EB;overflow:auto}
.mesBar button{padding:6px 12px;border-radius:20px;border:1px solid #E5E7EB;background:#fff;font-size:11px;font-weight:800;cursor:pointer;white-space:nowrap}
.mesBar button.ativo{background:#111;color:#fff;border-color:#111}
@media print{.top,.side,.overlay,.btnMais,.tabs,.mesBar{display:none!important}.grid{grid-template-columns:repeat(5,1fr)!important;gap:3px!important;padding:2px!important}.card{border:0.6px solid #000!important;padding:4px!important;border-radius:5px!important;box-shadow:none!important}.linhaCasa select{display:none!important}.printTxt{display:inline!important;font-size:7px!important;font-weight:700}.printTurno{display:inline!important;font-size:5.5px!important;font-weight:900;padding:1px 3px;border-radius:4px;margin-left:2px;border:0.5px solid}@page{size:A4 landscape;margin:3mm}}
</style>
</head>
<body>
<div class="overlay" id="overlay" onclick="closeAll()"></div>
<div class="side" id="side">
<h2>☰ ESTAGEFLOW</h2>
<div class="sub">NOV/26 A DEZ/27 • CALENDÁRIO CORRIGIDO • 1000 ANOS</div>
<div style="background:#22C55E;color:#000;padding:8px;border-radius:8px;font-weight:900;text-align:center;margin-bottom:10px;font-size:11px" id="stMenu">✅ CALENDÁRIO CORRIGIDO - DOMINGO 01/11/26</div>
<div style="background:#0F172A;border-radius:12px;padding:10px;margin-bottom:12px;border:1px solid #1E293B">
<div style="font-size:10px;font-weight:900;color:#94A3B8;margin-bottom:6px">📅 14 MESES - CALENDÁRIO REAL CORRIGIDO</div>
<div id="listaMesesMenu" style="display:grid;grid-template-columns:1fr 1fr;gap:5px"></div>
</div>
<button class="dark" onclick="go('grade');closeAll()">📅 GRADE COMPACTA AL/JA</button>
<button class="dark" style="background:#FFF9C4;color:#000" onclick="go('fin');closeAll()">💰 FINANCEIRO</button>
<button class="dark" style="background:#FFF9C4;color:#000" onclick="go('plan');closeAll()">📋 PLANEJAMENTO</button>
<button class="dark" onclick="go('art');closeAll()">🎤 MÚSICOS</button>
<button class="dark" onclick="go('casa');closeAll()">🏠 CASAS P1-P6</button>
<button class="yellow" onclick="window.print()">🖨️ IMPRIMIR - 1 FOLHA</button>
<button class="green" onclick="forcarSalvar()">💾 SALVAR FIXO - 1000 ANOS</button>
<button class="blue" onclick="exportar()">📤 EXPORTAR BACKUP (14 MESES)</button>
<button class="blue" onclick="document.getElementById('fileIn').click()">📥 IMPORTAR BACKUP</button>
<input type="file" id="fileIn" accept=".json" style="display:none" onchange="importar(event)">
<button class="purple" id="btnInstalar" onclick="instalarApp()">📲 INSTALAR APP</button>
<button class="orange" onclick="compartilhar()">🔗 COMPARTILHAR</button>
<button class="red" onclick="zerar()">🧹 ZERAR MÊS ATUAL</button>
<button class="white" onclick="closeAll()">✕ FECHAR</button>
</div>
<div class="top">
<span style="cursor:pointer;background:#222;padding:6px 12px;border-radius:10px;font-weight:900" onclick="openMenu()">☰</span>
<b style="line-height:1">ESTAGEFLOW<br><span style="font-size:9px;font-weight:400;opacity:.6" id="subTop">NOV/26 A DEZ/27 - CORRIGIDO</span></b>
<select id="selMesTop" class="selMes" onchange="trocarMes(this.value)"></select>
<span class="pill z" id="cnt">0 FIXOS</span>
<span class="pill g" id="totalFin">R$ 0</span>
<button class="btnPrint" onclick="window.print()">🖨️ 1 FOLHA</button>
</div>
<div class="mesBar" id="mesBar"></div>
<div id="sec-grade" class="sec show"><div class="tabs"><button class="active">Grade</button><button class="inactive" onclick="go('fin')">Financeiro</button><button class="inactive" onclick="go('plan')">Planejamento</button></div><div class="grid" id="grade"></div></div>
<div id="sec-fin" class="sec"><div class="box"><h3>💰 Financeiro - <span id="finMesLabel"></span></h3><div id="finBox"></div></div></div>
<div id="sec-plan" class="sec"><div class="box"><h3>📋 Planejamento - <span id="planMesLabel"></span></h3><div id="planBox"></div></div></div>
<div id="sec-art" class="sec"><div class="box"><h3>🎤 Músicos</h3><div style="display:flex;gap:6px;margin:8px 0"><input id="nArt" placeholder="NOME" style="flex:1;padding:10px;border-radius:10px;border:1px solid #ccc;font-weight:800;text-transform:uppercase"><input id="cArt" type="number" placeholder="R$" style="width:90px;padding:10px;border-radius:10px"><button onclick="addArt()" style="padding:10px 14px;background:#FBBF24;border:none;border-radius:10px;font-weight:900">ADD</button></div><div id="lArt"></div></div></div>
<div id="sec-casa" class="sec"><div class="box"><h3>🏠 Casas P1-P6</h3><div id="fCasa"></div></div></div>
<script>
var mesesLista=[
 {id:"2026-11",label:"NOV/2026",nome:"Novembro 2026",dias:30,ini:0},
 {id:"2026-12",label:"DEZ/2026",nome:"Dezembro 2026",dias:31,ini:2},
 {id:"2027-01",label:"JAN/2027",nome:"Janeiro 2027",dias:31,ini:5},
 {id:"2027-02",label:"FEV/2027",nome:"Fevereiro 2027",dias:28,ini:1},
 {id:"2027-03",label:"MAR/2027",nome:"Março 2027",dias:31,ini:1},
 {id:"2027-04",label:"ABR/2027",nome:"Abril 2027",dias:30,ini:4},
 {id:"2027-05",label:"MAI/2027",nome:"Maio 2027",dias:31,ini:6},
 {id:"2027-06",label:"JUN/2027",nome:"Junho 2027",dias:30,ini:2},
 {id:"2027-07",label:"JUL/2027",nome:"Julho 2027",dias:31,ini:4},
 {id:"2027-08",label:"AGO/2027",nome:"Agosto 2027",dias:31,ini:0},
 {id:"2027-09",label:"SET/2027",nome:"Setembro 2027",dias:30,ini:3},
 {id:"2027-10",label:"OUT/2027",nome:"Outubro 2027",dias:31,ini:5},
 {id:"2027-11",label:"NOV/2027",nome:"Novembro 2027",dias:30,ini:1},
 {id:"2027-12",label:"DEZ/2027",nome:"Dezembro 2027",dias:31,ini:3}
];
var diasSemana=["DOM","SEG","TER","QUA","QUI","SEX","SAB"];
var KEY="ESTAGEFLOW_MULTI_MESES_NOV26_DEZ27_V9_CORRIGIDO_DOMINGO";
var KEY_MUS="musicos_lista_final_valores";
var artistasPadrao=[{nome:"EDILL",cache:300},{nome:"GERVAZIO",cache:300},{nome:"YGOR",cache:300},{nome:"ANDRE",cache:300},{nome:"VAT 60",cache:450},{nome:"DUO CLASSIC ROCK",cache:450},{nome:"PAOLI",cache:300},{nome:"DOUGLAS",cache:300},{nome:"MARTIN",cache:300},{nome:"ROBSON SOLO",cache:300},{nome:"ANDERSON VAT60 SOLO",cache:350}];
var casas={P1:"P1",P2:"P2",P3:"P3",P4:"P4",P5:"P5",P6:"P6"};
var artistas=[];var allDados={};var mesAtual="2026-11";var deferredPrompt=null;
function carregarLista(ch,pd){try{var v=localStorage.getItem(ch);if(v){var a=JSON.parse(v);if(Array.isArray(a)&&a.length>0)return a;}}catch(e){}return pd;}
function getValor(n){var f=artistas.find(a=>a.nome.toUpperCase()===n.toUpperCase());return f?f.cache:300;}
function salvar(){try{localStorage.setItem(KEY,JSON.stringify({all:allDados,artistas:artistas,casas:casas,mes:mesAtual}));localStorage.setItem(KEY+"_BKP1",JSON.stringify({all:allDados,artistas:artistas,casas:casas,mes:mesAtual}));localStorage.setItem(KEY+"_BKP2",JSON.stringify({all:allDados,artistas:artistas,casas:casas,mes:mesAtual}));localStorage.setItem(KEY_MUS,JSON.stringify(artistas.map(a=>({nome:a.nome,valor:a.cache}))));}catch(e){}contar();}
function forcarSalvar(){salvar();var q=contar();document.getElementById('stMenu').textContent=q+" SHOWS EM "+mesLabel(mesAtual)+" - CORRIGIDO";alert("✅ Salvo! "+q+" shows em "+mesLabel(mesAtual)+" - Calendário corrigido!");}
function mesLabel(id){var m=mesesLista.find(x=>x.id==id);return m?m.label:id;}
function getDiasMes(id){var m=mesesLista.find(x=>x.id==id);return m?m.dias:30;}
function getDiaSemana(id,dia){var m=mesesLista.find(x=>x.id==id);if(!m)return "DOM";var idx=(m.ini + dia -1)%7;return diasSemana[idx];}
function ensureMes(id){if(!allDados[id]){allDados[id]={};for(var d=1;d<=getDiasMes(id);d++){allDados[id][d]={};for(var p=1;p<=6;p++){allDados[id][d]['P'+p]=[{nome:"",turno:"AL"}];}}}}
function carregar(){
 try{
  var keys=[KEY,"ESTAGEFLOW_MULTI_MESES_NOV26_DEZ27_V8_FINAL_1000_ANOS","ESTAGEFLOW_MULTI_MESES_DEZ26_DEZ27_V7","ESTAGEFLOW_COMPACTO_ALJA_V5_FINAL"];
  for(var k=0;k<keys.length;k++){
   var s=localStorage.getItem(keys[k]);if(!s)continue;var o=JSON.parse(s);
   if(o.all){allDados=o.all;if(o.artistas)artistas=o.artistas.map(m=>({nome:(m.nome||m).toUpperCase(),cache:m.valor||m.cache||300}));if(o.casas)casas=o.casas;if(o.mes)mesAtual=o.mes;break;}
  }
 }catch(e){}
 if(!artistas||artistas.length==0){artistas=carregarLista(KEY_MUS,artistasPadrao).map(m=>({nome:(m.nome||m).toUpperCase(),cache:m.valor||m.cache||300}));}
 mesesLista.forEach(mm=>ensureMes(mm.id));if(!allDados[mesAtual])mesAtual="2026-11";
}
function trocarMes(id){mesAtual=id;salvar();montarGrade();renderSeletores();contar();}
function montarSeletores(){
 var selTop=document.getElementById('selMesTop');selTop.innerHTML=mesesLista.map(m=>'<option value="'+m.id+'" '+(m.id==mesAtual?'selected':'')+'>'+m.nome+' ('+m.dias+' dias) - 01='+diasSemana[m.ini]+'</option>').join('');
 var bar=document.getElementById('mesBar');bar.innerHTML=mesesLista.map(m=>'<button class="'+(m.id==mesAtual?'ativo':'')+'" onclick="trocarMes(\''+m.id+'\')">'+m.label+' ('+diasSemana[m.ini]+')</button>').join('');
 var menu=document.getElementById('listaMesesMenu');menu.innerHTML=mesesLista.map(m=>'<button class="mesBtn '+(m.id==mesAtual?'ativo':'')+'" onclick="trocarMes(\''+m.id+'\');closeAll();go(\'grade\')">'+m.label+'<br><small>'+diasSemana[m.ini]+'</small></button>').join('');
 document.getElementById('subTop').textContent=mesesLista.find(m=>m.id==mesAtual).nome+" - 01/"+diasSemana[mesesLista.find(m=>m.id==mesAtual).ini];
 document.getElementById('finMesLabel').textContent=mesesLista.find(m=>m.id==mesAtual).nome;
 document.getElementById('planMesLabel').textContent=mesesLista.find(m=>m.id==mesAtual).nome;
}
function mudarMus(d,p,idx,val){allDados[mesAtual][d]['P'+p][idx].nome=val;salvar();renderDia(d);}
function mudarTurno(d,p,idx,val){allDados[mesAtual][d]['P'+p][idx].turno=val;salvar();renderDia(d);}
function addExtra(d,p){var base=allDados[mesAtual][d]['P'+p][0]?.turno=="AL"?"JA":"AL";allDados[mesAtual][d]['P'+p].push({nome:"",turno:base});salvar();renderDia(d);}
function delExtra(d,p,idx){allDados[mesAtual][d]['P'+p].splice(idx,1);if(allDados[mesAtual][d]['P'+p].length==0)allDados[mesAtual][d]['P'+p].push({nome:"",turno:"AL"});salvar();renderDia(d);}
function contar(){var c=0,total=0;var cur=allDados[mesAtual]||{};for(var d in cur)for(var p=1;p<=6;p++){(cur[d]['P'+p]||[]).forEach(it=>{if(it.nome){c++;total+=getValor(it.nome);}})}document.getElementById('cnt').textContent=c+" FIXOS";document.getElementById('totalFin').textContent="R$ "+total;return c;}
function openMenu(){document.getElementById('side').classList.add('open');document.getElementById('overlay').classList.add('open')}
function closeAll(){document.getElementById('side').classList.remove('open');document.getElementById('overlay').classList.remove('open')}
function go(id){document.querySelectorAll('.sec').forEach(s=>s.classList.remove('show'));document.getElementById('sec-'+id).classList.add('show');if(id=='fin')renderFin();if(id=='plan')renderPlan();if(id=='art')renderArt();if(id=='casa')renderCasa();if(id=='grade'){montarGrade();}}
function zerar(){var nomeMes=mesesLista.find(m=>m.id==mesAtual).nome;if(confirm("Zerar "+nomeMes+"?")){var dias=getDiasMes(mesAtual);for(var d=1;d<=dias;d++)for(var p=1;p<=6;p++)allDados[mesAtual][d]['P'+p]=[{nome:"",turno:"AL"}];salvar();montarGrade();closeAll();}}
function addArt(){var n=document.getElementById('nArt').value.toUpperCase().trim();var c=parseFloat(document.getElementById('cArt').value)||300;if(!n)return;artistas.push({nome:n,cache:c});document.getElementById('nArt').value='';document.getElementById('cArt').value='';salvar();renderArt();}
function renderArt(){var h=artistas.map((a,i)=>'<div style="display:flex;justify-content:space-between;align-items:center;padding:10px;background:#F3F4F6;border-radius:10px;margin-top:6px"><div><b>'+a.nome+'</b> - R$ '+a.cache+'</div><button onclick="artistas.splice('+i+',1);salvar();renderArt()" style="background:#EF4444;color:#fff;border:none;padding:6px 12px;border-radius:8px;font-weight:900">X</button></div>').join('');document.getElementById('lArt').innerHTML=h||'Nenhum músico';}
function renderCasa(){var h='';for(var k in casas){h+='<div style="display:flex;gap:6px;margin-top:8px;align-items:center"><b style="width:35px">'+k+'</b><input id="casa_'+k+'" value="'+casas[k]+'" style="flex:1;padding:8px;border:1px solid #ccc;border-radius:8px"><button onclick="casas[\''+k+'\']=document.getElementById(\'casa_'+k+'\').value;salvar();renderCasa()" style="padding:8px 12px;background:#22C55E;border:none;border-radius:8px;font-weight:900">OK</button></div>';}document.getElementById('fCasa').innerHTML=h;}
function renderFin(){var rel={},tot=0,sh=0;var cur=allDados[mesAtual]||{};for(var d in cur)for(var p=1;p<=6;p++){(cur[d]['P'+p]||[]).forEach(it=>{if(!it.nome)return;var q=it.turno=='AL+JA'?2:1;if(!rel[it.nome])rel[it.nome]={s:0,t:0};rel[it.nome].s+=q;var c=getValor(it.nome)*q;rel[it.nome].t+=c;tot+=c;sh+=q;});}
 var h='<div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:10px 0"><div style="background:#111;color:#fff;padding:12px;border-radius:12px;text-align:center">SHOWS<br><b style="font-size:20px">'+sh+'</b><br><small>'+mesLabel(mesAtual)+'</small></div><div style="background:#FBBF24;padding:12px;border-radius:12px;text-align:center">TOTAL<br><b style="font-size:20px">R$ '+tot+'</b><br><small>'+mesLabel(mesAtual)+'</small></div></div><table style="width:100%;font-size:13px;border-collapse:collapse"><tr><th style="background:#111;color:#fff;padding:10px;text-align:left">Músico</th><th style="background:#111;color:#fff;padding:10px">Shows</th><th style="background:#111;color:#fff;padding:10px">R$</th></tr>';
 for(var k in rel)h+='<tr><td style="padding:10px;border-bottom:1px solid #eee"><b>'+k+'</b></td><td style="text-align:center;padding:10px;border-bottom:1px solid #eee">'+rel[k].s+'</td><td style="text-align:right;padding:10px;border-bottom:1px solid #eee;color:green;font-weight:900">R$ '+rel[k].t+'</td></tr>';
 h+='</table>';if(Object.keys(rel).length==0)h='<div style="padding:20px;text-align:center;color:#999">Zerado - '+mesLabel(mesAtual)+' em aberto</div>';document.getElementById('finBox').innerHTML=h;}
function renderPlan(){var por={};var cur=allDados[mesAtual]||{};for(var d in cur)for(var p=1;p<=6;p++){(cur[d]['P'+p]||[]).forEach(it=>{if(!it.nome)return;if(!por[it.nome])por[it.nome]=[];por[it.nome].push({dia:d,casa:casas['P'+p]||p,turno:it.turno});});}
 var html='';for(var k in por){html+='<div style="background:#F3F4F6;padding:12px;border-radius:12px;margin-top:10px"><b>'+k+' - '+por[k].length+' shows em '+mesLabel(mesAtual)+'</b><div style="font-size:12px;margin-top:8px;display:flex;flex-wrap:wrap;gap:4px">'+por[k].map(x=>'<span style="background:#fff;border:1px solid #ddd;padding:4px 8px;border-radius:12px">'+x.dia+' '+getDiaSemana(mesAtual,x.dia)+' '+x.casa+' '+x.turno+'</span>').join('')+'</div></div>';}if(!html)html='<div style="padding:20px;text-align:center;color:#999">Zerado - '+mesLabel(mesAtual)+' em aberto</div>';document.getElementById('planBox').innerHTML=html;}
function exportar(){salvar();var dataStr=JSON.stringify({all:allDados,artistas:artistas,casas:casas,mes:mesAtual,versao:"ESTAGEFLOW_V9_CORRIGIDO_CALENDARIO_REAL",data:new Date().toISOString(),meses:mesesLista});var blob=new Blob([dataStr],{type:'application/json'});var a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='ESTAGEFLOW_BACKUP_CORRIGIDO_NOV26_A_DEZ27_'+new Date().toISOString().slice(0,10)+'.json';a.click();alert("✅ Backup CORRIGIDO exportado! Calendário real validado!");}
function importar(e){var f=e.target.files[0];if(!f)return;var r=new FileReader();r.onload=function(ev){try{var o=JSON.parse(ev.target.result);if(o.all)allDados=o.all;if(o.artistas)artistas=o.artistas.map(m=>({nome:(m.nome||m).toUpperCase(),cache:m.valor||m.cache||300}));if(o.casas)casas=o.casas;if(o.mes)mesAtual=o.mes;salvar();montarSeletores();montarGrade();alert('✅ Backup importado! Calendário corrigido aplicado!');closeAll();go('grade');}catch(err){alert('❌ Erro: '+err.message);}};r.readAsText(f);e.target.value='';}
window.addEventListener('beforeinstallprompt',(e)=>{e.preventDefault();deferredPrompt=e;});
function instalarApp(){if(deferredPrompt){deferredPrompt.prompt();}else{alert('📲 Android: Menu ⋮ > Instalar app\niPhone: Compartilhar □↑ > Adicionar à Tela de Início');}}
function compartilhar(){var q=contar();var texto='🎤 ESTAGEFLOW - '+mesLabel(mesAtual)+' - '+q+' shows';if(navigator.share){navigator.share({title:'ESTAGEFLOW',text:texto,url:window.location.href});}else{prompt('Link:',window.location.href);}}
function renderDia(d){
 var cont=document.getElementById('card_'+d);if(!cont)return;
 var sem=getDiaSemana(mesAtual,d);
 var html='<div class="diaTop"><div class="diaLeft">📅 '+d+' '+sem+'</div><div style="font-size:9px;background:#EFF6FF;color:#3B82F6;padding:3px 7px;border-radius:10px">'+(function(){var t=0;for(var p=1;p<=6;p++)t+=(allDados[mesAtual][d]['P'+p]||[]).filter(x=>x.nome).length;return t;})()+' esc.</div></div>';
 for(var p=1;p<=6;p++){
  var lista=allDados[mesAtual][d]['P'+p]||[{nome:"",turno:"AL"}];
  lista.forEach((item,idx)=>{
   var opts=artistas.map(a=>'<option '+(a.nome==item.nome?'selected':'')+'>'+a.nome+'</option>').join('');
   var isExtra=idx>0;var turnoCls=item.turno=="JA"?"ja":item.turno=="AL+JA"?"both":"al";
   html+='<div class="linhaCasa '+(item.nome?'preenchida':'')+(isExtra?' extra':'')+'"><b>'+(isExtra?'↳':'')+'P'+p+'</b><select class="selMus" onchange="mudarMus('+d+','+p+','+idx+',this.value)"><option value="">--</option>'+opts+'</select><select class="selTurno '+turnoCls+'" onchange="mudarTurno('+d+','+p+','+idx+',this.value)"><option '+(item.turno=="AL"?"selected":"")+'>AL</option><option '+(item.turno=="JA"?"selected":"")+'>JA</option><option '+(item.turno=="AL+JA"?"selected":"")+'>AL+JA</option></select><span class="printTxt">'+(item.nome||'--')+'</span><span class="printTurno '+turnoCls+'">'+item.turno+'</span>';
   if(!isExtra)html+='<button class="btnMais add" onclick="addExtra('+d+','+p+')">+</button>';else html+='<button class="btnMais del" onclick="delExtra('+d+','+p+','+idx+')">x</button>';
   html+='</div>';
  });
 }
 cont.innerHTML=html;
}
function montarGrade(){
 var grade=document.getElementById('grade');grade.innerHTML='';
 var dias=getDiasMes(mesAtual);
 for(var d=1;d<=dias;d++){var card=document.createElement('div');card.className='card';card.id='card_'+d;grade.appendChild(card);renderDia(d);}
 contar();
}
