<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ESTAGEFLOW - Calendario 1 ao 31</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:system-ui,Arial}
body{background:#F2F2F2}
.top{background:#111;display:flex;align-items:center;padding:10px 12px;position:sticky;top:0;z-index:10;color:#fff;gap:8px}
.top b{font-size:15px}
.top span.pill{font-size:8px;font-weight:900;padding:4px 8px;border-radius:10px}
.z{background:#FBBF24;color:#000}.r{background:#22C55E;color:#000}.f{background:#fff;color:#000}
.menu{margin-left:auto;background:0;border:0;color:#fff;font-size:22px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:6px;padding:6px}
@media(min-width:700px){.grid{grid-template-columns:repeat(4,1fr)}}
.card{background:#fff;border-radius:10px;padding:8px;border:1px solid #E5E7EB}
.card .dia{font-size:12px;font-weight:900;margin-bottom:6px;display:flex;justify-content:space-between;border-bottom:1px solid #eee;padding-bottom:4px}
.card .dia i{font-size:9px;background:#111;color:#fff;padding:2px 6px;border-radius:10px;font-style:normal}
.row{display:flex;gap:3px;margin-bottom:4px;align-items:center}
.row b{font-size:9px;width:22px}
.row select{font-size:10px;padding:3px;border-radius:5px;border:1px solid #D1D5DB;background:#fff;font-weight:600}
.row select.nome{flex:1}
.row select.turno{width:52px;text-align:center;font-weight:900}
.row select.turno.AL{background:#EDE9FE;color:#5B21B6}
.row select.turno.JA{background:#FFEDD5;color:#C2410C}
.row select.turno.ALJA{background:#DCFCE7;color:#166534}
</style>
</head>
<body>
<div class="top"><b>ESTAGEFLOW</b><span class="pill z" id="info">ZERADO</span><span class="pill r">FIXO</span><span class="pill f" onclick="print()">1 FOLHA</span><button class="menu" onclick="alert('ESTAGEFLOW - Menu: Grade, Relatorio, Casas, Musicos - Tudo fixo, nao apaga')">☰</button></div>
<div class="grid" id="grade"></div>
<script>
var musicos=["","ANDRE","EDILL / GERVASIO","GERVASIO","PAOLI","LUCIANO","YGOR","ISRAEL","RICK","VATA60","ANDERSON"];
var dados={};var KEY="ESTAGEFLOW_1_AO_31_P1_P5_AL_JA_FIXO_FINAL_2026";
function vazio(){dados={};for(var d=1;d<=31;d++){dados[d]={};for(var p=1;p<=6;p++)dados[d]['P'+p]={nome:"",turno:"AL"}}}
function salvar(){localStorage.setItem(KEY,JSON.stringify(dados));var c=0;for(var d=1;d<=31;d++)for(var p=1;p<=6;p++)if(dados[d]['P'+p].nome)c++;document.getElementById('info').textContent=c==0?'ZERADO':c+' SALVOS'}
function carregar(){var s=localStorage.getItem(KEY);if(s){try{dados=JSON.parse(s)}catch(e){vazio()}}else vazio()}
function muda(d,p,tipo,val){dados[d]['P'+p][tipo]=val;salvar();var el=document.getElementById('t_'+d+'_'+p);if(tipo=='turno'){el.className='turno '+val.replace('/','');if(val=='AL')el.className='turno AL';if(val=='JA')el.className='turno JA';if(val=='AL/JA')el.className='turno ALJA'}}
carregar();
var grade=document.getElementById('grade');
for(var d=1;d<=31;d++){
 var dt=new Date(2024,9,d);var sem=["DOM","SEG","TER","QUA","QUI","SEX","SAB"][dt.getDay()];
 var card=document.createElement('div');card.className='card';
 var h='<div class="dia"><span>'+d+' '+sem+'</span><i>'+sem+'</i></div>';
 for(var p=1;p<=6;p++){
  var cur=dados[d]['P'+p]||{nome:"",turno:"AL"};
  var opts=musicos.map(m=>'<option '+(m==cur.nome?'selected':'')+'>'+m+'</option>').join('');
  var cls=cur.turno=='AL/JA'?'ALJA':cur.turno;
  h+='<div class="row"><b>P'+p+'</b><select class="nome" onchange="muda('+d+','+p+',\'nome\',this.value)"><option value="">ESCOLHA</option>'+opts+'</select><select id="t_'+d+'_'+p+'" class="turno '+cls+'" onchange="muda('+d+','+p+',\'turno\',this.value)"><option value="AL" '+(cur.turno=='AL'?'selected':'')+'>AL</option><option value="JA" '+(cur.turno=='JA'?'selected':'')+'>JA</option><option value="AL/JA" '+(cur.turno=='AL/JA'?'selected':'')+'>AL/JA</option></select></div>';
 }
 card.innerHTML=h;grade.appendChild(card);
}
salvar();
setInterval(salvar,1000);
</script>
</body>
</html>
