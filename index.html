<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TAKI SOM V25 RECUPERA TUDO</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial}
body{background:#E9EEF3}
.top{background:#0F172A;color:#fff;padding:8px;display:flex;gap:6px;position:sticky;top:0;z-index:1000;align-items:center}
.top b{flex:1;font-size:10px} .top b span{color:#FACC15}
.top .saveStatus{font-size:9px;background:#22C55E;color:#000;padding:5px 8px;border-radius:8px;font-weight:900;max-width:65%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.top button{padding:7px 10px;border:none;border-radius:8px;font-weight:900;font-size:10px}
.btnMenuFull{background:#FACC15;color:#000;padding:14px;border:none;width:calc(100% - 12px);margin:6px;border-radius:12px;font-weight:900;font-size:15px}
.barBlack{background:#22C55E;color:#000;text-align:center;padding:8px;font-weight:900;font-size:11px}
.barTabs{background:#fff;padding:6px;display:flex;gap:4px;overflow:auto}
.barTabs button{padding:10px 14px;border:none;border-radius:20px;font-weight:900;font-size:12px;background:#F1F5F9}
.barTabs button.active{background:#1F2937;color:#fff}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:8px;padding:8px}
.diaCard{background:#fff;border:1.5px solid #111;border-radius:12px;padding:8px}
.diaHead{font-weight:900;color:#1E3A8A;font-size:12px;margin-bottom:6px;display:flex;justify-content:space-between}
.diaHead small{font-size:9px;color:#475569;background:#E2E8F0;padding:3px 6px;border-radius:6px}
.linha{display:flex;align-items:center;gap:4px;margin-bottom:5px;width:100%}
.linha .lbl{flex:0 0 18px;font-size:9px;font-weight:900}
.linha select.musico{flex:1;min-width:0;padding:7px 4px;border:1.5px solid #111;border-radius:8px;font-size:9px;font-weight:800;background:#fff}
.linha select.turno{flex:0 0 46px;min-width:46px;max-width:46px;padding:7px 0;border:1.5px solid #111;border-radius:8px;font-size:8px;font-weight:900;background:#EDE9FE;color:#4C1D95;text-align:center}
.cardBox{background:#fff;border-radius:14px;margin:8px;padding:14px}
.sec{display:none} .sec.show{display:block}
.drawer{position:fixed;top:0;left:-330px;width:310px;height:100%;background:#0F172A;color:#fff;z-index:5000;transition:.3s;padding:14px;overflow:auto}
.drawer.open{left:0}
.drawer button{width:100%;padding:13px;margin-bottom:7px;border:none;border-radius:10px;font-weight:800;text-align:left;background:#1E293B;color:#fff;font-size:13px}
.drawer button.yellow{background:#FACC15;color:#000;text-align:center}
.drawer button.green{background:#22C55E;color:#000;text-align:center;font-weight:900}
.drawer button.blue{background:#3B82F6;color:#fff;text-align:center;font-weight:900}
.drawer button.orange{background:#F97316;color:#fff;text-align:center;font-weight:900}
.drawer button.red{background:#EF4444;color:#fff;text-align:center;font-weight:900}
.fundo{position:fixed;inset:0;background:rgba(0,0,0,.5);display:none;z-index:4000} .fundo.show{display:block}
</style>
</head>
<body>
<div class="top"><b><span>TAKI</span> SOM V25</b><span class="saveStatus" id="saveStatus">Recuperando...</span><button style="background:#86EFAC" onclick="go('rel')">RELATORIO</button><button style="background:#fff" onclick="window.print()">1 FOLHA</button></div>
<button class="btnMenuFull" onclick="openMenu()">☰ MENU COMPLETO - CLIQUE AQUI</button>
<div class="fundo" id="fundo" onclick="closeMenu()"></div>
<div class="drawer" id="drawer">
<h3 style="color:#FACC15">☰ MENU V25 RECUPERA TUDO</h3>
<div style="background:#22C55E;color:#000;padding:10px;border-radius:10px;font-size:11px;font-weight:900;margin:8px 0;text-align:center" id="statusDrawer">Procurando...</div>
<div style="background:#1E293B;padding:8px;border-radius:8px;font-size:10px;margin-bottom:8px;text-align:center" id="contadorDrawer">0 shows</div>
<button class="green" onclick="forcarSalvar();alert('✅ SALVO!');">💾 SALVAR AGORA - NÃO APAGA</button>
<button class="red" onclick="recuperarTudo()">♻️ RECUPERAR DE NOVO (180 SHOWS)</button>
<button class="orange" onclick="exportar()">💾 EXPORTAR BACKUP</button>
<button class="blue" onclick="document.getElementById('fileIn').click()">📥 IMPORTAR BACKUP</button>
<input type="file" id="fileIn" accept=".json" style="display:none" onchange="importar(event)">
<hr style="margin:12px 0;border-color:#334155">
<button onclick="go('grade');closeMenu()">📅 Grade V25</button>
<button onclick="go('rel');closeMenu()">📊 Relatório + Cache</button>
<button onclick="go('art');closeMenu()">🎤 Artistas</button>
<button class="yellow" onclick="closeMenu()">✖ FECHAR</button>
</div>
<div class="barTabs"><button id="tab-grade" class="active" onclick="go('grade')">Grade</button><button id="tab-rel" onclick="go('rel')">Relatorio</button><button id="tab-art" onclick="go('art')">Artistas</button></div>
<div class="barBlack" id="barBlack">V25 - MOSTRANDO TODOS OS 180 SHOWS RECUPERADOS</div>
<div id="sec-grade" class="sec show"><div class="grid" id="grade"></div></div>
<div id="sec-rel" class="sec"><div class="cardBox"><h3>Relatório - Recuperado</h3><div id="resRel"></div></div></div>
<div id="sec-art" class="sec"><div class="cardBox"><h3>Artistas</h3><div style="display:flex;gap:6px;margin-top:10px"><input id="nomeArt" placeholder="NOME" style="flex:1;padding:10px;border-radius:8px;border:1px solid #ccc;font-weight:800;text-transform:uppercase"><input id="cacheArt" type="number" placeholder="R$" style="width:90px;padding:10px;border-radius:8px;border:1px solid #ccc;font-weight:800"></div><button onclick="addArt()" style="width:100%;margin-top:6px;padding:12px;background:#FACC15;border:none;border-radius:10px;font-weight:900">SALVAR</button><div id="listaArt"></div></div></div>
<script>
var artistas=[
{nome:"EDILL / GERVÁSIO",cache:500},{nome:"EDILL / GERVASIO",cache:500},
{nome:"ANDRE / GERVASIO",cache:500},{nome:"ANDRÉ / GERVÁSIO",cache:500},
{nome:"LUCIANO / GERVASIO",cache:500},{nome:"YGOR / GERVASIO",cache:500},
{nome:"ISRAEL / GERVASIO",cache:500},{nome:"ISRAEL / GERVÁSIO",cache:500},
{nome:"ANDERSON VAT 60 SOLO",cache:300},{nome:"ANDERSON VAT 60 DUO",cache:400},{nome:"ANDERSON VAT 60 TRIO",cache:500},
{nome:"VATA60",cache:250},{nome:"VAT60",cache:250},{nome:"RICK",cache:250},
{nome:"GERVASIO",cache:200},{nome:"GERVÁSIO",cache:200},{nome:"YGOR",cache:280},{nome:"EDILL",cache:300},{nome:"ANDRE",cache:300},{nome:"ANDRÉ",cache:300},{nome:"LUCIANO",cache:300},{nome:"ISRAEL",cache:300},{nome:"PAOLI",cache:320}
];
var casas={P1:"Cais",P2:"Vila",P3:"Grill",P4:"Ze",P5:"Omau",P6:"Vago"};
var dados={};
var diasSem=["DOM","SEG","TER","QUA","QUI","SEX","SAB"];
var KEY="TAKI_V25_FINAL";

function criaDadosVazio(){dados={};for(var d=1;d<=30;d++){dados[d]={};for(var p=1;p<=6;p++)dados[d]['P'+p]={nome:"",turno:"AL"};}}
function contarPreenchidos(objDados){ var c=0; try{ for(var d=1;d<=30;d++){ for(var p=1;p<=6;p++){ if(objDados[d] && objDados[d]['P'+p] && objDados[d]['P'+p].nome && objDados[d]['P'+p].nome!="") c++; } } }catch(e){} return c; }

function forcarSalvar(){
 try{
  localStorage.setItem(KEY, JSON.stringify({artistas:artistas,casas:casas,dados:dados,v:"V25"}));
  document.getElementById('saveStatus').textContent="✅ Salvo "+new Date().toLocaleTimeString().slice(0,5)+" - "+contarPreenchidos(dados)+" shows";
  document.getElementById('barBlack').textContent="✅ SALVO - "+contarPreenchidos(dados)+" SHOWS - PODE ATUALIZAR QUE NÃO APAGA";
  return true;
 }catch(e){ return false; }
}

function carregarMaisCompleto(){
 var melhor=null; var melhorCount=-1; var melhorOrigem="";
 try{
  for(var i=0;i<localStorage.length;i++){
   var k=localStorage.key(i); if(!k) continue; if(k.toUpperCase().indexOf("TAKI")==-1) continue;
   try{
    var raw=localStorage.getItem(k); if(!raw) continue;
    var o=JSON.parse(raw); if(!o.dados) continue;
    var cnt=contarPreenchidos(o.dados);
    if(cnt>melhorCount){ melhorCount=cnt; melhor=o; melhorOrigem=k; }
   }catch(e){}
  }
  if(melhor && melhorCount>0){
   casas=melhor.casas||casas;
   dados=melhor.dados;
   // junta artistas antigos com novos pra não perder nenhum nome
   if(melhor.artistas){
    for(var a=0;a<melhor.artistas.length;a++){
     var nomeAntigo=melhor.artistas[a].nome;
     if(!artistas.find(x=>x.nome==nomeAntigo)){ artistas.push(melhor.artistas[a]); }
    }
   }
   // também adiciona todos os nomes que aparecem nos dados mesmo se não tiver na lista de artistas
   for(var d=1;d<=30;d++){
    for(var p=1;p<=6;p++){
     if(dados[d] && dados[d]['P'+p] && dados[d]['P'+p].nome){
      var nm=dados[d]['P'+p].nome;
      if(nm && !artistas.find(x=>x.nome==nm)){ artistas.push({nome:nm,cache:300}); }
     }
    }
   }
   document.getElementById('saveStatus').textContent="✅ Recuperado "+melhorCount+" shows de "+melhorOrigem.substring(0,20);
   var sd=document.getElementById('statusDrawer'); if(sd) sd.textContent="✅ Recuperado "+melhorCount+" shows de "+melhorOrigem;
   var cd=document.getElementById('contadorDrawer'); if(cd) cd.textContent=melhorCount+" shows recuperados - já na grade";
   document.getElementById('barBlack').textContent="✅ RECUPERADO "+melhorCount+" SHOWS - AGORA APARECE TUDO NA GRADE";
   return true;
  }
 }catch(e){}
 return false;
}

function recuperarTudo(){
 var ok=carregarMaisCompleto();
 if(ok){ renderGrade(); renderArt(); renderRel(); forcarSalvar(); alert("✅ RECUPEREI "+contarPreenchidos(dados)+" SHOWS! Agora olha a grade, tem que aparecer tudo, não só EDILL / GERVASIO."); closeMenu(); go('grade'); }
 else{ alert("❌ Não achei backup. Mas o seu print mostrou 180 shows, tenta recarregar a página."); }
}
function openMenu(){document.getElementById('drawer').classList.add('open');document.getElementById('fundo').classList.add('show')}
function closeMenu(){document.getElementById('drawer').classList.remove('open');document.getElementById('fundo').classList.remove('show')}
function go(id){document.querySelectorAll('.sec').forEach(s=>s.classList.remove('show'));document.getElementById('sec-'+id).classList.add('show');document.querySelectorAll('.barTabs button').forEach(b=>b.classList.remove('active'));var t=document.getElementById('tab-'+id);if(t)t.classList.add('active');if(id=='grade')renderGrade();if(id=='rel')renderRel();if(id=='art')renderArt();}
function renderGrade(){
 var cont=document.getElementById('grade');cont.innerHTML='';
 for(var d=1;d<=30;d++){
  var dt=new Date(2026,10,d);var ds=diasSem[dt.getDay()];
  var card=document.createElement('div');card.className='diaCard';
  var html='<div class="diaHead"><span>'+d+' ▼</span><small>'+ds+'</small></div>';
  for(var p=1;p<=6;p++){
   var cur=dados[d]['P'+p] || {nome:"",turno:"AL"};
   // garante que o nome atual aparece mesmo se não estiver na lista
   var listaTemp=[...artistas];
   if(cur.nome && !listaTemp.find(x=>x.nome==cur.nome)){ listaTemp.unshift({nome:cur.nome,cache:300}); }
   var optsArt=listaTemp.map(a=>'<option value="'+a.nome+'" '+(a.nome==cur.nome?'selected':'')+'>'+a.nome+'</option>').join('');
   var optsTurno='<option '+(cur.turno=='AL'?'selected':'')+'>AL</option><option '+(cur.turno=='JA'?'selected':'')+'>JA</option><option '+(cur.turno=='AL/JA'?'selected':'')+'>AL/JA</option>';
   html+='<div class="linha"><span class="lbl">P'+p+':</span><select class="musico" onchange="dados['+d+']['+'P'+p+'].nome=this.value; forcarSalvar();"><option value="">ESCOLHA</option>'+optsArt+'</select><select class="turno" onchange="dados['+d+']['+'P'+p+'].turno=this.value; forcarSalvar();">'+optsTurno+'</select></div>';
  }
  card.innerHTML=html;cont.appendChild(card);
 }
}
function addArt(){var n=document.getElementById('nomeArt').value.toUpperCase().trim();var c=parseFloat(document.getElementById('cacheArt').value)||0;if(!n)return;var idx=artistas.findIndex(a=>a.nome==n);if(idx>=0)artistas[idx].cache=c;else artistas.push({nome:n,cache:c});document.getElementById('nomeArt').value='';document.getElementById('cacheArt').value='';renderArt();renderGrade();forcarSalvar();}
function renderArt(){document.getElementById('listaArt').innerHTML=artistas.map((a,i)=>'<div style="display:flex;justify-content:space-between;padding:10px;background:#F1F5F9;border-radius:8px;margin-top:4px"><div><b style="font-size:11px">'+a.nome+'</b><br><span style="color:green;font-weight:900;font-size:11px">R$ '+a.cache+'</span></div><button onclick="artistas.splice('+i+',1);renderArt();renderGrade();forcarSalvar()" style="background:#FFD2D2;border:none;padding:4px 8px;border-radius:6px">X</button></div>').join('');}
function renderCasa(){}
function getCache(nome){if(!nome) return 0; var base=nome.trim().split('/')[0].trim(); var f=artistas.find(a=>a.nome==base || a.nome==nome);return f?f.cache:300;}
function renderRel(){
 var rel={}; for(var d=1;d<=30;d++){ for(var p=1;p<=6;p++){ var inf=dados[d]['P'+p]; if(!inf||!inf.nome) continue; var nomes=inf.nome.split('/').map(s=>s.trim().toUpperCase()).filter(s=>s); var qtd=(inf.turno=='AL/JA'?2:1); for(var n=0;n<nomes.length;n++){ var nm=nomes[n]; if(!rel[nm]) rel[nm]={shows:0,total:0,lista:[]}; rel[nm].shows+=qtd; rel[nm].total+=getCache(nm)*qtd; rel[nm].lista.push('Dia '+d+' '+diasSem[new Date(2026,10,d).getDay()]+' P'+p+' '+inf.turno); } } }
 var html='';for(var k in rel){ var r=rel[k]; html+='<div style="background:#F9FAFB;padding:10px;border-radius:10px;margin-top:6px;border-left:4px solid #FACC15"><b>'+k+' - '+r.shows+' shows</b><div style="color:green;font-weight:900">R$ '+r.total+'</div><div style="font-size:10px">'+r.lista.join('<br>')+'</div></div>';}
 document.getElementById('resRel').innerHTML=html||'Nenhum show';
}
function exportar(){forcarSalvar(); var blob=new Blob([localStorage.getItem(KEY)],{type:'application/json'});var a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='BACKUP_TAKI_V25_180_SHOWS.json';a.click();}
function importar(e){var f=e.target.files[0]; if(!f) return; var r=new FileReader(); r.onload=function(ev){try{var o=JSON.parse(ev.target.result); artistas=o.artistas||artistas; casas=o.casas||casas; dados=o.dados; forcarSalvar(); renderGrade(); renderArt(); renderRel(); alert('✅ RECUPERADO!'); closeMenu(); go('grade');}catch(err){alert('Erro');}}; r.readAsText(f);}

var ok=carregarMaisCompleto();
if(!ok){ criaDadosVazio(); document.getElementById('saveStatus').textContent="Novo - 0 shows"; }
renderGrade(); renderArt(); renderRel();
forcarSalvar();
window.addEventListener('beforeunload', forcarSalvar);
</script>
</body>
</html>
