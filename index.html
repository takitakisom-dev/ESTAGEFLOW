<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NOVEMBRO 2026 - ESTAGEFLOW</title>
<link rel="manifest" href="manifest.json">
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial}
body{background:#f0f0f0;padding:12px}
h1{text-align:center;font-size:38px;color:#5a5a5a;margin:10px 0 16px;font-weight:900}
.header-row{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-bottom:6px}
.header-row div{background:#d3d3d3;text-align:center;padding:14px 2px;font-weight:700;color:#555;font-size:13px}
.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.cell{background:white;border:1px solid #ccc;min-height:142px;padding:5px 6px;cursor:pointer}
.cell .d{font-size:22px;font-weight:900;color:#4a4a4a}
.cell .txt{font-size:9.5px;line-height:1.35;font-weight:700}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.55);display:none;align-items:center;justify-content:center;z-index:99}
.modal.active{display:flex}
.box{background:white;width:100%;max-width:360px;border-radius:12px;padding:18px}
.box input{width:100%;padding:10px;border:1px solid #ccc;border-radius:8px;margin-top:4px}
.btns{display:flex;gap:8px;margin-top:16px}
.btn{flex:1;padding:12px;border:none;border-radius:8px;font-weight:800}
.save{background:#101828;color:white}
</style>
</head>
<body>
<h1>NOVEMBRO 2026</h1>
<div class="header-row"><div>Domingo</div><div>Segunda</div><div>Terça</div><div>Quarta</div><div>Quinta</div><div>Sexta</div><div>Sábado</div></div>
<div class="grid" id="grid"></div>
<div class="modal" id="modal"><div class="box">
<h3 id="mtitle">Editar</h3>
<label>P1</label><input id="P1"><label>P2</label><input id="P2"><label>P3/P4</label><input id="P34"><label>P5</label><input id="P5"><label>P6</label><input id="P6">
<div class="btns"><button class="btn" onclick="closeM()">Cancelar</button><button class="btn save" onclick="saveM()">Salvar</button></div>
</div></div>
<script>
const defaultData={2:{P1:"Cais - Eli",P2:"Vila Chopp - Grill",P3:"Grill do Zé - Y Gon",P5:"Omau - Vago",P6:"Vago - Israel"},3:{P1:"Cais - Eli",P2:"Vila Chopp - Grill",P3:"Grill - Luciary Gon",P5:"Omau - Vago",P6:"Vago - Israel"}};
let store=JSON.parse(localStorage.getItem('taki-nov2026-final')||'null')||{1:{P1:"Cais - Eli",P2:"Vila Chopp - Grill",P3:"Grill - Luciano Gon",P5:"Omau - Vago",P6:"Vago - Israel"},2:{P1:"Cais - Eli",P2:"Vila Chopp - Grill",P3:"Grill do Zé - Y Gon",P5:"Omau - Vago",P6:"Vago - Israel"},3:{P1:"Cais - Eli",P2:"Vila Chopp - Grill",P3:"Grill - Luciary Gon",P5:"Omau - Vago",P6:"Vago - Israel"},4:{P1:"Cais - Eli",P2:"Vila Chopp - Grill",P3:"Grill - Luciano Gon",P5:"Omau - Vago",P6:"Vago - Israel"},5:{P1:"Cais - Eli",P2:"Vila Chopp - Grill",P3:"Grill - Luciano",P5:"Omau - Vago",P6:"Vago - Israel"},6:{P1:"Cais - Eli",P2:"Vila Chopp - Grill",P3:"Grill - Luciano",P5:"Omau - Vago",P6:"Vago - Israel"},7:{P1:"Cais - Eli",P2:"Vila Chopp - Grill",P3:"Grill do Zé - Y Gon",P5:"Omau - Vago",P6:"Vago - Israel"},8:{P1:"Cais - Eli",P2:"Vila Chopp - Grill",P3:"Grill - Lucianr Gon",P5:"Omau - Vago",P6:"Vago - Israel"},9:{P1:"Cais - Eli",P2:"Vila Chopp - Grill",P3:"Grill - Luciano",P5:"Omau - Vago",P6:"Vago - Israel"},10:{P1:"Cais - Eli",P2:"Vila Chopp - Grill",P3:"Grill - Lucia Y Gon",P5:"Omau - Vago",P6:"Vago - Israel"},11:{P1:"Cais - Eli",P2:"Vila Chopp - Grill",P3:"Grill - Luciano",P5:"Omau - Vago",P6:"Vago - Israel"},12:{P1:"Cais - Eli",P2:"Vila Chopp - Grill",P3:"Grill - Luciano",P5:"Omau - Vago",P6:"Vago - Israel"},13:{P1:"Cais - Eli",P2:"Vila Chopp - Grill",P3:"Gar do Zé - Y Gon",P5:"Omau - Vago",P6:"Vago - Israel"},14:{P1:"Cais - Eli",P2:"Vila Chopp - Grill",P3:"Grill do Zé - Y Gon",P5:"Omau - Vago",P6:"Vago - Israel"},15:{P1:"Cais - Eli",P2:"Vila Chopp - Grill",P4:"Bar do Zé - Y Gon",P5:"Omau - Vago",P6:"Vago - Israel"},30:{P1:"Cais - Eli",P2:"Vila Chopp - Grill",P4:"Bar do Zé - Y Gon",P5:"Omau - Vago",P6:"Vago - Israel"}};
let curDay=null;const grid=document.getElementById('grid');
function render(){grid.innerHTML='';for(let i=1;i<=30;i++){const d=document.createElement('div');d.className='cell';d.onclick=()=>openM(i);const info=store[i]||{};let txt='';if(info.P1)txt+=`P1: ${info.P1}<br>`;if(info.P2)txt+=`P2: ${info.P2}<br>`;if(info.P3)txt+=`P3: ${info.P3}<br>`;if(info.P4)txt+=`P4: ${info.P4}<br>`;if(info.P5)txt+=`P5: ${info.P5}<br>`;if(info.P6)txt+=`P6: ${info.P6}<br>`;d.innerHTML=`<div class="d">${i}</div><div class="txt">${txt}</div>`;grid.appendChild(d);}}
function openM(day){curDay=day;document.getElementById('mtitle').innerText='Dia '+day;const inf=store[day]||{};document.getElementById('P1').value=inf.P1||'';document.getElementById('P2').value=inf.P2||'';document.getElementById('P34').value=inf.P3||inf.P4||'';document.getElementById('P5').value=inf.P5||'';document.getElementById('P6').value=inf.P6||'';document.getElementById('modal').classList.add('active');}
function closeM(){document.getElementById('modal').classList.remove('active');}
function saveM(){const p34=document.getElementById('P34').value;const isBar=p34.toLowerCase().includes('bar');store[curDay]={P1:document.getElementById('P1').value,P2:document.getElementById('P2').value,P3:isBar?'':p34,P4:isBar?p34:'',P5:document.getElementById('P5').value,P6:document.getElementById('P6').value};localStorage.setItem('taki-nov2026-final',JSON.stringify(store));closeM();render();}
render();
</script>
</body>
</html>
