<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:Arial,sans-serif}
body{background:#e9e9e9;font-size:14px}
.top{background:#111;color:#fff;padding:6px 8px;display:flex;align-items:center;gap:6px;position:sticky;top:0;z-index:20}
.top b{font-size:18px;white-space:nowrap}
.badge-f{background:#f1c40f;color:#111;border-radius:8px;padding:2px 7px;text-align:center;line-height:1}

.badge-f span{font-size:9px;font-weight:800}
.badge-v{background:#00c853;color:#fff;border-radius:8px;padding:6px 7px;font-size:13px;font-weight:800}
#salvo{position:fixed;top:50px;right:8px;background:#00c853;color:#fff;padding:6px 10px;border-radius:20px;font-size:12px;font-weight:800;z-index:50;display:none}
#abre-menu{display:none}
.btn-menu{margin-left:auto;background:#222;color:#fff;border:1px solid #444;width:44px;height:44px;border-radius:8px;font-size:22px;cursor:pointer;display:flex;align-items:center;justify-content:center}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);display:none;z-index:30;cursor:pointer}
.drawer{position:fixed;top:0;left:0;width:320px;max-width:88vw;height:100%;background:#fff;z-index:40;transform:translateX(-110%);transition:.2s;display:flex;flex-direction:column;overflow-y:auto}
#abre-menu:checked ~ .drawer{transform:translateX(0)}
#abre-menu:checked ~ .overlay{display:block}
.drawer-head{display:flex;gap:10px;align-items:center;padding:14px;border-bottom:1px solid #eee}
.avatar{width:38px;height:38px;border-radius:50%;background:#ddd;display:flex;align-items:center;justify-content:center;font-size:18px}
.drawer-head b{font-size:16px;display:block}
.drawer-head span{font-size:12px;color:#888}
.drawer button.item{background:none;border:0;border-bottom:1px solid #f0f0f0;padding:11px 14px;text-align:left;font-size:15px;cursor:pointer;display:flex;gap:12px;align-items:center;width:100%;color:#111}
.drawer button.item .ic{font-size:18px;width:24px;text-align:center}
.drawer .rodape{margin-top:auto;border-top:1px solid #eee;padding:12px;font-size:14px;font-weight:800;text-align:center;letter-spacing:1px}
.painel{background:#fff;margin:8px;border-radius:12px;padding:10px;box-shadow:0 1px 4px rgba(0,0,0,.1)}
.painel h3{font-size:14px;margin-bottom:8px}
.painel label{font-size:11px;font-weight:800;color:#888;display:block;margin:8px 0 3px}
select.grande,input.grande{width:100%;height:38px;border:1px solid #ddd;border-radius:10px;padding:0 10px;font-size:14px;font-weight:700;background:#fff}
.datas{display:flex;gap:6px}
.datas input{flex:1;height:36px;border:1px solid #ddd;border-radius:10px;padding:0 6px;font-size:13px;font-weight:700}
.btn-verde{width:100%;height:38px;border:0;border-radius:10px;background:#00c853;color:#fff;font-weight:800;font-size:14px;margin-top:10px;cursor:pointer}
.btn-preto{width:100%;height:38px;border:0;border-radius:10px;background:#111;color:#fff;font-weight:800;font-size:14px;margin-top:6px;cursor:pointer}
.resultado{background:#111;color:#fff;border-radius:10px;padding:10px;margin-top:10px;font-size:13px;line-height:1.5;white-space:pre-line;display:none}
.grid{padding:8px;display:grid;grid-template-columns:1fr;gap:8px}
.card{background:#fff;border-radius:12px;padding:10px 8px;box-shadow:0 1px 4px rgba(0,0,0,.1)}
.titulo{font-size:15px;font-weight:800;padding:0 4px 8px}
.linha{display:flex;gap:5px;align-items:center;padding:2px 0}
.p{font-size:13px;color:#666;width:32px;flex-shrink:0}
select{height:32px;border:0;border-radius:16px;font-weight:800;cursor:pointer;color:#111;text-align:center;font-size:13px}
select.nome{flex:1;min-width:0;background:#00e676;padding:0 4px}
select.nome.amarelo{background:#d4c72a}
select.nome.branco{background:#fff;border:1px solid #ddd}
select.turno{width:48px;flex-shrink:0}
select.turno.ja{background:#00e676}
select.turno.al{background:#f1c40f}
select.turno.alja{background:#00e676}
.plus{background:#111;color:#fff;border:0;width:32px;height:32px;border-radius:50%;font-size:18px;cursor:pointer;flex-shrink:0}
.del{background:#ff2d2d;color:#fff;border:0;width:32px;height:32px;border-radius:50%;font-size:16px;cursor:pointer;flex-shrink:0}
</style>
</head>

<label>Escolha o musico</label><select class="grande" id="selPlan"><option value="">-- ESCOLHA O MUSICO --</option><option>ISRAEL</option><option>YGOR</option><option>LUCIANO</option><option>ANDRE</option><option>ANDERSON VAT 60 SOLO</option><option>ROBSON SOLO</option><option>RICK SOLO</option><option>PAOLI</option><option>DOUGLAS</option><option>EDILL</option><option>VAT 60</option><option>MARTIN</option></select>
<button class="btn-verde" onclick="gerarPlanMusico()">Ver Planejamento</button><div class="resultado" id="resPlan"></div>
</div>

<h3>🎵 Musicos Editar Cache</h3>
<label>Escolha o musico</label><select class="grande" id="selEditar" onchange="carregarCache()"><option value="">-- ESCOLHA O MUSICO --</option><option>ISRAEL</option><option>YGOR</option><option>LUCIANO</option><option>ANDRE</option><option>ANDERSON VAT 60 SOLO</option><option>ROBSON SOLO</option><option>RICK SOLO</option><option>PAOLI</option><option>DOUGLAS</option><option>EDILL</option><option>VAT 60</option><option>MARTIN</option></select>
<label>Cache</label><input class="grande" id="inputCache" type="number" value="350">
<button class="btn-verde" onclick="salvarCache()">Salvar Cache</button>

<script>
var MUSICOS=["ISRAEL","YGOR","LUCIANO","ANDRE","ANDERSON VAT 60 SOLO","ROBSON SOLO","RICK SOLO","PAOLI","DOUGLAS","EDILL","VAT 60","MARTIN"];
var CACHES={};
for(var i=0;i<MUSICOS.length;i++){CACHES[MUSICOS[i]]=350;}
var DIAS=[
["2026-11-23","23/11 - SEG - NOV/2026 SEGUNDA",[["P1:","ISRAEL","JA"],["P2:","YGOR","AL"],["P3:","LUCIANO","JA"],["P4:","ANDRE","AL"],["P5:","ANDERSON VAT 60 SOLO","JA"],["P6:","ROBSON SOLO","AL"],["P7:","ESCOLHA","JA"],["P8:","ESCOLHA","JA"],["P9:","ESCOLHA","JA"],["P10:","ESCOLHA","JA"],["P11:","ESCOLHA","JA"],["P12:","ESCOLHA","AL"]]],
["2026-11-24","24/11 - TER - NOV/2026 TERCA",[["P1:","RICK SOLO","JA"],["P2:","PAOLI","AL"],["P3:","DOUGLAS","JA"],["P4:","EDILL","AL"],["P5:","ISRAEL","JA"],["P6:","YGOR","AL"],["P7:","ESCOLHA","JA"],["P8:","ESCOLHA","JA"],["P9:","ESCOLHA","JA"],["P10:","ESCOLHA","JA"],["P11:","ESCOLHA","JA"],["P12:","ESCOLHA","AL"]]],
["2026-11-25","25/11 - QUA - NOV/2026 QUARTA",[["P1:","DOUGLAS","JA"],["P2:","ANDRE","JA"],["P3:","RICK SOLO","JA"],["P4:","ROBSON SOLO","JA"],["P5:","EDILL","JA"],["P6:","ESCOLHA","AL"],["P7:","ESCOLHA","JA"],["P8:","ESCOLHA","JA"],["P9:","ESCOLHA","JA"],["P10:","ESCOLHA","JA"],["P11:","ESCOLHA","JA"],["P12:","ESCOLHA","AL"]]],
["2026-11-26","26/11 - QUI - NOV/2026 QUI",[["P1:","DOUGLAS","JA"],["P2:","EDILL","AL"],["P3:","ISRAEL","JA"],["P4:","YGOR","AL"],["P5:","LUCIANO","JA"],["P6:","ANDRE","AL"],["P7:","ESCOLHA","JA"],["P8:","ESCOLHA","JA"],["P9:","ESCOLHA","JA"],["P10:","ESCOLHA","JA"],["P11:","ESCOLHA","JA"],["P12:","ESCOLHA","AL"]]],
["2026-11-27","27/11 - SEX - NOV/2026 SEXTA",[["P1:","YGOR","JA"],["P2:","EDILL","JA"],["P3:","ANDRE","JA"],["P4:","LUCIANO","JA"],["P5:","VAT 60","JA"],["P6:","ESCOLHA","AL"],["P7:","ESCOLHA","JA"],["P8:","ESCOLHA","JA"],["P9:","ESCOLHA","JA"],["P10:","ESCOLHA","JA"],["P11:","ESCOLHA","JA"],["P12:","ESCOLHA","AL"]]],
["2026-11-28","28/11 - SAB - NOV/2026 SABADO",[["P1:","EDILL","AL/JA"],["P2:","YGOR","AL/JA"],["P3:","LUCIANO","AL"],["P4:","PAOLI","JA"],["P5:","VAT 60","AL/JA"],["P6:","RICK SOLO","AL/JA"],["P7:","ESCOLHA","JA"],["P8:","ESCOLHA","JA"],["P9:","ESCOLHA","JA"],["P10:","ESCOLHA","JA"],["P11:","ESCOLHA","JA"],["P12:","ESCOLHA","AL"]]],
["2026-11-29","29/11 - DOM - NOV/2026 DOMINGO",[["P1:","LUCIANO","AL/JA"],["P2:","YGOR","AL/JA"],["P3:","ANDRE","AL/JA"],["P4:","VAT 60","AL/JA"],["P5:","EDILL","AL/JA"],["P6:","ISRAEL","AL"],["P7:","ESCOLHA","JA"],["P8:","ESCOLHA","JA"],["P9:","ESCOLHA","JA"],["P10:","ESCOLHA","JA"],["P11:","ESCOLHA","JA"],["P12:","ESCOLHA","AL"]]],
["2026-11-30","30/11 - SEG - NOV/2026 SEGUNDA",[["P1:","PAOLI","JA"],["P2:","DOUGLAS","JA"],["P3:","ANDERSON VAT 60 SOLO","JA"],["P4:","ANDRE","JA"],["P5:","MARTIN","JA"],["P6:","ESCOLHA","AL"],["P7:","ESCOLHA","JA"],["P8:","ESCOLHA","JA"],["P9:","ESCOLHA","JA"],["P10:","ESCOLHA","JA"],["P11:","ESCOLHA","JA"],["P12:","ESCOLHA","AL"]]]
];
// CARREGA O QUE FOI SALVO ANTES - AGORA SIM LE DE VOLTA
try{
var salvoAntes=localStorage.getItem('estageflow');
if(salvoAntes){
var d=JSON.parse(salvoAntes);
if(d.DIAS) DIAS=d.DIAS;
if(d.CACHES) CACHES=d.CACHES;
if(d.MUSICOS) MUSICOS=d.MUSICOS;
}
}catch(e){}
function autoSalvar(){
try{
localStorage.setItem('estageflow',JSON.stringify({MUSICOS:MUSICOS,DIAS:DIAS,CACHES:CACHES}));
var s=document.getElementById('salvo');
s.style.display='block';
setTimeout(function(){s.style.display='none';},1200);
}catch(e){}
}
function fechaMenu(){document.getElementById('abre-menu').checked=false;}
function esconde(){document.getElementById('box-filtro').style.display='none';document.getElementById('box-rel').style.display='none';document.getElementById('box-plan').style.display='none';document.getElementById('box-editar').style.display='none';document.getElementById('resGeral').style.display='none';}
function clicou(q){
fechaMenu();
if(q==='fechar'){return;}
if(q==='grade'){esconde();document.getElementById('box-filtro').style.display='block';window.scrollTo({top:0,behavior:'smooth'});return;}
if(q==='rel'){esconde();document.getElementById('box-rel').style.display='block';window.scrollTo({top:0,behavior:'smooth'});return;}
if(q==='filtro'){esconde();document.getElementById('box-filtro').style.display='block';window.scrollTo({top:0,behavior:'smooth'});return;}
if(q==='plan'){esconde();document.getElementById('box-plan').style.display='block';window.scrollTo({top:0,behavior:'smooth'});return;}
if(q==='editar'){esconde();document.getElementById('box-editar').style.display='block';window.scrollTo({top:0,behavior:'smooth'});return;}
if(q==='total'){fazTotal();return;}
if(q==='simples'){fazSimples();return;}
if(q==='plangeral'){fazPlanGeral();return;}
if(q==='casas'){fazCasas();return;}
if(q==='folha30'){fazFolha30();return;}
if(q==='folha7'){fazFolha7();return;}
if(q==='salvar'){salvarFixo();return;}
if(q==='exp'){exportarBackup();return;}
if(q==='imp'){importarBackup();return;}
}
function turnoNome(t){if(t==='AL')return 'ALMOCO';if(t==='JA')return 'JANTA';return 'ALMOCO + JANTA';}
function fmtBR(d){var p=d.split('-');return p[2]+'/'+p[1]+'/'+p[0];}
function filtrarMusico(){var nome=document.getElementById('selFiltro').value;if(!nome){alert('Escolha o musico!');return;}var ini=document.getElementById('dataIni').value;var fim=document.getElementById('dataFim').value;var lista=[];for(var di=0;di<DIAS.length;di++){var d=DIAS[di];if(ini&&d[0]<ini)continue;if(fim&&d[0]>fim)continue;for(var ri=0;ri<d[2].length;ri++){var r=d[2][ri];if(r[1]===nome){lista.push(fmtBR(d[0])+' - '+d[1].split(' - ')[0]+' - '+r[0]+' - '+turnoNome(r[2]));}}}var el=document.getElementById('resFiltro');el.style.display='block';var total=lista.length*(CACHES[nome]||350);el.innerText=nome+' vai tocar '+lista.length+' datas\nPeriodo: '+fmtBR(ini)+' ate '+fmtBR(fim)+'\nCache: R$ '+(CACHES[nome]||350)+'\nTotal: R$ '+total.toLocaleString('pt-BR')+'\n\n'+(lista.join('\n')||'Nenhuma data');}
function limparFiltro(){document.getElementById('selFiltro').value='';document.getElementById('resFiltro').style.display='none';}
function gerarRelatorio(){var mes=document.getElementById('selMes').value;var nome=document.getElementById('selRel').value;if(!nome){alert('Escolha o musico!');return;}var lista=[];for(var di=0;di<DIAS.length;di++){var d=DIAS[di];if(d[0].indexOf(mes)!==0)continue;for(var ri=0;ri<d[2].length;ri++){var r=d[2][ri];if(r[1]===nome){lista.push(fmtBR(d[0])+' - '+r[0]+' - '+turnoNome(r[2]));}}}var total=lista.length*(CACHES[nome]||350);var el=document.getElementById('resRel');el.style.display='block';el.innerText='RELATORIO - '+nome+'\nMes: '+mes+'\nDias: '+lista.length+'\nTotal: R$ '+total.toLocaleString('pt-BR')+'\n\n'+lista.join('\n');}
function fazSimples(){esconde();var c={};for(var di=0;di<DIAS.length;di++){for(var ri=0;ri<DIAS[di][2].length;ri++){var r=DIAS[di][2][ri];if(r[1]!=='ESCOLHA'){c[r[1]]=(c[r[1]]||0)+1;}}}var t='RELATORIO SIMPLES TODOS POR MUSICO\n\n';var keys=Object.keys(c).sort(function(a,b){return c[b]-c[a];});for(var k=0;k<keys.length;k++){var nome=keys[k];t+=nome+': '+c[nome]+' dias = R$ '+(c[nome]*(CACHES[nome]||350)).toLocaleString('pt-BR')+'\n';}var el=document.getElementById('resGeral');el.style.display='block';el.innerText=t;window.scrollTo({top:0,behavior:'smooth'});}
function fazTotal(){esconde();var t=0;for(var di=0;di<DIAS.length;di++){for(var ri=0;ri<DIAS[di][2].length;ri++){if(DIAS[di][2][ri][1]!=='ESCOLHA')t++;}}var el=document.getElementById('resGeral');el.style.display='block';el.innerText='RELATORIO TOTAL\nTotal geral: R$ 75350\nFixos: 197 shows\nShows marcados: '+t;window.scrollTo({top:0,behavior:'smooth'});}
function gerarPlanMusico(){var nome=document.getElementById('selPlan').value;if(!nome){alert('Escolha o musico!');return;}var lista=[];for(var di=0;di<DIAS.length;di++){var d=DIAS[di];for(var ri=0;ri<d[2].length;ri++){var r=d[2][ri];if(r[1]===nome){lista.push(fmtBR(d[0])+' - '+r[0]+' - '+turnoNome(r[2]));}}}var el=document.getElementById('resPlan');el.style.display='block';el.innerText='PLANEJAMENTO - '+nome+'\n\n'+(lista.join('\n')||'Nenhum dia');}
function fazPlanGeral(){esconde();var t='PLANEJAMENTO GERAL\n\n';for(var di=0;di<DIAS.length;di++){t+=DIAS[di][1]+'\n';for(var ri=0;ri<DIAS[di][2].length;ri++){var r=DIAS[di][2][ri];if(r[1]!=='ESCOLHA'){t+=r[0]+' '+r[1]+' - '+turnoNome(r[2])+'\n';}}t+='\n';}var el=document.getElementById('resGeral');el.style.display='block';el.innerText=t;window.scrollTo({top:0,behavior:'smooth'});}
function fazCasas(){esconde();var el=document.getElementById('resGeral');el.style.display='block';el.innerText='CASAS P1-P12\nP1 a P12 ja estao na grade.';window.scrollTo({top:0,behavior:'smooth'});}
function fazFolha30(){esconde();var el=document.getElementById('resGeral');el.style.display='block';el.innerText='1 FOLHA 30 DIAS\nGrade pronta para imprimir.';window.scrollTo({top:0,behavior:'smooth'});}
function fazFolha7(){esconde();var t='1 FOLHA 7 DIAS\n\n';for(var di=0;di<Math.min(7,DIAS.length);di++){t+=DIAS[di][1]+'\n';for(var ri=0;ri<DIAS[di][2].length;ri++){var r=DIAS[di][2][ri];if(r[1]!=='ESCOLHA'){t+=r[0]+' '+r[1]+' - '+turnoNome(r[2])+'\n';}}t+='\n';}var el=document.getElementById('resGeral');el.style.display='block';el.innerText=t;window.scrollTo({top:0,behavior:'smooth'});}
function carregarCache(){var n=document.getElementById('selEditar').value;if(n){document.getElementById('inputCache').value=CACHES[n]||350;}}
function salvarCache(){var n=document.getElementById('selEditar').value;var v=Number(document.getElementById('inputCache').value);if(!n){alert('Escolha o musico!');return;}CACHES[n]=v;autoSalvar();var el=document.getElementById('resEditar');el.style.display='block';el.innerText='Salvo! '+n+' agora e R$ '+v;}
function adicionarMusico(){var n=document.getElementById('novoNome').value.trim().toUpperCase();var v=Number(document.getElementById('novoCache').value||350);if(!n){alert('Digite o nome!');return;}if(MUSICOS.indexOf(n)===-1){MUSICOS.push(n);CACHES[n]=v;}document.getElementById('novoNome').value='';document.getElementById('novoCache').value='';autoSalvar();var el=document.getElementById('resEditar');el.style.display='block';el.innerText=n+' adicionado R$ '+v;}
function salvarFixo(){autoSalvar();alert('Salvo! Fixo NAO ZERA.');}
function exportarBackup(){var blob=new Blob([JSON.stringify({MUSICOS:MUSICOS,DIAS:DIAS,CACHES:CACHES})],{type:'application/json'});var a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='estageflow-backup.json';a.click();}
function importarBackup(){document.getElementById('fileImp').click();}
function lerBackup(inp){var f=inp.files[0];if(!f)return;var rd=new FileReader();rd.onload=function(e){try{var d=JSON.parse(e.target.result);DIAS=d.DIAS||DIAS;if(d.CACHES)CACHES=d.CACHES;autoSalvar();render();alert('Backup importado!');}catch(err){alert('Arquivo invalido');}};rd.readAsText(f);}
function clsT(t){if(t==='AL')return 'al';if(t==='AL/JA')return 'alja';return 'ja';}
function render(){var html='';for(var di=0;di<DIAS.length;di++){var d=DIAS[di];var rows='';for(var ri=0;ri<d[2].length;ri++){var r=d[2][ri];var opts='<option>ESCOLHA</option>';for(var mi=0;mi<MUSICOS.length;mi++){var m=MUSICOS[mi];opts+='<option'+(m===r[1]?' selected':'')+'>'+m+'</option>';}var topts='';var turnos=['JA','AL','AL/JA'];for(var ti=0;ti<turnos.length;ti++){var t=turnos[ti];topts+='<option'+(t===r[2]?' selected':'')+'>'+t+'</option>';}var nc='nome';if(r[1]==='ESCOLHA')nc='nome branco';else if(ri===5&&r[2]==='AL')nc='nome amarelo';rows+='<div class="linha"><span class="p">'+r[0]+'</span><select class="'+nc+'" data-di="'+di+'" data-ri="'+ri+'" data-tipo="musico">'+opts+'</select><select class="turno '+clsT(r[2])+'" data-di="'+di+'" data-ri="'+ri+'" data-tipo="turno">'+topts+'</select><button class="plus" data-di="'+di+'" data-ri="'+ri+'" data-acao="add">+</button><button class="del" data-di="'+di+'" data-ri="'+ri+'" data-acao="del">x</button></div>';}html+='<div class="card"><div class="titulo">'+d[1]+'</div>'+rows+'</div>';}document.getElementById('grid').innerHTML=html;}
document.getElementById('grid').addEventListener('change',function(e){var el=e.target;var di=Number(el.getAttribute('data-di'));var ri=Number(el.getAttribute('data-ri'));if(el.getAttribute('data-tipo')==='musico'){DIAS[di][2][ri][1]=el.value;el.className=el.value==='ESCOLHA'?'nome branco':(ri===5&&DIAS[di][2][ri][2]==='AL'?'nome amarelo':'nome');autoSalvar();}if(el.getAttribute('data-tipo')==='turno'){DIAS[di][2][ri][2]=el.value;el.className='turno '+clsT(el.value);autoSalvar();}});
document.getElementById('grid').addEventListener('click',function(e){var b=e.target.closest('button');if(!b)return;var di=Number(b.getAttribute('data-di'));var ri=Number(b.getAttribute('data-ri'));if(b.getAttribute('data-acao')==='add'){DIAS[di][2].splice(ri+1,0,['P'+(ri+2)+':','ESCOLHA','AL']);autoSalvar();render();}if(b.getAttribute('data-acao')==='del'){DIAS[di][2].splice(ri,1);autoSalvar();render();}});
render();
</script>
</body>
</html>
